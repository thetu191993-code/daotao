<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Gác An Ninh EHS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; } /* Giao diện tối cho phòng bảo vệ */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-200 h-screen flex flex-col overflow-hidden">

    <!-- TOAST -->
    <div id="toast" class="fixed top-5 right-5 z-[200] transform transition-all duration-300 translate-x-[150%] flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-white bg-slate-800 border border-slate-700">
        <i id="toast-icon" class="text-2xl"></i>
        <span id="toast-message"></span>
    </div>

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shrink-0 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                <i class="ph-fill ph-shield-check text-3xl"></i>
            </div>
            <div>
                <h1 class="font-black text-2xl text-white tracking-tight">TRẠM GÁC AN NINH</h1>
                <p class="text-blue-400 font-bold text-sm tracking-widest uppercase">EHS Security Checkpoint</p>
            </div>
        </div>
        <div class="text-right">
            <p id="live-time" class="text-3xl font-black text-white font-mono tracking-wider"></p>
            <p id="live-date" class="text-slate-400 font-bold text-sm"></p>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- CỘT TRÁI: KIỂM SOÁT VÀO RA -->
        <div class="w-full lg:w-1/2 p-4 sm:p-6 flex flex-col h-full border-r border-slate-800">
            <h2 class="font-black text-xl text-white mb-4 flex items-center gap-2"><i class="ph-fill ph-fingerprint text-blue-500"></i> KIỂM SOÁT NHÂN SỰ VÀO/RA</h2>
            
            <div class="relative mb-6 shrink-0">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="ph-bold ph-magnifying-glass text-slate-400 text-2xl"></i></div>
                <input type="text" id="search-input" onkeyup="window.searchWorker()" class="w-full pl-12 pr-4 py-4 bg-slate-800 border border-slate-700 rounded-2xl text-white placeholder-slate-500 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-lg font-bold transition shadow-inner" placeholder="Quét mã vạch hoặc nhập CCCD / Tên...">
            </div>

            <div class="flex-1 overflow-y-auto custom-scrollbar bg-slate-900/50 rounded-2xl border border-slate-800 p-2 space-y-2" id="search-results">
                <div class="h-full flex flex-col items-center justify-center text-slate-600">
                    <i class="ph-fill ph-scan text-6xl mb-2 opacity-50"></i>
                    <p class="font-bold">Nhập thông tin để tìm kiếm nhân sự</p>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: BẢNG TIN GIẤY PHÉP (PTW) -->
        <div class="w-full lg:w-1/2 p-4 sm:p-6 flex flex-col h-full bg-slate-900/30 relative">
            <!-- Loader -->
            <div id="ptw-loader" class="absolute inset-0 bg-slate-900/80 z-10 flex flex-col items-center justify-center hidden">
                <i class="ph-bold ph-spinner animate-spin text-4xl text-amber-500 mb-2"></i>
                <p class="font-bold text-slate-300">Đang đồng bộ Giấy Phép...</p>
            </div>

            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="font-black text-xl text-white flex items-center gap-2">
                    <i class="ph-fill ph-warning-circle text-amber-500 animate-pulse"></i> GIẤY PHÉP THI CÔNG (HÔM NAY)
                </h2>
                <span id="ptw-count" class="bg-amber-500/20 text-amber-400 px-3 py-1 rounded-lg font-black text-sm border border-amber-500/30">0 Giấy phép</span>
            </div>

            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2" id="ptw-list">
                <!-- Javascript sẽ nạp thẻ giấy phép vào đây -->
            </div>
        </div>
    </main>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7iFVmgoUL-sW3UlaMV0rlNQYugFiw2uA",
            authDomain: "ehs-training-app.firebaseapp.com",
            projectId: "ehs-training-app",
            storageBucket: "ehs-training-app.firebasestorage.app",
            messagingSenderId: "354083430003",
            appId: "1:354083430003:web:059953b7b9c1a9470a5406"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ĐỒNG HỒ LIVE
        function updateClock() {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            document.getElementById('live-date').innerText = now.toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000); updateClock();

        // HIỂN THỊ THÔNG BÁO
        window.showToast = function(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            if (type === "success") { toast.className = "fixed top-5 right-5 z-[200] transform transition-all duration-300 flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-emerald-400 bg-slate-800 border border-emerald-900"; icon.className = "ph-fill ph-check-circle text-2xl text-emerald-500"; } 
            else { toast.className = "fixed top-5 right-5 z-[200] transform transition-all duration-300 flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-red-400 bg-slate-800 border border-red-900"; icon.className = "ph-fill ph-warning-circle text-2xl text-red-500"; }
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-x-[150%]');
            setTimeout(() => { toast.classList.add('translate-x-[150%]'); }, 3000);
        }

        // ============================================================================
        // 1. TÍNH NĂNG TÌM KIẾM VÀ CHẤM CÔNG NHÂN SỰ
        // ============================================================================
        let rawWorkers = [];
        let globalApprovalMap = {};

        async function loadWorkersData() {
            try {
                // Lấy trạng thái phê duyệt của công ty
                const taskSnap = await getDocs(query(collection(db, "ehs_tasks"), where("task_type", "==", "contractor_approval")));
                globalApprovalMap = {};
                taskSnap.forEach(doc => {
                    const t = doc.data();
                    if (!globalApprovalMap[t.assigner_name] || t.created_at > globalApprovalMap[t.assigner_name].time) {
                        globalApprovalMap[t.assigner_name] = { status: t.status, time: t.created_at };
                    }
                });

                // Lấy danh sách nhân sự
                const snap = await getDocs(collection(db, "nha_thau_nhan_su"));
                rawWorkers = [];
                snap.forEach(doc => rawWorkers.push({ id: doc.id, ...doc.data() }));
            } catch(e) { console.error("Lỗi tải nhân sự:", e); }
        }

        window.searchWorker = function() {
            const kw = document.getElementById('search-input').value.toLowerCase().trim();
            const resDiv = document.getElementById('search-results');
            
            if(kw.length < 2) {
                resDiv.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-600"><i class="ph-fill ph-scan text-6xl mb-2 opacity-50"></i><p class="font-bold">Nhập thông tin để tìm kiếm nhân sự</p></div>`;
                return;
            }

            const filtered = rawWorkers.filter(w => (w.ho_ten && w.ho_ten.toLowerCase().includes(kw)) || (w.cccd && w.cccd.toLowerCase().includes(kw)) || (w.cong_ty && w.cong_ty.toLowerCase().includes(kw)));

            if(filtered.length === 0) {
                resDiv.innerHTML = `<div class="p-8 text-center text-red-400 font-bold bg-red-900/20 rounded-xl border border-red-900/50"><i class="ph-fill ph-warning text-3xl mb-2"></i><br>Không tìm thấy nhân sự này trong hệ thống.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(w => {
                let compStatus = globalApprovalMap[w.cong_ty] ? globalApprovalMap[w.cong_ty].status : 'None';
                let isApproved = (compStatus === 'Done');
                
                let statusBadge = isApproved 
                    ? `<span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-xs font-black border border-emerald-500/30"><i class="ph-bold ph-check"></i> Hợp lệ</span>`
                    : `<span class="bg-red-500/20 text-red-400 px-2 py-1 rounded text-xs font-black border border-red-500/30 animate-pulse"><i class="ph-bold ph-x"></i> CÔNG TY CHƯA ĐƯỢC DUYỆT</span>`;

                html += `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="w-full sm:w-auto">
                            <h3 class="font-black text-white text-lg">${w.ho_ten}</h3>
                            <p class="text-sm font-bold text-blue-400 mb-1">${w.cong_ty}</p>
                            <div class="flex gap-3 text-xs text-slate-400 mb-2 font-medium">
                                <span><i class="ph-bold ph-identification-card"></i> CCCD: ${w.cccd}</span>
                                <span><i class="ph-bold ph-shield-plus"></i> ${w.nhom_atld}</span>
                            </div>
                            ${statusBadge}
                        </div>
                        <div class="flex flex-row sm:flex-col gap-2 w-full sm:w-auto shrink-0">
                            <button onclick="window.recordEntry('${w.cong_ty.replace(/'/g, "\\'")}', '${w.ho_ten.replace(/'/g, "\\'")}', 'VÀO')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 sm:py-2 px-6 rounded-xl shadow-[0_0_15px_rgba(5,150,105,0.4)] transition flex items-center justify-center gap-2 ${!isApproved ? 'opacity-50 cursor-not-allowed' : ''}" ${!isApproved ? 'disabled' : ''}>
                                <i class="ph-bold ph-sign-in text-xl"></i> CHO VÀO
                            </button>
                            <button onclick="window.recordEntry('${w.cong_ty.replace(/'/g, "\\'")}', '${w.ho_ten.replace(/'/g, "\\'")}', 'RA')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 sm:py-2 px-6 rounded-xl transition flex items-center justify-center gap-2 border border-slate-600">
                                <i class="ph-bold ph-sign-out text-xl"></i> CHO RA
                            </button>
                        </div>
                    </div>
                `;
            });
            resDiv.innerHTML = html;
        }

        window.recordEntry = async function(congTy, hoTen, loai) {
            const nhaMay = prompt(`Nhập khu vực / Nhà máy mà [${hoTen}] vào làm việc:\n(Gõ 1 cho NM Can, 2 cho NM End, hoặc tên khu vực)`);
            if(nhaMay === null) return; // Hủy

            try {
                await addDoc(collection(db, "nha_thau_cham_cong"), {
                    cong_ty: congTy,
                    ho_ten: hoTen,
                    nha_may: nhaMay || 'Không rõ',
                    trang_thai: loai,
                    thoi_gian: new Date()
                });
                window.showToast(`Ghi nhận ${hoTen} [${loai}] thành công!`);
                document.getElementById('search-input').value = '';
                document.getElementById('search-results').innerHTML = `<div class="h-full flex flex-col items-center justify-center text-emerald-500"><i class="ph-fill ph-check-circle text-6xl mb-2"></i><p class="font-bold">Đã lưu thông tin ra/vào</p></div>`;
            } catch(e) { window.showToast("Lỗi: " + e.message, "error"); }
        }

        // ============================================================================
        // 2. GIAI ĐOẠN 3: TẢI DANH SÁCH GIẤY PHÉP PTW HÔM NAY (ĐÃ DUYỆT)
        // ============================================================================
        async function loadTodayPTW() {
            document.getElementById('ptw-loader').classList.remove('hidden');
            const ptwList = document.getElementById('ptw-list');
            ptwList.innerHTML = '';
            
            try {
                // Lấy tất cả giấy phép ĐÃ DUYỆT
                const q = query(collection(db, "giay_phep_lam_viec"), where("trang_thai", "==", "Đã duyệt"));
                const snap = await getDocs(q);
                
                const todayStr = new Date().toISOString().split('T')[0]; // "YYYY-MM-DD"
                let validPermits = [];

                snap.forEach(doc => {
                    const p = doc.data();
                    // So sánh ngày: Nếu Giấy phép có Ngày bắt đầu <= Hôm nay <= Ngày kết thúc
                    if(p.thoi_gian_bat_dau <= todayStr && p.thoi_gian_ket_thuc >= todayStr) {
                        validPermits.push({id: doc.id, ...p});
                    }
                });

                document.getElementById('ptw-count').innerText = `${validPermits.length} Giấy phép`;

                if(validPermits.length === 0) {
                    ptwList.innerHTML = `<div class="p-8 text-center text-slate-500 font-bold bg-slate-800/50 rounded-2xl border border-slate-800 border-dashed"><i class="ph-fill ph-shield-check text-5xl mb-2 opacity-30"></i><br>Hôm nay không có thi công đặc biệt nào.</div>`;
                    return;
                }

                validPermits.sort((a,b) => a.gio_bat_dau.localeCompare(b.gio_bat_dau));

                validPermits.forEach(p => {
                    // Cảnh báo màu sắc theo mức độ rủi ro
                    let colorClass = "border-slate-700 bg-slate-800";
                    let textClass = "text-white";
                    let icon = "ph-file-text";

                    if(p.loai_giay_phep.includes("Hàn") || p.loai_giay_phep.includes("Không gian")) {
                        colorClass = "border-red-500/50 bg-red-900/20 shadow-[0_0_15px_rgba(239,68,68,0.15)]";
                        textClass = "text-red-400";
                        icon = "ph-fire";
                    } else if (p.loai_giay_phep.includes("Trên cao")) {
                        colorClass = "border-amber-500/50 bg-amber-900/20 shadow-[0_0_15px_rgba(245,158,11,0.1)]";
                        textClass = "text-amber-400";
                        icon = "ph-steps";
                    }

                    const workersHtml = (p.danh_sach_nhan_su || []).map(w => `<span class="inline-block bg-slate-900 border border-slate-700 text-slate-300 text-[10px] px-2 py-0.5 rounded mr-1 mb-1">${w}</span>`).join('');

                    ptwList.innerHTML += `
                        <div class="p-4 rounded-2xl border ${colorClass} transition-all">
                            <div class="flex justify-between items-start mb-2 border-b border-slate-700/50 pb-2">
                                <div>
                                    <h3 class="font-black text-lg ${textClass} flex items-center gap-1.5"><i class="ph-fill ${icon}"></i> ${p.loai_giay_phep.toUpperCase()}</h3>
                                    <p class="font-bold text-slate-300 text-sm">${p.cong_ty}</p>
                                </div>
                                <div class="text-right">
                                    <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-black tracking-wider uppercase border border-emerald-500/30"><i class="ph-bold ph-check"></i> EHS Cấp Phép</span>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3 text-xs mb-3">
                                <div class="bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                                    <p class="text-slate-500 font-bold uppercase mb-0.5">Khu Vực</p>
                                    <p class="font-bold text-white">${p.khu_vuc}</p>
                                </div>
                                <div class="bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                                    <p class="text-slate-500 font-bold uppercase mb-0.5">Thời Gian Hôm Nay</p>
                                    <p class="font-bold text-sky-400 font-mono">${p.gio_bat_dau} - ${p.gio_ket_thuc}</p>
                                </div>
                            </div>
                            
                            <div class="text-xs">
                                <p class="text-slate-500 font-bold uppercase mb-1">Nhân sự thực hiện:</p>
                                <div>${workersHtml}</div>
                            </div>
                        </div>
                    `;
                });

            } catch(e) {
                console.error("Lỗi tải PTW:", e);
                ptwList.innerHTML = `<div class="p-4 text-red-400 font-bold">Lỗi mạng: ${e.message}</div>`;
            } finally {
                document.getElementById('ptw-loader').classList.add('hidden');
            }
        }

        // INIT
        loadWorkersData();
        loadTodayPTW();

        // Tự động làm mới danh sách giấy phép mỗi 5 phút để bảo vệ luôn có bản mới nhất
        setInterval(loadTodayPTW, 300000); 
    </script>
</body>
</html>
