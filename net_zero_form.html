<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Net Zero - EHS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 font-sans">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <!-- Header -->
        <div class="mb-8 border-b border-slate-100 pb-4">
            <h2 class="text-3xl font-bold text-blue-600 mb-2">Hệ Thống Quản Trị Net Zero</h2>
            <p class="text-slate-500">Asia Packaging Industries Vietnam - Form Kiểm kê Khí nhà kính (GHG Inventory)</p>
        </div>

        <!-- Form Nhập liệu -->
        <form id="ghgForm" class="space-y-8">
            
            <!-- Thông tin chung -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-5 rounded-xl border border-slate-100">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kỳ báo cáo (Tháng/Năm)</label>
                    <input type="month" id="period" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Khu vực phân xưởng</label>
                    <select id="factory_zone" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Line 1">Dây chuyền 1 (Line 1)</option>
                        <option value="Line 2">Dây chuyền 2 (Line 2)</option>
                        <option value="Line 3">Dây chuyền 3 (Line 3)</option>
                        <option value="Toàn nhà máy">Toàn nhà máy (Tổng hợp)</option>
                    </select>
                </div>
            </div>

            <!-- Scope 1 (Đã mở rộng) -->
            <div class="bg-red-50 p-5 rounded-xl border border-red-100">
                <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                    <span class="w-3 h-3 bg-red-500 rounded-full mr-2"></span> Scope 1: Phát thải trực tiếp (Direct Emissions)
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Tiêu thụ nhiên liệu (Combustion) -->
                    <div>
                        <h4 class="text-md font-semibold text-red-700 mb-3 border-b border-red-200 pb-1">1. Tiêu thụ Gas/LPG Lò sấy (kg)</h4>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm text-slate-700 mb-1">Lò sấy Washer</label>
                                <input type="number" id="s1_washer" placeholder="Nhập khối lượng LPG..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-400 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-700 mb-1">Lò sấy Pinoven</label>
                                <input type="number" id="s1_pinoven" placeholder="Nhập khối lượng LPG..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-400 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-700 mb-1">Lò sấy IBO</label>
                                <input type="number" id="s1_ibo" placeholder="Nhập khối lượng LPG..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-400 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-700 mb-1">Lò hơi chung / Nguồn khác</label>
                                <input type="number" id="s1_boiler" placeholder="Nhập khối lượng LPG..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-400 outline-none">
                            </div>
                        </div>
                    </div>

                    <!-- Rò rỉ Gas lạnh (Refrigerants) -->
                    <div>
                        <h4 class="text-md font-semibold text-red-700 mb-3 border-b border-red-200 pb-1">2. Nạp bổ sung Gas máy lạnh (kg)</h4>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm text-slate-700 mb-1">Gas R410A</label>
                                <input type="number" id="s1_r410a" placeholder="Khối lượng nạp bổ sung..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-400 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-700 mb-1">Gas R22</label>
                                <input type="number" id="s1_r22" placeholder="Khối lượng nạp bổ sung..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-400 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-700 mb-1">Gas R32</label>
                                <input type="number" id="s1_r32" placeholder="Khối lượng nạp bổ sung..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-400 outline-none">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scope 2 & 3 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Scope 2 -->
                <div class="bg-yellow-50 p-5 rounded-xl border border-yellow-100">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-3 h-3 bg-yellow-500 rounded-full mr-2"></span> Scope 2 (Năng lượng mua vào)
                    </h3>
                    <div>
                        <label class="block text-sm text-slate-700 mb-1">Điện năng tiêu thụ (kWh)</label>
                        <input type="number" id="scope2_elec" required placeholder="Nhập số chữ điện..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
                    </div>
                </div>

                <!-- Scope 3 -->
                <div class="bg-green-50 p-5 rounded-xl border border-green-100">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span> Scope 3 (Chuỗi giá trị)
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm text-slate-700 mb-1">Nước cấp đầu vào (m&sup3;)</label>
                            <input type="number" id="scope3_water" placeholder="Nhập khối lượng nước..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-400 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-700 mb-1">Rác thải công nghiệp (kg)</label>
                            <input type="number" id="scope3_waste" placeholder="Nhập khối lượng rác..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-400 outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Nút Submit -->
            <div class="pt-4 text-right">
                <button type="button" onclick="submitData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition duration-200 shadow-md">
                    Lưu Dữ Liệu & Tính Toán
                </button>
            </div>
        </form>
    </div>

    <script>
        function submitData() {
            // Đóng gói toàn bộ dữ liệu từ form
            const ghgData = {
                period: document.getElementById('period').value,
                factory_zone: document.getElementById('factory_zone').value,
                
                // Scope 1: Combustion
                s1_washer_lpg: Number(document.getElementById('s1_washer').value) || 0,
                s1_pinoven_lpg: Number(document.getElementById('s1_pinoven').value) || 0,
                s1_ibo_lpg: Number(document.getElementById('s1_ibo').value) || 0,
                s1_boiler_lpg: Number(document.getElementById('s1_boiler').value) || 0,
                
                // Scope 1: Refrigerants
                s1_r410a: Number(document.getElementById('s1_r410a').value) || 0,
                s1_r22: Number(document.getElementById('s1_r22').value) || 0,
                s1_r32: Number(document.getElementById('s1_r32').value) || 0,
                
                // Scope 2 & 3
                scope2_elec: Number(document.getElementById('scope2_elec').value) || 0,
                scope3_water: Number(document.getElementById('scope3_water').value) || 0,
                scope3_waste: Number(document.getElementById('scope3_waste').value) || 0,
                
                status: "pending"
            };

            if (!ghgData.period || ghgData.scope2_elec === 0) {
                alert("Vui lòng nhập Kỳ báo cáo và Số Điện tiêu thụ!");
                return;
            }

            console.log("Dữ liệu chuẩn bị đẩy lên Firestore:", ghgData);
            alert("Bảng dữ liệu chi tiết đã sẵn sàng! Có thể xem log F12 để kiểm tra object.");
        }
    </script>
</body>
</html>
