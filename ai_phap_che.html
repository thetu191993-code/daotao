<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý AI Pháp chế EHS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Animation cho dấu chấm suy nghĩ của AI */
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="bg-[#2B3078] text-white p-4 shadow-md shrink-0">
        <div class="max-w-5xl mx-auto flex items-center gap-4">
            <a href="index.html" class="text-white hover:text-indigo-200 transition">
                <i class="ph-bold ph-arrow-left text-2xl"></i>
            </a>
            <div>
                <h1 class="font-bold text-lg flex items-center gap-2">
                    <i class="ph-fill ph-scales text-2xl"></i> AI Pháp chế EHS
                </h1>
                <p class="text-xs text-indigo-200 flex items-center gap-1">
                    <i class="ph-fill ph-shield-check text-emerald-400"></i> Kênh kết nối máy chủ an toàn (Proxy Secured)
                </p>
            </div>
        </div>
    </div>

    <!-- Cảnh báo an toàn -->
    <div class="bg-amber-50 border-b border-amber-200 p-2 text-center text-xs font-bold text-amber-700 flex justify-center items-center gap-2 shrink-0">
        <i class="ph-fill ph-warning-circle"></i> AI chỉ hỗ trợ tư vấn sơ bộ dựa trên dữ liệu học máy. Luôn đối chiếu với văn bản pháp luật gốc.
    </div>

    <!-- Khu vực Chat chính -->
    <div class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col bg-white sm:my-4 sm:rounded-2xl sm:shadow-sm border border-slate-200 overflow-hidden">
        
        <!-- Khung hiển thị nội dung tin nhắn -->
        <div id="chat-box" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-6">
            
            <!-- Lời chào mở đầu của AI -->
            <div class="flex gap-4">
                <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 border border-indigo-200">
                    <i class="ph-fill ph-robot text-2xl"></i>
                </div>
                <div class="bg-slate-50 border border-slate-200 rounded-2xl rounded-tl-none p-4 w-full max-w-2xl text-sm text-slate-700 shadow-sm">
                    <p class="font-bold text-indigo-800 mb-2 text-base">Xin chào! Tôi là Trợ lý AI Pháp chế EHS.</p>
                    <p class="mb-4">Tôi đã được kết nối với hệ thống máy chủ bảo mật. Bạn cần hỏi về quy định gì?</p>
                    
                    <div class="space-y-2">
                        <button onclick="sendQuickPrompt('Quy định mới nhất về thời gian lưu trữ chất thải nguy hại tại nhà máy là bao lâu?')" class="w-full text-left bg-white border border-slate-200 p-3 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition font-medium text-slate-600 flex items-start gap-2 shadow-sm">
                            <span class="text-amber-500">👉</span> Quy định thời gian lưu trữ chất thải nguy hại?
                        </button>
                        <button onclick="sendQuickPrompt('Thẻ huấn luyện An toàn lao động nhóm 3 có thời hạn bao nhiêu năm theo Nghị định 44?')" class="w-full text-left bg-white border border-slate-200 p-3 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition font-medium text-slate-600 flex items-start gap-2 shadow-sm">
                            <span class="text-amber-500">👉</span> Thời hạn thẻ huấn luyện ATLĐ nhóm 3?
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Khung nhập liệu -->
        <div class="pt-4 mt-2 border-t border-slate-100 shrink-0">
            <div class="flex items-center gap-3">
                <textarea id="user-input" rows="1" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm resize-none custom-scrollbar" placeholder="Nhập câu hỏi pháp lý của bạn..."></textarea>
                <button id="btn-send" onclick="sendMessage()" class="w-12 h-12 rounded-full bg-[#3B42C4] text-white flex items-center justify-center hover:bg-indigo-800 transition shadow-md shrink-0">
                    <i id="send-icon" class="ph-bold ph-paper-plane-right text-xl"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT XỬ LÝ LÕI -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // =========================================================================
        // BƯỚC QUAN TRỌNG NHẤT: DÁN ĐƯỜNG LINK GOOGLE APPS SCRIPT CỦA ANH VÀO ĐÂY
        // =========================================================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzPs0bxSANI0Hn6CJ0nK2sgcgFlieW-IOd6WufqqzjCHLS9vuQcTm6SEBloAcTHepw/exec"; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const sendIcon = document.getElementById('send-icon');

        // Tự động kéo dãn ô nhập liệu
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
        });

        // Bấm Enter để gửi (Nhấn Shift+Enter để xuống dòng)
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Hàm bấm nhanh từ gợi ý
        window.sendQuickPrompt = function(text) {
            userInput.value = text;
            sendMessage();
        }

        // Hàm cuộn xuống cuối
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // VẼ TIN NHẮN LÊN MÀN HÌNH
        function appendMessage(sender, text) {
            const div = document.createElement('div');
            
            if (sender === 'user') {
                div.className = "flex gap-3 justify-end animate-[slideUp_0.3s_ease-out]";
                div.innerHTML = `
                    <div class="bg-[#3B42C4] text-white p-3 rounded-2xl rounded-tr-none text-sm max-w-[80%] shadow-sm">
                        ${text.replace(/\n/g, '<br>')}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center shrink-0 shadow-md">
                        <i class="ph-fill ph-user"></i>
                    </div>
                `;
            } else {
                // Tin nhắn của AI (Sử dụng thư viện marked để render Markdown cho đẹp)
                div.className = "flex gap-3 justify-start animate-[slideUp_0.3s_ease-out]";
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 border border-indigo-200">
                        <i class="ph-fill ph-robot text-2xl"></i>
                    </div>
                    <div class="bg-white border border-indigo-100 rounded-2xl rounded-tl-none p-4 w-full max-w-[85%] text-sm text-slate-700 shadow-sm leading-relaxed" style="line-height: 1.6;">
                        ${marked.parse(text)}
                    </div>
                `;
            }
            chatBox.appendChild(div);
            scrollToBottom();
        }

        // HIỂN THỊ ANIMATION AI ĐANG SUY NGHĨ
        function showLoading() {
            const div = document.createElement('div');
            div.id = "ai-loading";
            div.className = "flex gap-3 justify-start animate-[slideUp_0.3s_ease-out]";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 border border-indigo-200">
                    <i class="ph-fill ph-robot text-2xl"></i>
                </div>
                <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-1 w-fit shadow-sm h-[40px]">
                    <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                </div>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
            
            // Đổi trạng thái nút bấm thành đang xử lý
            btnSend.disabled = true;
            sendIcon.className = "ph-bold ph-spinner animate-spin text-xl";
            userInput.disabled = true;
        }

        // XÓA ANIMATION SUY NGHĨ
        function removeLoading() {
            const loading = document.getElementById('ai-loading');
            if (loading) loading.remove();
            
            // Trả lại trạng thái nút bấm
            btnSend.disabled = false;
            sendIcon.className = "ph-bold ph-paper-plane-right text-xl";
            userInput.disabled = false;
            userInput.focus();
        }

        // HÀM GỬI LÊN MÁY CHỦ GAS CHUẨN MỰC
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            if (WEB_APP_URL === "DÁN_LINK_WEB_APP_Ở_BƯỚC_2_VÀO_ĐÂY") {
                alert("Bạn chưa dán đường link Google Apps Script vào code!");
                return;
            }

            appendMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto'; // Reset height
            showLoading();

            try {
                // Gửi request tới Google Apps Script (Người đưa thư)
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Dùng text/plain để tránh lỗi CORS Preflight phức tạp
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                removeLoading();

                if (data.error) {
                    appendMessage('ai', "🚨 **Lỗi từ máy chủ:**\n" + data.error);
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    appendMessage('ai', data.candidates[0].content.parts[0].text);
                } else {
                    appendMessage('ai', "⚠️ Trợ lý AI hiện không thể phản hồi. Vui lòng thử lại sau.");
                }

            } catch (error) {
                removeLoading();
                appendMessage('ai', "🚨 **Mất kết nối với máy chủ AI:**\nVui lòng kiểm tra lại đường truyền Internet hoặc link Google Apps Script.");
                console.error(error);
            }
        }

    </script>
    <style>
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* CSS tuỳ chỉnh cho Markdown sinh ra từ AI để đẹp hơn */
        #chat-box strong { color: #1e40af; }
        #chat-box ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        #chat-box ol { list-style-type: decimal; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        #chat-box blockquote { border-left: 4px solid #c7d2fe; padding-left: 1rem; color: #475569; font-style: italic; background-color: #f8fafc; padding: 0.5rem 1rem; border-radius: 0.5rem;}
        #chat-box h1, #chat-box h2, #chat-box h3 { font-weight: bold; color: #1e3a8a; margin-top: 1rem; margin-bottom: 0.5rem;}
    </style>
</body>
</html>
`
