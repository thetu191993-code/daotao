<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EHS 3D Multi-Plant Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; background-color: #020617; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        
        .floating-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        
        .drawer { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .drawer-closed { transform: translateY(calc(100% - 56px)); }
    </style>
</head>
<body class="text-slate-200 select-none">

    <!-- TOAST THÔNG BÁO -->
    <div id="toast" class="fixed top-4 sm:top-24 left-1/2 transform -translate-x-1/2 -translate-y-[200%] z-[200] transition-all duration-300 flex items-center gap-2 sm:gap-3 px-4 sm:px-6 py-3 sm:py-4 rounded-xl shadow-2xl font-bold text-white bg-slate-800/95 border border-slate-600 text-xs sm:text-sm w-11/12 sm:w-auto max-w-md text-center justify-center">
        <i id="toast-icon" class="text-xl sm:text-2xl shrink-0"></i>
        <span id="toast-message" class="leading-tight"></span>
    </div>

    <!-- UI LAYER TẦNG TRÊN CÙNG -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between z-10">
        
        <!-- HEADER TRUNG TÂM KIỂM SOÁT -->
        <header class="pointer-events-auto p-3 sm:p-6 flex justify-between items-start">
            <div class="bg-slate-900/90 floating-panel border border-blue-500/50 p-3 sm:p-4 rounded-2xl shadow-lg flex items-center gap-3">
                <a href="index.html" class="w-8 h-8 sm:w-10 sm:h-10 bg-slate-800 hover:bg-slate-700 rounded-lg flex items-center justify-center transition border border-slate-600 shrink-0 shadow-sm">
                    <i class="ph-bold ph-arrow-left text-base sm:text-lg text-blue-400"></i>
                </a>
                <div class="pr-2">
                    <h1 class="font-black text-sm sm:text-xl text-white tracking-tight flex items-center gap-1.5 sm:gap-2 leading-none">
                        <i class="ph-fill ph-siren text-red-500 animate-pulse text-lg sm:text-2xl"></i> COMMAND 3D
                    </h1>
                    <p class="text-blue-400 font-bold text-[8px] sm:text-[10px] tracking-widest uppercase mt-0.5">Asia Packaging Ind.</p>
                </div>
            </div>

            <!-- NÚT CHUYỂN CAMERA GIỮA 2 NHÀ MÁY -->
            <div class="flex flex-col gap-2 pointer-events-auto">
                <button onclick="window.goToCanLine()" class="bg-blue-600/90 hover:bg-blue-500 border border-blue-400 text-white font-black px-4 py-2 rounded-xl shadow-lg transition flex items-center gap-2 text-xs sm:text-sm">
                    <i class="ph-fill ph-factory"></i> CAN LINE
                </button>
                <button onclick="window.goToEndLine()" class="bg-purple-600/90 hover:bg-purple-500 border border-purple-400 text-white font-black px-4 py-2 rounded-xl shadow-lg transition flex items-center gap-2 text-xs sm:text-sm">
                    <i class="ph-fill ph-buildings"></i> END LINE
                </button>
            </div>
        </header>

        <!-- BẢNG CẢNH BÁO MÁY CHỦ TRÁI -->
        <div class="absolute top-24 left-3 sm:left-6 pointer-events-auto">
            <div class="bg-slate-900/90 floating-panel border border-red-500/50 p-3 sm:p-4 rounded-2xl shadow-2xl w-48 sm:w-80 hidden" id="alarm-panel">
                <h3 class="text-red-500 font-black text-xs sm:text-sm uppercase flex items-center gap-1.5 sm:gap-2 mb-2">
                    <i class="ph-fill ph-warning text-base sm:text-xl animate-pulse"></i> Cảnh Báo Khẩn
                </h3>
                <div id="alarm-list" class="space-y-2 max-h-32 sm:max-h-40 overflow-y-auto custom-scrollbar pr-1"></div>
                <div class="mt-2 pt-2 sm:mt-3 sm:pt-3 border-t border-red-500/30 flex flex-col gap-2">
                    <button onclick="window.openGoogleMaps()" class="w-full bg-blue-900/40 hover:bg-blue-600 border border-blue-500/50 text-blue-300 hover:text-white font-bold px-3 py-2 rounded-xl transition flex items-center justify-center gap-1.5 text-xs sm:text-sm">
                        <i class="ph-bold ph-satellite"></i> Mở Vệ Tinh (Đ.Phối Xe)
                    </button>
                    <button onclick="window.clearAlarms()" class="w-full bg-slate-800 hover:bg-red-900 border border-slate-600 text-slate-300 font-bold px-3 py-2 rounded-xl transition text-xs sm:text-sm">
                        Tắt còi báo động
                    </button>
                </div>
            </div>
        </div>

        <!-- HƯỚNG DẪN TRÊN MÀN HÌNH -->
        <div class="pointer-events-none w-full flex justify-center mt-1 absolute top-20 sm:top-6">
            <div class="bg-slate-900/80 floating-panel border border-slate-600/50 px-4 py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-300 shadow-lg flex items-center gap-2">
                <i class="ph-fill ph-info"></i> Dùng 1 ngón tay xoay, 2 ngón tay thu phóng. Chạm đúp để thả ghim định vị.
            </div>
        </div>

        <!-- NGĂN KÉO ĐIỀU KHIỂN CHIẾN THUẬT (BOTTOM DRAWER) -->
        <div id="tactical-drawer" class="pointer-events-auto w-full max-w-md mx-auto mt-auto bg-slate-900/95 floating-panel border border-blue-500/30 rounded-t-3xl shadow-[0_-15px_40px_rgba(0,0,0,0.6)] drawer">
            <div onclick="window.toggleDrawer()" class="w-full h-14 flex justify-between items-center px-6 cursor-pointer hover:bg-slate-800/50 rounded-t-3xl transition group border-b border-slate-700/50">
                <h3 class="text-white font-black text-sm flex items-center gap-2">
                    <i class="ph-bold ph-crosshair text-blue-400 text-lg"></i> Bảng Tác Chiến
                </h3>
                <div class="flex items-center gap-3">
                    <div class="relative group" onclick="event.stopPropagation()">
                        <select id="zone-selector" onchange="window.selectZoneFromDropdown()" class="bg-slate-800 border border-slate-600 px-3 py-1.5 rounded-full text-[10px] font-bold text-sky-400 truncate max-w-[160px] outline-none appearance-none cursor-pointer">
                            <option value="none">Chưa xác định tọa độ</option>
                            <optgroup label="🏭 KHU VỰC CAN LINE">
                                <option value="can-tap-ket">Điểm Tập Kết (NA3)</option>
                                <option value="can-vp">Văn Phòng & Canteen</option>
                                <option value="can-sx">Khu Sản Xuất (Line 1-3)</option>
                                <option value="can-kho">Khu Kho Thành Phẩm</option>
                            </optgroup>
                            <optgroup label="🏭 KHU VỰC END LINE">
                                <option value="end-tap-ket">Điểm Tập Kết (Rừng cây)</option>
                                <option value="end-sx">Khu Sản Xuất End</option>
                                <option value="end-kho">Khu Kho Thành Phẩm End</option>
                            </optgroup>
                        </select>
                        <i class="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-sky-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="p-5 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="window.useGPS()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-blue-400 font-bold py-3.5 rounded-xl transition text-xs flex items-center justify-center gap-2 shadow-sm">
                        <i class="ph-bold ph-navigation-arrow text-base"></i> Tự động (GPS)
                    </button>
                    <button onclick="window.findEvacuationRoute()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-black py-3.5 rounded-xl transition shadow-[0_0_15px_rgba(16,185,129,0.4)] flex items-center justify-center gap-2 text-xs border border-emerald-400">
                        <i class="ph-bold ph-person-simple-run text-lg"></i> TÌM LỐI THOÁT
                    </button>
                </div>

                <div class="pt-3 border-t border-slate-800">
                    <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mb-2 text-center">Báo sự cố khẩn cấp tại vị trí đã ghim</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="window.reportIncident('Cháy Nổ')" class="bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 hover:border-red-500 font-bold py-3 rounded-xl transition text-[10px] flex flex-col items-center justify-center gap-1 group">
                            <i class="ph-fill ph-fire text-xl group-hover:scale-110 transition-transform"></i> BÁO CHÁY
                        </button>
                        <button onclick="window.reportIncident('Hóa Chất')" class="bg-purple-900/30 hover:bg-purple-600 text-purple-400 hover:text-white border border-purple-500/30 hover:border-purple-500 font-bold py-3 rounded-xl transition text-[10px] flex flex-col items-center justify-center gap-1 group">
                            <i class="ph-fill ph-drop text-xl group-hover:scale-110 transition-transform"></i> HÓA CHẤT
                        </button>
                        <button onclick="window.reportIncident('Y Tế')" class="bg-blue-900/30 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/30 hover:border-blue-500 font-bold py-3 rounded-xl transition text-[10px] flex flex-col items-center justify-center gap-1 group">
                            <i class="ph-fill ph-first-aid text-xl group-hover:scale-110 transition-transform"></i> CẤP CỨU Y TẾ
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D CANVAS LAYER -->
    <div id="canvas-container"></div>
    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" loop preload="auto"></audio>

    <!-- THƯ VIỆN 3D THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7iFVmgoUL-sW3UlaMV0rlNQYugFiw2uA",
            authDomain: "ehs-training-app.firebaseapp.com",
            projectId: "ehs-training-app",
            storageBucket: "ehs-training-app.firebasestorage.app",
            messagingSenderId: "354083430003",
            appId: "1:354083430003:web:059953b7b9c1a9470a5406"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let scene, camera, renderer, controls, factoryFloor; 
        let myLocationMarker = null; 
        let evacuationLineGroup = new THREE.Group(); 
        let exitSignsGroup = new THREE.Group();
        let alarmMarkers = [];
        let raycaster, mouse;
        
        let currentUser = localStorage.getItem("ehs_user_name") || "Nhân viên EHS";
        let currentPos = { x: null, z: null, zone: null };
        let isDrawerOpen = true;

        const ANCHOR_LAT = 11.1394136;
        const ANCHOR_LNG = 106.6241705;

        // 1. CAN LINE (Trọng tâm X=0, Z=0)
        const CAN_C_X = [-340, -180, -20, 180, 340];
        const CAN_C_Z = [-420, -280, -150, 0, 120, 260, 380, 450, 650, 800];
        const gridCan = {}; const edgesCan = []; const outsideEdgesCan = [];
        const ASSEMBLY_CAN = `-20_-420`;

        let isOutsideCan = (key) => {
            let [x, z] = key.split('_').map(Number);
            return x === -340 || x === 340 || z === -280 || z === 450 || z === 650 || z === 800 || (x === -20 && z === -420);
        };

        for(let x of CAN_C_X) {
            for(let z of CAN_C_Z) {
                if (z === -420 && x !== -20) continue; 
                gridCan[`${x}_${z}`] = {x, z};
            }
        }

        for(let key1 in gridCan) {
            for(let key2 in gridCan) {
                let p1 = gridCan[key1]; let p2 = gridCan[key2];
                let isH = (p1.z === p2.z) && (Math.abs(CAN_C_X.indexOf(p1.x) - CAN_C_X.indexOf(p2.x)) === 1);
                let isV = (p1.x === p2.x) && (Math.abs(CAN_C_Z.indexOf(p1.z) - CAN_C_Z.indexOf(p2.z)) === 1);
                if (isH || isV) {
                    edgesCan.push([key1, key2]);
                    if (isOutsideCan(key1) && isOutsideCan(key2)) outsideEdgesCan.push([key1, key2]); 
                }
            }
        }

        // 2. END LINE (Tọa độ dời về Đông Nam: X dương, Z dương theo Google Maps)
        const END_OFFSET_X = 2600; 
        const END_OFFSET_Z = 1600; 
        
        // Scale End Line thu nhỏ lại (End: 27k m2 vs Can: 71k m2)
        const END_C_X = [END_OFFSET_X - 160, END_OFFSET_X, END_OFFSET_X + 160];
        const END_C_Z = [END_OFFSET_Z - 250, END_OFFSET_Z - 100, END_OFFSET_Z + 100, END_OFFSET_Z + 250];
        
        const gridEnd = {}; const edgesEnd = []; const outsideEdgesEnd = [];
        // Điểm tập kết End Line ở phía Bắc (hướng Rừng cây)
        const ASSEMBLY_END = `${END_OFFSET_X}_${END_OFFSET_Z - 250}`; 

        let isOutsideEnd = (key) => {
            let [x, z] = key.split('_').map(Number);
            return x === END_C_X[0] || x === END_C_X[END_C_X.length-1] || z === END_C_Z[0] || z === END_C_Z[END_C_Z.length-1];
        };

        for(let x of END_C_X) {
            for(let z of END_C_Z) {
                gridEnd[`${x}_${z}`] = {x, z};
            }
        }

        for(let key1 in gridEnd) {
            for(let key2 in gridEnd) {
                let p1 = gridEnd[key1]; let p2 = gridEnd[key2];
                let isH = (p1.z === p2.z) && (Math.abs(END_C_X.indexOf(p1.x) - END_C_X.indexOf(p2.x)) === 1);
                let isV = (p1.x === p2.x) && (Math.abs(END_C_Z.indexOf(p1.z) - END_C_Z.indexOf(p2.z)) === 1);
                if (isH || isV) {
                    edgesEnd.push([key1, key2]);
                    if (isOutsideEnd(key1) && isOutsideEnd(key2)) outsideEdgesEnd.push([key1, key2]); 
                }
            }
        }

        const EXIT_DOORS_CAN = [
            // Mặt tiền
            { name: "Cửa Chính (VP)", node: "-20_-280", x: -20, z: -280 },
            { name: "Cửa Giữa VP-Canteen", node: "180_-280", x: 180, z: -280 },
            { name: "Cửa Hông Canteen", node: "340_-280", x: 340, z: -280 },
            
            // 3 Cửa đi vào lối Văn phòng (Phía sau)
            { name: "Cửa Sau VP (Trái)", node: "-180_-150", x: -180, z: -150 },
            { name: "Cửa Sau VP (Giữa)", node: "-20_-150", x: -20, z: -150 },
            { name: "Cửa Sau VP (Phải)", node: "180_-150", x: 180, z: -150 },

            // Cửa hông Trái
            { name: "Cửa Hông Cupper", node: "-340_0", x: -340, z: 0 },
            { name: "Cửa Hông Kho TP 1 (Trái)", node: "-340_260", x: -340, z: 260 },
            { name: "Cửa Hông Kho TP 2 (Trái)", node: "-340_380", x: -340, z: 380 },
            
            // Cửa hông Phải (Đã chỉnh sửa dời ra ngoài)
            { name: "Cửa Hông Kho TP 1 (Phải)", node: "340_260", x: 340, z: 260 }, 
            { name: "Cửa Kẹp Kho TP 1&2 (Phải)", node: "340_380", x: 340, z: 380 }, 

            // 3 Cửa sau lưng Kho Thành Phẩm 2
            { name: "Cửa Sau Kho TP 2 (Trái)", node: "-180_450", x: -180, z: 450 },
            { name: "Cửa Sau Kho TP 2 (Giữa)", node: "-20_450", x: -20, z: 450 },
            { name: "Cửa Sau Kho TP 2 (Phải)", node: "180_450", x: 180, z: 450 },

            // Cửa Kho Nguyên Liệu (Hướng Bắc - bãi đất trống)
            { name: "Cửa Bắc Kho NL (Trái)", node: "-180_650", x: -180, z: 650 },
            { name: "Cửa Bắc Kho NL (Phải)", node: "-20_650", x: -20, z: 650 }
        ];

        const EXIT_DOORS_END = [
            { name: "Cổng Chính (NA4)", node: `${END_OFFSET_X}_${END_OFFSET_Z + 250}`, x: END_OFFSET_X, z: END_OFFSET_Z + 250 },
            { name: "Cửa Hông Trái", node: `${END_OFFSET_X - 160}_${END_OFFSET_Z + 100}`, x: END_OFFSET_X - 160, z: END_OFFSET_Z + 100 },
            { name: "Cửa Hông Phải", node: `${END_OFFSET_X + 160}_${END_OFFSET_Z + 100}`, x: END_OFFSET_X + 160, z: END_OFFSET_Z + 100 },
            { name: "Cửa Ra Điểm Tập Kết", node: `${END_OFFSET_X}_${END_OFFSET_Z - 100}`, x: END_OFFSET_X, z: END_OFFSET_Z - 100 }
        ];

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x040b16); 
            scene.fog = new THREE.Fog(0x040b16, 500, 8000); 

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 15000);
            window.goToCanLine(); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1; 
            controls.minDistance = 100; controls.maxDistance = 6000;

            scene.add(new THREE.AmbientLight(0xffffff, 1));
            
            const gridHelper = new THREE.GridHelper(10000, 500, 0x1e293b, 0x0f172a); 
            gridHelper.position.set(1500, -1, 500); scene.add(gridHelper);

            scene.add(evacuationLineGroup);
            scene.add(exitSignsGroup);

            // Mở rộng mặt sàn tàng hình để đón click chuột toàn Map
            const floorGeo = new THREE.PlaneGeometry(30000, 30000);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.0, side: THREE.DoubleSide });
            factoryFloor = new THREE.Mesh(floorGeo, floorMat);
            factoryFloor.rotation.x = -Math.PI / 2;
            scene.add(factoryFloor);

            buildCanLine(); 
            buildEndLine();
            drawConnectingRoads();

            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();
            
            renderer.domElement.addEventListener('dblclick', onDoubleClick);
            let lastTap = 0;
            renderer.domElement.addEventListener('touchend', function(e) {
                let currentTime = new Date().getTime(); let tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) { e.preventDefault(); onDoubleClick(e.changedTouches[0]); }
                lastTap = currentTime;
            }, {passive: false});

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        window.goToCanLine = function() { gsapFlyCamera(0, 1500, 1000, 0, 0, 0); }
        window.goToEndLine = function() { gsapFlyCamera(END_OFFSET_X, 1500, END_OFFSET_Z + 800, END_OFFSET_X, 0, END_OFFSET_Z); }

        function buildCanLine() {
            // Tường rào Can Line
            const fence = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(760, 20, 1400)), new THREE.LineBasicMaterial({ color: 0x475569, linewidth: 1 }));
            fence.position.set(0, 10, 260); scene.add(fence);

            drawRoad(760, 40, 0, -280); drawRoad(760, 40, 0, 450);  
            drawRoad(760, 40, 0, 650); drawRoad(760, 40, 0, 800);  
            drawRoad(40, 1120, -340, 260); drawRoad(40, 1120, 340, 260); 

            createTextLabel("ĐƯỜNG NA3 (CỔNG CHÍNH)", 0, 2, -500, 0x94a3b8, 16);
            drawWireframeZone(240, 80, -20, -420, 0x10b981, "VỊ TRÍ TẬP KẾT SỰ CỐ"); 
            drawWireframeZone(120, 60, -220, -410, 0x64748b, "NHÀ XE (PARKING)");
            drawWireframeZone(100, 40, 180, -420, 0xf59e0b, "TRẠM GAS");

            drawWireframeZone(380, 50, -40, -230, 0x0ea5e9, "VĂN PHÒNG (OFFICE)");
            drawWireframeZone(140, 50, 230, -230, 0x0ea5e9, "CANTEEN");

            drawWireframeZone(60, 250, -230, -25, 0x8b5cf6, "CUPPER AREA");
            drawWireframeZone(140, 40, -100, 60, 0x64748b, "BOILER"); 

            // Line 1, 2, 3
            drawWireframeZone(140, 70, -100, -110, 0xef4444, "KHU RỬA / BODY MAKER #1");
            drawWireframeZone(140, 70, 60, -110, 0xef4444, "DECORATOR / PIN OVEN #1");
            drawWireframeZone(100, 70, 200, -110, 0xef4444, "NECKER LINE 1");

            drawWireframeZone(140, 70, -100, 0, 0xef4444, "BODY MAKER #2");
            drawWireframeZone(140, 70, 60, 0, 0xef4444, "DECORATOR #2");
            drawWireframeZone(100, 70, 200, 0, 0xef4444, "NECKER LINE 2");

            drawWireframeZone(140, 70, -100, 120, 0xef4444, "BODY MAKER #3");
            drawWireframeZone(140, 70, 60, 120, 0xef4444, "PDP LINE 3");
            drawWireframeZone(100, 70, 200, 120, 0xef4444, "NECKER LINE 3");

            // MÁY NÉN KHÍ
            drawWireframeZone(60, 390, 300, 52, 0x64748b, "MÁY NÉN KHÍ");

            drawWireframeZone(140, 60, -100, 220, 0xa8a29e, "NGUYÊN LIỆU (COIL)");
            drawWireframeZone(140, 60, 60, 220, 0xa8a29e, "LON TRẮNG (BRIGHT)");
            drawWireframeZone(100, 60, 200, 220, 0x3b82f6, "ĐÓNG GÓI (PALLETIZER)");

            drawWireframeZone(240, 70, -40, 310, 0x8b5cf6, "KHO THÀNH PHẨM 1 (A)");

        function drawRoad(w, d, x, z) {
            const road = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide, transparent: true, opacity: 0.5, depthWrite: false }));
            road.rotation.x = -Math.PI / 2; road.position.set(x, 0.5, z); scene.add(road);

        function drawWireframeZone(w, d, x, z, colorHex, name) {
            const geo = new THREE.BoxGeometry(w, 40, d);
            const fillMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, fillMat); mesh.position.set(x, 20, z); scene.add(mesh);
            const edges = new THREE.EdgesGeometry(geo);
            const lineMat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2, transparent: true, opacity: 0.4 });
            const line = new THREE.LineSegments(edges, lineMat); line.position.set(x, 20, z); scene.add(line);
            if (name) createTextLabel(name, x, 45, z, colorHex, 9);
        }

        function createTextLabel(text, x, y, z, colorHex, fontSize) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
            ctx.font = `bold ${fontSize*2.5}px Inter`; ctx.textAlign = 'center'; ctx.fillText(text, 256, 64);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.9, depthTest: false }));
            sprite.scale.set(150, 37.5, 1); sprite.position.set(x, y, z); sprite.renderOrder = 1; scene.add(sprite);
        }

        function createMapPin() {
            const group = new THREE.Group();
            const pinMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9 }); 
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(12, 32, 32), pinMat); sphere.position.y = 35; group.add(sphere);
            const cone = new THREE.Mesh(new THREE.ConeGeometry(12, 20, 32), pinMat); cone.rotation.x = Math.PI; cone.position.y = 20; group.add(cone);
            const dot = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 16), new THREE.MeshBasicMaterial({ color: 0x020617 })); dot.position.set(0, 35, 10); group.add(dot);
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.1, 40, 32), new THREE.MeshBasicMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthTest: false })); ring.rotation.x = -Math.PI / 2; ring.position.y = 1; group.add(ring);
            group.userData.ring = ring; return group;
        }

        window.toggleDrawer = function() {
            const drawer = document.getElementById('tactical-drawer');
            if (isDrawerOpen) drawer.classList.add('drawer-closed'); else drawer.classList.remove('drawer-closed');
            isDrawerOpen = !isDrawerOpen;
        }

        function onDoubleClick(event) {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);
            mouse.x = (clientX / window.innerWidth) * 2 - 1; mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(factoryFloor);
            if (intersects.length > 0) {
                let px = Math.round(intersects[0].point.x);
                let pz = Math.round(intersects[0].point.z);
                setMarkerPosition(px, pz);
            }
        }

        window.selectZoneFromDropdown = function() {
            const val = document.getElementById('zone-selector').value;
            if(val === 'none') return;
            let coords = {x: 0, z: 0};
            switch(val) {
                case 'can-tap-ket': coords = {x: -20, z: -380}; break;
                case 'can-vp': coords = {x: -40, z: -230}; break;
                case 'can-sx': coords = {x: -100, z: 0}; break;
                case 'can-kho': coords = {x: -40, z: 310}; break;
                case 'end-tap-ket': coords = {x: END_OFFSET_X, z: END_OFFSET_Z - 280}; break;
                case 'end-sx': coords = {x: END_OFFSET_X - 80, z: END_OFFSET_Z + 50}; break;
                case 'end-kho': coords = {x: END_OFFSET_X - 80, z: END_OFFSET_Z - 150}; break;
            }
            setMarkerPosition(coords.x, coords.z);
        }

        window.useGPS = function() {
            if (navigator.geolocation) {
                window.showToast("Đang quét vệ tinh...", "info");
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        let dx = (lng - ANCHOR_LNG) * 109000;
                        let dz = -(lat - ANCHOR_LAT) * 111000; 
                        setMarkerPosition(dx, dz);
                        window.showToast("Chốt tọa độ vệ tinh thành công!", "success");
                    },
                    (error) => { window.showToast("Lỗi định vị. Vui lòng nhấp đúp vào bản đồ.", "error"); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else { window.showToast("Thiết bị không hỗ trợ GPS.", "error"); }
        }

        function setMarkerPosition(px, pz) {
            currentPos.x = px; currentPos.z = pz;
            
            let zoneName = "Khu vực chung";
            if (px > 1500) {
                zoneName = "Khu vực END LINE";
                if(pz > END_OFFSET_Z + 150) zoneName = "End Line: Cổng NA4";
                else if(pz < END_OFFSET_Z - 200) zoneName = "End Line: Điểm Tập Kết";
                else if(px < END_OFFSET_X) zoneName = "End Line: Kho & Sản Xuất";
                else zoneName = "End Line: Tiện ích / Bãi Xe";
            } else {
                if(pz < -250) zoneName = "Can Line: Cổng NA3 / Tập Kết";
                else if(pz < -150) zoneName = "Can Line: Văn phòng / Canteen";
                else if(pz > 650) zoneName = "Can Line: Kho NL / Trạm XLNT";
                else if(pz > 250) zoneName = "Can Line: Kho Thành Phẩm";
                else zoneName = "Can Line: Khu Sản Xuất";
            }
            currentPos.zone = zoneName;

            if(myLocationMarker) scene.remove(myLocationMarker);

            myLocationMarker = createMapPin();
            myLocationMarker.position.set(px, 0, pz);
            scene.add(myLocationMarker);

            gsapFlyCamera(px, 1200, pz + 600, px, 0, pz);
            evacuationLineGroup.clear(); 
            
            const selector = document.getElementById('zone-selector');
            selector.options[0].text = `📍 Tọa độ: ${zoneName}`;
            selector.value = 'none';
            selector.classList.replace('text-sky-400', 'text-white');
            selector.classList.replace('bg-slate-800', 'bg-blue-600');
            
            if(!isDrawerOpen) window.toggleDrawer();
        }

        function getDijkstraPath(startNode, endNode, edgeList, gridReference) {
            let distances = {}; let prev = {}; let pq = [];
            let uniqueNodes = new Set();
            edgeList.forEach(e => { uniqueNodes.add(e[0]); uniqueNodes.add(e[1]); });
            
            if (!uniqueNodes.has(startNode) || !uniqueNodes.has(endNode)) return { pathNodes: [], distance: Infinity };

            uniqueNodes.forEach(node => { distances[node] = Infinity; prev[node] = null; pq.push(node); });
            distances[startNode] = 0;

            while (pq.length > 0) {
                pq.sort((a, b) => distances[a] - distances[b]);
                let currNode = pq.shift();
                if (currNode === endNode || distances[currNode] === Infinity) break;

                let neighbors = [];
                edgeList.forEach(edge => {
                    if (edge[0] === currNode) neighbors.push(edge[1]);
                    if (edge[1] === currNode) neighbors.push(edge[0]);
                });

                neighbors.forEach(neighbor => {
                    if (pq.includes(neighbor)) {
                        let p1 = gridReference[currNode]; let p2 = gridReference[neighbor];
                        let dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.z - p2.z, 2));
                        let alt = distances[currNode] + dist;
                        if (alt < distances[neighbor]) { distances[neighbor] = alt; prev[neighbor] = currNode; }
                    }
                });
            }

            let path = []; let u = endNode; let totalDist = distances[endNode];
            if (prev[u] !== null || u === startNode) { while (u !== null) { path.unshift(u); u = prev[u]; } }
            return { pathNodes: path, distance: totalDist };
        }

        window.findEvacuationRoute = function() {
            if(currentPos.x === null) return window.showToast("Hãy thả ghim vị trí của bạn trước!", "error");
            evacuationLineGroup.clear();

            const startP = new THREE.Vector3(currentPos.x, 5, currentPos.z);
            
            // XÁC ĐỊNH LÃNH THỔ NHÀ MÁY ĐỂ CHỌN AI ROUTING
            let isEndLine = currentPos.x > 1500;
            let activeGrid = isEndLine ? gridEnd : gridCan;
            let activeEdges = isEndLine ? edgesEnd : edgesCan;
            let activeOutside = isEndLine ? outsideEdgesEnd : outsideEdgesCan;
            let activeDoors = isEndLine ? EXIT_DOORS_END : EXIT_DOORS_CAN;
            let activeAssembly = isEndLine ? ASSEMBLY_END : ASSEMBLY_CAN;

            let nearestNodeName = null; let minDist = Infinity;
            for(let key in activeGrid) {
                let node = activeGrid[key];
                let dist = startP.distanceTo(new THREE.Vector3(node.x, 5, node.z));
                if(dist < minDist) { minDist = dist; nearestNodeName = key; }
            }

            let doorPaths = [];
            activeDoors.forEach(door => {
                let toDoor = getDijkstraPath(nearestNodeName, door.node, activeEdges, activeGrid);
                if(toDoor.pathNodes.length > 0) {
                    doorPaths.push({ door: door, distToDoor: toDoor.distance, pathToDoor: toDoor.pathNodes });
                }
            });

            doorPaths.sort((a,b) => a.distToDoor - b.distToDoor);
            let selectedDoors = doorPaths.slice(0, 3);
            let allCompleteRoutes = [];

            selectedDoors.forEach(item => {
                let toAssembly = getDijkstraPath(item.door.node, activeAssembly, activeOutside, activeGrid);
                if (toAssembly.pathNodes.length === 0) toAssembly = getDijkstraPath(item.door.node, activeAssembly, activeEdges, activeGrid);
                
                if (toAssembly.pathNodes.length > 0) {
                    let fullPathNodes = item.pathToDoor.concat(toAssembly.pathNodes.slice(1));
                    allCompleteRoutes.push({ doorName: item.door.name, distance: item.distToDoor, nodes: fullPathNodes });
                }
            });

            if(allCompleteRoutes.length === 0) return window.showToast("Lỗi mạng lưới định tuyến!", "error");
            allCompleteRoutes.sort((a,b) => a.distance - b.distance);

            function drawRoute(pathObj, colorHex, isPrimary) {
                const nodes = pathObj.nodes; const points = [startP]; 
                let firstNode = activeGrid[nodes[0]];
                if(Math.abs(startP.x - firstNode.x) > 1 && Math.abs(startP.z - firstNode.z) > 1) {
                    points.push(new THREE.Vector3(startP.x, 5, firstNode.z)); 
                }
                for(let i=0; i < nodes.length; i++) {
                    let node = activeGrid[nodes[i]]; points.push(new THREE.Vector3(node.x, 5, node.z));
                }
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineDashedMaterial({ color: colorHex, linewidth: isPrimary ? 8 : 4, scale: 1, dashSize: isPrimary ? 25 : 15, gapSize: 15, transparent: true, opacity: isPrimary ? 1 : 0.5 });
                const line = new THREE.Line(geo, mat); line.computeLineDistances(); 
                if(isPrimary) line.userData.isEvacLine = true; 
                evacuationLineGroup.add(line);
            }

            drawRoute(allCompleteRoutes[0], 0x10b981, true); 
            if(allCompleteRoutes[1]) drawRoute(allCompleteRoutes[1], 0xf59e0b, false); 
            if(allCompleteRoutes[2]) drawRoute(allCompleteRoutes[2], 0xf59e0b, false); 

            window.showToast(`Ưu tiên chạy theo đường SÁNG XANH LÁ ra ${allCompleteRoutes[0].doorName}!`, "success");
            
            if (isEndLine) gsapFlyCamera(END_OFFSET_X, 1800, END_OFFSET_Z, END_OFFSET_X, 0, END_OFFSET_Z);
            else gsapFlyCamera(0, 1800, 0, 0, 0, 0); 
            
            if(isDrawerOpen) window.toggleDrawer(); 
        }

        window.reportIncident = async function(type) {
            if(currentPos.x === null) return window.showToast("Phải ghim vị trí trước khi báo sự cố!", "error");
            try {
                await addDoc(collection(db, "ehs_incidents"), {
                    type: type, zone: currentPos.zone, reporter: currentUser,
                    x: currentPos.x, z: currentPos.z, time: new Date().toISOString(), status: 'Active'
                });
                window.showToast(`Đã phát lệnh báo động [${type}] toàn hệ thống!`, "success");
            } catch(e) {
                drawAlarmEffect(currentPos.x, currentPos.z, type);
                window.showToast(`Báo động [${type}] kích hoạt cục bộ!`, "info");
            }
            if(isDrawerOpen) window.toggleDrawer();
        }

        function drawAlarmEffect(x, z, type) {
            let markerColor = type === 'Cháy Nổ' ? 0xff0000 : (type === 'Hóa Chất' ? 0xa855f7 : 0x3b82f6);
            const beam = new THREE.Mesh(new THREE.CylinderGeometry(15, 40, 800, 16), new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
            beam.position.set(x, 400, z); beam.userData.clock = Math.random() * 100; scene.add(beam); alarmMarkers.push(beam);
            document.getElementById('alarm-panel').classList.remove('hidden');
            document.getElementById('alarm-list').innerHTML = `<div class="bg-slate-800 border border-red-500 p-3 rounded-xl shadow-md"><h4 class="font-black text-sm text-red-400 animate-pulse"><i class="ph-bold ph-warning"></i> ${type.toUpperCase()}</h4><p class="text-[11px] text-slate-300 font-bold mt-1"><i class="ph-fill ph-map-pin text-red-500"></i> ${currentPos.zone}</p></div>`;
            const sound = document.getElementById('alarm-sound'); if(sound.paused) sound.play().catch(e => console.log('Audio blocked'));
            gsapFlyCamera(x, 800, z + 300, x, 0, z);
        }

        try {
            signInAnonymously(auth).then(() => {
                onSnapshot(collection(db, "ehs_incidents"), (snapshot) => {
                    alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
                    document.getElementById('alarm-list').innerHTML = ''; let hasActiveAlarm = false;
                    snapshot.forEach(doc => {
                        const data = doc.data(); if(data.status !== 'Active') return;
                        hasActiveAlarm = true;
                        let colorCls = data.type === 'Cháy Nổ' ? 'text-red-400 border-red-500' : (data.type === 'Hóa Chất' ? 'text-purple-400 border-purple-500' : 'text-blue-400 border-blue-500');
                        let iconCls = data.type === 'Cháy Nổ' ? 'text-red-500' : (data.type === 'Hóa Chất' ? 'text-purple-500' : 'text-blue-500');
                        document.getElementById('alarm-list').innerHTML += `<div class="bg-slate-800 border ${colorCls} p-3 rounded-xl shadow-md cursor-pointer hover:bg-slate-700 transition" onclick="window.focusIncident(${data.x}, ${data.z})"><h4 class="font-black text-sm ${colorCls.split(' ')[0]} animate-pulse"><i class="ph-bold ph-warning"></i> ${data.type.toUpperCase()}</h4><p class="text-[11px] text-slate-300 font-bold mt-1"><i class="ph-fill ph-map-pin ${iconCls}"></i> ${data.zone}</p></div>`;
                        drawAlarmEffect(data.x, data.z, data.type); 
                    });
                    if (hasActiveAlarm) { document.getElementById('alarm-panel').classList.remove('hidden'); document.body.classList.add('border-4', 'border-red-600'); } 
                    else { document.getElementById('alarm-panel').classList.add('hidden'); document.body.classList.remove('border-4', 'border-red-600'); document.getElementById('alarm-sound').pause(); document.getElementById('alarm-sound').currentTime = 0; }
                }, (error) => { console.log("Cần mở quyền Firebase Rules."); });
            });
        } catch(err) { console.log("Bỏ qua lỗi Auth."); }

        window.clearAlarms = async function() {
            try {
                const snap = await getDocs(collection(db, "ehs_incidents"));
                snap.forEach(async (d) => { if(d.data().status === 'Active') await deleteDoc(doc(db, "ehs_incidents", d.id)); });
            } catch(e) { } 
            alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
            document.getElementById('alarm-panel').classList.add('hidden'); document.body.classList.remove('border-4', 'border-red-600');
            document.getElementById('alarm-sound').pause(); window.showToast("Đã tắt còi báo động.");
        }

        window.openGoogleMaps = function() { window.open(`https://www.google.com/maps/search/?api=1&query=${ANCHOR_LAT},${ANCHOR_LNG}`, '_blank'); }
        window.focusIncident = function(x, z) { gsapFlyCamera(x, 600, z + 300, x, 0, z); }

        function gsapFlyCamera(tx, ty, tz, lx, ly, lz) {
            const startPos = camera.position.clone(); const targetPos = new THREE.Vector3(tx, ty, tz);
            const startLook = controls.target.clone(); const targetLook = new THREE.Vector3(lx, ly, lz);
            let frame = 0; const maxFrames = 40;
            function anim() {
                frame++; let t = frame / maxFrames; t = t * (2 - t); 
                camera.position.lerpVectors(startPos, targetPos, t);
                controls.target.lerpVectors(startLook, targetLook, t);
                controls.update(); if(frame < maxFrames) requestAnimationFrame(anim);
            }
            anim();
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        function animate() {
            requestAnimationFrame(animate); const time = Date.now() * 0.005;
            if(myLocationMarker && myLocationMarker.userData.ring) {
                myLocationMarker.userData.ring.scale.x += 0.04; myLocationMarker.userData.ring.scale.y += 0.04; myLocationMarker.userData.ring.material.opacity -= 0.015;
                if(myLocationMarker.userData.ring.scale.x > 3) { myLocationMarker.userData.ring.scale.set(1, 1, 1); myLocationMarker.userData.ring.material.opacity = 0.8; }
            }
            alarmMarkers.forEach(m => { m.material.opacity = 0.5 + Math.sin(time + m.userData.clock) * 0.5; });
            evacuationLineGroup.children.forEach(child => { if(child.userData.isEvacLine) { child.material.dashOffset -= 1.5; } });
            controls.update(); renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
