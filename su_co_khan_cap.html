<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EHS 3D Emergency Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; background-color: #020617; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        .floating-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .drawer { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .drawer-closed { transform: translateY(calc(100% - 56px)); }
    </style>
</head>
<body class="text-slate-200 select-none">

    <!-- TOAST THÔNG BÁO -->
    <div id="toast" class="fixed top-4 sm:top-24 left-1/2 transform -translate-x-1/2 -translate-y-[200%] z-[200] transition-all duration-300 flex items-center gap-2 sm:gap-3 px-4 sm:px-6 py-3 sm:py-4 rounded-xl shadow-2xl font-bold text-white bg-slate-800/95 border border-slate-600 text-xs sm:text-sm w-11/12 sm:w-auto max-w-md text-center justify-center pointer-events-none">
        <i id="toast-icon" class="text-xl sm:text-2xl shrink-0"></i>
        <span id="toast-message" class="leading-tight"></span>
    </div>

    <!-- UI LAYER TẦNG TRÊN CÙNG -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between z-10">
        
        <header class="pointer-events-auto p-3 sm:p-6 flex justify-between items-start">
            <div class="bg-slate-900/90 floating-panel border border-blue-500/50 p-3 sm:p-4 rounded-2xl shadow-lg flex items-center gap-3">
                <a href="index.html" class="w-8 h-8 sm:w-10 sm:h-10 bg-slate-800 hover:bg-blue-600 hover:text-white rounded-lg flex items-center justify-center transition border border-slate-600 shrink-0 shadow-sm text-blue-400">
                    <i class="ph-bold ph-arrow-left text-base sm:text-lg"></i>
                </a>
                <div class="pr-2">
                    <h1 class="font-black text-sm sm:text-xl text-white tracking-tight flex items-center gap-1.5 sm:gap-2 leading-none uppercase">
                        <i class="ph-fill ph-siren text-red-500 animate-pulse text-lg sm:text-2xl"></i> COMMAND 3D
                    </h1>
                    <p class="text-blue-400 font-bold text-[8px] sm:text-[10px] tracking-widest uppercase mt-0.5">Asia Packaging Ind.</p>
                </div>
            </div>

            <!-- BẢNG CẢNH BÁO MÁY CHỦ -->
            <div class="bg-slate-900/90 floating-panel border border-red-500/50 p-3 sm:p-4 rounded-2xl shadow-2xl w-48 sm:w-80 hidden pointer-events-auto" id="alarm-panel">
                <h3 class="text-red-500 font-black text-xs sm:text-sm uppercase flex items-center gap-1.5 sm:gap-2 mb-2">
                    <i class="ph-fill ph-warning text-base sm:text-xl animate-pulse"></i> Cảnh Báo Khẩn
                </h3>
                <div id="alarm-list" class="space-y-2 max-h-32 sm:max-h-40 overflow-y-auto custom-scrollbar pr-1"></div>
                <div class="mt-2 pt-2 sm:mt-3 sm:pt-3 border-t border-red-500/30 flex flex-col gap-2">
                    <button onclick="window.openGoogleMaps()" class="w-full bg-blue-900/40 hover:bg-blue-600 border border-blue-500/50 text-blue-300 hover:text-white font-bold px-3 py-2 rounded-xl transition flex items-center justify-center gap-1.5 text-xs sm:text-sm">
                        <i class="ph-bold ph-satellite"></i> Mở Vệ Tinh (Điều Xe)
                    </button>
                    <button onclick="window.clearAlarms()" class="w-full bg-slate-800 hover:bg-red-900 border border-slate-600 text-slate-300 font-bold px-3 py-2 rounded-xl transition text-xs sm:text-sm">
                        Tắt còi báo động
                    </button>
                </div>
            </div>
        </header>

        <!-- HƯỚNG DẪN TRÊN MÀN HÌNH -->
        <div class="pointer-events-none w-full flex justify-center mt-1 absolute top-20 sm:top-24">
            <div class="bg-slate-900/80 floating-panel border border-slate-600/50 px-4 py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-300 shadow-lg flex items-center gap-2">
                <i class="ph-fill ph-info"></i> Dùng 1 ngón tay để xoay, 2 ngón tay để thu phóng. Chạm đúp để xác định vị trí.
            </div>
        </div>

        <!-- NGĂN KÉO ĐIỀU KHIỂN (BOTTOM DRAWER) -->
        <div id="tactical-drawer" class="pointer-events-auto w-full max-w-md mx-auto mt-auto bg-slate-900/95 floating-panel border border-blue-500/30 rounded-t-3xl shadow-[0_-15px_40px_rgba(0,0,0,0.6)] drawer">
            
            <div onclick="window.toggleDrawer()" class="w-full h-14 flex justify-between items-center px-6 cursor-pointer hover:bg-slate-800/50 rounded-t-3xl transition group border-b border-slate-700/50">
                <div class="w-12 h-1.5 bg-slate-600 rounded-full absolute top-2 left-1/2 -translate-x-1/2 opacity-50 group-hover:bg-blue-400 transition"></div>
                <h3 class="text-white font-black text-sm flex items-center gap-2 mt-2">
                    <i class="ph-bold ph-crosshair text-blue-400 text-lg"></i> Bảng Tác Chiến
                </h3>
                <div class="flex items-center gap-3 mt-2">
                    <div class="relative group" onclick="event.stopPropagation()">
                        <select id="zone-selector" onchange="window.selectZoneFromDropdown()" class="bg-slate-800 border border-slate-600 px-3 py-1.5 rounded-full text-[10px] font-bold text-sky-400 truncate max-w-[160px] outline-none appearance-none cursor-pointer">
                            <option value="none">Chưa xác định tọa độ</option>
                            <option value="khu-tap-ket">Điểm Tập Kết (NA3)</option>
                            <option value="van-phong">Văn Phòng & Canteen</option>
                            <option value="sx-cupper">Khu Sản Xuất (Cupper)</option>
                            <option value="sx-body">Khu Sản Xuất (Body Maker)</option>
                            <option value="sx-deco">Khu Sản Xuất (Decorator/PDP)</option>
                            <option value="sx-necker">Khu Sản Xuất (Necker)</option>
                            <option value="kho-tp-1">Khu Kho Thành Phẩm 1</option>
                            <option value="kho-tp-2">Khu Kho Thành Phẩm 2</option>
                            <option value="kho-nl">Khu Kho Nguyên Liệu</option>
                            <option value="tram-xlnt">Trạm Xử Lý Nước Thải</option>
                        </select>
                        <i class="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-sky-400 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="p-5 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="window.useGPS()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-blue-400 font-bold py-3.5 rounded-xl transition text-xs flex items-center justify-center gap-2 shadow-sm">
                        <i class="ph-bold ph-navigation-arrow text-base"></i> Tự động (GPS)
                    </button>
                    <button onclick="window.findEvacuationRoute()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-black py-3.5 rounded-xl transition shadow-[0_0_15px_rgba(16,185,129,0.4)] flex items-center justify-center gap-2 text-xs border border-emerald-400">
                        <i class="ph-bold ph-person-simple-run text-lg"></i> TÌM LỐI THOÁT
                    </button>
                </div>

                <div class="pt-3 border-t border-slate-800">
                    <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mb-2 text-center">Báo sự cố tại vị trí đã ghim</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="window.reportIncident('Cháy Nổ')" class="bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 hover:border-red-500 font-bold py-3 rounded-xl transition text-[10px] flex flex-col items-center justify-center gap-1 group">
                            <i class="ph-fill ph-fire text-xl group-hover:scale-110 transition-transform"></i> BÁO CHÁY
                        </button>
                        <button onclick="window.reportIncident('Hóa Chất')" class="bg-purple-900/30 hover:bg-purple-600 text-purple-400 hover:text-white border border-purple-500/30 hover:border-purple-500 font-bold py-3 rounded-xl transition text-[10px] flex flex-col items-center justify-center gap-1 group">
                            <i class="ph-fill ph-drop text-xl group-hover:scale-110 transition-transform"></i> HÓA CHẤT
                        </button>
                        <button onclick="window.reportIncident('Y Tế')" class="bg-blue-900/30 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/30 hover:border-blue-500 font-bold py-3 rounded-xl transition text-[10px] flex flex-col items-center justify-center gap-1 group">
                            <i class="ph-fill ph-first-aid text-xl group-hover:scale-110 transition-transform"></i> CẤP CỨU Y TẾ
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D CANVAS LAYER -->
    <div id="canvas-container"></div>
    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" loop preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7iFVmgoUL-sW3UlaMV0rlNQYugFiw2uA",
            authDomain: "ehs-training-app.firebaseapp.com",
            projectId: "ehs-training-app",
            storageBucket: "ehs-training-app.firebasestorage.app",
            messagingSenderId: "354083430003",
            appId: "1:354083430003:web:059953b7b9c1a9470a5406"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let scene, camera, renderer, controls, factoryFloor; 
        let myLocationMarker = null; 
        let evacuationLineGroup = new THREE.Group(); 
        let exitSignsGroup = new THREE.Group();
        let alarmMarkers = [];
        let raycaster, mouse;
        
        let currentUser = localStorage.getItem("ehs_user_name") || "Nhân viên EHS";
        let currentPos = { x: null, z: null, zone: null };
        let isDrawerOpen = true;

        // Tọa độ GPS Tâm Nhà Máy
        const ANCHOR_LAT = 11.1394136;
        const ANCHOR_LNG = 106.6241705;

        // =========================================================================
        // MẠNG LƯỚI HÀNH LANG ẢO (ORTHOGONAL NAVIGATION MESH) - CHUẨN XÁC 100% THEO KHE HỞ MÁY MÓC
        // =========================================================================
        
        // Trục X (Hành lang dọc): Tính toán lọt khe giữa các xưởng
        const C_X = {
            L_OUT: -300,  // Đường vành đai ngoài cùng bên Trái
            L_IN: -185,   // Khe hở giữa Cupper (phải=-215) và Bodymaker (trái=-170) -> -185
            MID: -20,     // Khe hở giữa Bodymaker (phải=-30) và Decorator (trái=-10) -> -20
            R_IN: 140,    // Khe hở giữa Decorator (phải=130) và Necker (trái=150) -> 140
            R_OUT: 270    // Đường vành đai ngoài cùng bên Phải
        };

        // Trục Z (Hành lang ngang): Tính toán lọt khe giữa các line
        const C_Z = {
            NA3: -380,    // Điểm tập kết cổng NA3
            FRONT: -280,  // Đường ngang trước mặt tiền Văn phòng
            A1: -180,     // Khe hở sau VP, trước Line 1
            A2: -60,      // Khe hở giữa Line 1 và Line 2
            A3: 60,       // Khe hở giữa Line 2 và Line 3 (Chỗ đặt Boiler)
            A4: 180,      // Khe hở sau Line 3
            A5: 270,      // Khe hở sau Kho nguyên liệu Coil/Bright
            A6: 360,      // Khe hở giữa Kho 1 và Kho 2
            A7: 450,      // Khe hở sau lưng Kho 2
            NA2: 580      // Đường vành đai sau cùng (Kho NL, XLNT)
        };

        const gridPoints = {};
        const navEdges = [];

        // Tạo toàn bộ các Nút giao (Intersections)
        for(let keyX in C_X) {
            for(let keyZ in C_Z) {
                gridPoints[`${keyX}_${keyZ}`] = { x: C_X[keyX], z: C_Z[keyZ] };
            }
        }

        // Nối các Nút tạo thành Mạng lưới (Chỉ đi vuông góc dọc/ngang)
        const xKeys = Object.keys(C_X);
        const zKeys = Object.keys(C_Z);
        for(let i = 0; i < xKeys.length; i++) { for(let j = 0; j < zKeys.length - 1; j++) navEdges.push([`${xKeys[i]}_${zKeys[j]}`, `${xKeys[i]}_${zKeys[j+1]}`]); }
        for(let j = 0; j < zKeys.length; j++) { for(let i = 0; i < xKeys.length - 1; i++) navEdges.push([`${xKeys[i]}_${zKeys[j]}`, `${xKeys[i+1]}_${zKeys[j]}`]); }

        // Đích đến cuối cùng an toàn nhất
        const ASSEMBLY_NODE = 'MID_NA3';

        // =========================================================================
        // KHAI BÁO TỌA ĐỘ CỬA THOÁT HIỂM (BÁM SÁT THỰC TẾ & CHỐNG LỖI ĐƯỜNG CHẠY)
        // =========================================================================
        const EXIT_DOORS = [
            // Khối Văn Phòng & Canteen (Trục FRONT Z = -280)
            { name: "Cửa Chính VP", node: "MID_FRONT", x: -20, z: -280 }, 
            { name: "Cửa Nối VP & Canteen", node: "R_IN_FRONT", x: 140, z: -280 },
            { name: "Cửa Canteen", node: "R_OUT_FRONT", x: 270, z: -280 },
            
            // Dọc Hành Lang Trái (L_OUT = -300) - Khu Cupper & Body
            { name: "Cửa Hông Trái 1 (Khu Cupper)", node: "L_OUT_A1", x: -300, z: -180 }, // Cửa mới theo PDF
            { name: "Cửa Hông Trái 2 (Sản Xuất)", node: "L_OUT_A3", x: -300, z: 60 },
            { name: "Cửa Hông Trái 3 (Kho Thành Phẩm)", node: "L_OUT_A6", x: -300, z: 360 },

            // Dọc Hành Lang Phải (R_OUT = 270) - Khu Necker
            { name: "Cửa Hông Phải 1 (Necker)", node: "R_OUT_A1", x: 270, z: -180 }, // Tương xứng bên phải
            { name: "Cửa Hông Phải 2 (Sản Xuất)", node: "R_OUT_A3", x: 270, z: 60 },
            { name: "Cửa Hông Phải 3 (Kho Thành Phẩm)", node: "R_OUT_A6", x: 270, z: 360 },

            // Vành đai Mặt Sau cùng (NA2 = 580)
            { name: "Cửa Sau (Trạm XLNT)", node: "R_IN_NA2", x: 140, z: 580 },
            { name: "Cửa Sau (Kho Hóa Chất)", node: "L_IN_NA2", x: -185, z: 580 }
        ];

        window.showToast = function(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            if (type === "success") { toast.className = "fixed top-4 sm:top-24 left-1/2 transform -translate-x-1/2 z-[200] transition-all duration-300 flex items-center gap-2 sm:gap-3 px-4 sm:px-6 py-3 sm:py-4 rounded-xl shadow-2xl font-bold text-emerald-400 bg-slate-800/95 border border-emerald-900 text-xs sm:text-sm w-11/12 sm:w-auto max-w-md text-center justify-center pointer-events-none"; icon.className = "ph-fill ph-check-circle text-xl sm:text-2xl shrink-0 text-emerald-500"; } 
            else { toast.className = "fixed top-4 sm:top-24 left-1/2 transform -translate-x-1/2 z-[200] transition-all duration-300 flex items-center gap-2 sm:gap-3 px-4 sm:px-6 py-3 sm:py-4 rounded-xl shadow-2xl font-bold text-red-400 bg-slate-800/95 border border-red-900 text-xs sm:text-sm w-11/12 sm:w-auto max-w-md text-center justify-center pointer-events-none"; icon.className = "ph-fill ph-warning-circle text-xl sm:text-2xl shrink-0 text-red-500"; }
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('-translate-y-[200%]');
            setTimeout(() => { toast.classList.add('-translate-y-[200%]'); }, 3000);
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x040b16); 
            // Giảm sương mù để có thể Zoom out bao quát toàn bộ nhà máy
            scene.fog = new THREE.FogExp2(0x040b16, 0.0003); 

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 1800, 1000); // Bird's eye view cao hơn

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1; 
            controls.minDistance = 100; controls.maxDistance = 4000;
            controls.target.set(0, 0, 0); 

            scene.add(new THREE.AmbientLight(0xffffff, 1));
            
            const gridHelper = new THREE.GridHelper(3000, 150, 0x1e293b, 0x0f172a); 
            gridHelper.position.y = -1; scene.add(gridHelper);

            scene.add(evacuationLineGroup);
            scene.add(exitSignsGroup);

            buildBlueprintV7(); // Bản cập nhật hình khối V7

            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();
            
            renderer.domElement.addEventListener('dblclick', onDoubleClick);
            let lastTap = 0;
            renderer.domElement.addEventListener('touchend', function(e) {
                let currentTime = new Date().getTime(); let tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) { e.preventDefault(); onDoubleClick(e.changedTouches[0]); }
                lastTap = currentTime;
            }, {passive: false});

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildBlueprintV7() {
            const floorGeo = new THREE.PlaneGeometry(1200, 2000);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.0, side: THREE.DoubleSide });
            factoryFloor = new THREE.Mesh(floorGeo, floorMat);
            factoryFloor.rotation.x = -Math.PI / 2;
            scene.add(factoryFloor);

            // Bờ tường rào bao quanh toàn KCN
            const fenceGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(680, 20, 1100));
            const fenceMat = new THREE.LineBasicMaterial({ color: 0x475569, linewidth: 1 });
            const fence = new THREE.LineSegments(fenceGeo, fenceMat);
            fence.position.set(-10, 10, 100); scene.add(fence);

            // ================== KHỐI NA3 (MẶT TIỀN / TRÊN CÙNG) ==================
            createTextLabel("ĐƯỜNG NA3 (CỔNG CHÍNH)", -10, 2, -450, 0x94a3b8, 16);
            drawRoad(680, 40, -10, -280); // Đường ngang trước Văn phòng
            
            // Vị trí tập kết & Phụ trợ
            drawWireframeZone(240, 80, -20, -360, 0x10b981, "VỊ TRÍ TẬP KẾT SỰ CỐ"); 
            drawWireframeZone(120, 60, -220, -350, 0x64748b, "NHÀ XE (PARKING)");
            drawWireframeZone(100, 40, 180, -360, 0xf59e0b, "TRẠM GAS");

            // Văn phòng & Canteen (Kéo dài, Canteen bên phải)
            drawWireframeZone(300, 50, -60, -230, 0x0ea5e9, "VĂN PHÒNG (OFFICE)");
            drawWireframeZone(100, 50, 180, -230, 0x0ea5e9, "CANTEEN");

            // ================== KHỐI SẢN XUẤT ==================
            drawWireframeZone(60, 250, -245, -25, 0x8b5cf6, "CUPPER AREA");

            // Line 1 (Z = -120)
            drawWireframeZone(140, 70, -100, -120, 0xef4444, "KHU RỬA / BODY MAKER #1");
            drawWireframeZone(140, 70, 60, -120, 0xef4444, "DECORATOR / PIN OVEN #1");
            drawWireframeZone(100, 70, 200, -120, 0xef4444, "NECKER LINE 1");

            // Line 2 (Z = 0)
            drawWireframeZone(140, 70, -100, 0, 0xef4444, "BODY MAKER #2");
            drawWireframeZone(140, 70, 60, 0, 0xef4444, "DECORATOR #2");
            drawWireframeZone(100, 70, 200, 0, 0xef4444, "NECKER LINE 2");

            // **BOILER AREA (Chèn giữa Line 2 và 3 - Không cản đường)**
            drawWireframeZone(40, 40, -100, 60, 0x64748b, "BOILER"); 

            // Line 3 (Z = 120)
            drawWireframeZone(140, 70, -100, 120, 0xef4444, "BODY MAKER #3");
            drawWireframeZone(140, 70, 60, 120, 0xef4444, "PDP LINE 3");
            drawWireframeZone(100, 70, 200, 120, 0xef4444, "NECKER LINE 3");

            // ================== KHỐI KHO VẬN ==================
            // Coil & Bright
            drawWireframeZone(140, 60, -100, 220, 0xa8a29e, "NGUYÊN LIỆU (COIL)");
            drawWireframeZone(140, 60, 60, 220, 0xa8a29e, "LON TRẮNG (BRIGHT)");
            drawWireframeZone(100, 60, 200, 220, 0x3b82f6, "ĐÓNG GÓI (PALLETIZER)");

            // Kho TP 1 (Z = 310)
            drawWireframeZone(240, 70, -40, 310, 0x8b5cf6, "KHO THÀNH PHẨM 1 (A)");
            drawWireframeZone(180, 70, 190, 310, 0x8b5cf6, "KHO THÀNH PHẨM 1 (B)");
            
            // Kho TP 2 (Z = 400)
            drawWireframeZone(240, 70, -40, 400, 0x8b5cf6, "KHO THÀNH PHẨM 2 (A)");
            drawWireframeZone(180, 70, 190, 400, 0x8b5cf6, "KHO THÀNH PHẨM 2 (B)");
            
            // Kho NL Chính & Phụ trợ (Mặt sau NA2)
            drawWireframeZone(260, 80, -30, 520, 0xa8a29e, "KHO NGUYÊN LIỆU CHÍNH");
            drawWireframeZone(100, 80, 170, 520, 0x06b6d4, "TRẠM XLNT (WWTP)");
            drawWireframeZone(40, 150, 260, 480, 0x8b5cf6, "KHO HÓA CHẤT");
            
            drawRoad(680, 40, -10, 580);  // Đường ngang vành đai NA2
            createTextLabel("ĐƯỜNG NA2 (PHÍA NAM)", -10, 2, 630, 0x94a3b8, 12);

            // ================== XÂY DỰNG CỬA THOÁT HIỂM 3D ==================
            EXIT_DOORS.forEach(door => {
                const boxGeo = new THREE.BoxGeometry(20, 20, 20);
                const boxMat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.8 });
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(door.x, 10, door.z);
                exitSignsGroup.add(box);
                createTextLabel("EXIT", door.x, 30, door.z, 0x10b981, 14);
            });
        }

        function drawRoad(w, d, x, z) {
            const geo = new THREE.PlaneGeometry(w, d);
            const mat = new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide, transparent: true, opacity: 0.3, depthWrite: false });
            const road = new THREE.Mesh(geo, mat); road.rotation.x = -Math.PI / 2; road.position.set(x, 0.5, z);
            scene.add(road);
        }

        function drawWireframeZone(w, d, x, z, colorHex, name) {
            const geo = new THREE.BoxGeometry(w, 40, d);
            const fillMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, fillMat); mesh.position.set(x, 20, z); scene.add(mesh);

            const edges = new THREE.EdgesGeometry(geo);
            const lineMat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2, transparent: true, opacity: 0.4 });
            const line = new THREE.LineSegments(edges, lineMat); line.position.set(x, 20, z); scene.add(line);

            if (name) createTextLabel(name, x, 45, z, colorHex, 9);
        }

        function createTextLabel(text, x, y, z, colorHex, fontSize) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
            ctx.font = `bold ${fontSize*2.5}px Inter`; ctx.textAlign = 'center'; ctx.fillText(text, 256, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.9, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(150, 37.5, 1); sprite.position.set(x, y, z); sprite.renderOrder = 1; scene.add(sprite);
        }

        function createMapPin() {
            const group = new THREE.Group();
            const pinMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9 }); 
            
            // Ghim bản đồ Drop-Pin
            const sphereGeo = new THREE.SphereGeometry(15, 32, 32);
            const sphere = new THREE.Mesh(sphereGeo, pinMat);
            sphere.position.y = 45; group.add(sphere);

            const coneGeo = new THREE.ConeGeometry(15, 25, 32);
            const cone = new THREE.Mesh(coneGeo, pinMat);
            cone.rotation.x = Math.PI; cone.position.y = 25; group.add(cone);

            const dotGeo = new THREE.SphereGeometry(6, 16, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0x020617 });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.set(0, 45, 12); group.add(dot);

            // Vòng sóng Radar dưới đáy
            const ringGeo = new THREE.RingGeometry(0.1, 50, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthTest: false });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2; ring.position.y = 1;
            group.add(ring);
            
            group.userData.ring = ring;
            return group;
        }

        window.toggleDrawer = function() {
            const drawer = document.getElementById('tactical-drawer');
            if (isDrawerOpen) { drawer.classList.add('drawer-closed'); } 
            else { drawer.classList.remove('drawer-closed'); }
            isDrawerOpen = !isDrawerOpen;
        }

        function onDoubleClick(event) {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);
            mouse.x = (clientX / window.innerWidth) * 2 - 1; mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(factoryFloor);
            if (intersects.length > 0) {
                setMarkerPosition(intersects[0].point.x, intersects[0].point.z);
            }
        }

        window.selectZoneFromDropdown = function() {
            const val = document.getElementById('zone-selector').value;
            if(val === 'none') return;
            let coords = {x: 0, z: 0};
            switch(val) {
                case 'khu-tap-ket': coords = {x: -20, z: -360}; break;
                case 'van-phong': coords = {x: -40, z: -230}; break;
                case 'sx-cupper': coords = {x: -245, z: -25}; break;
                case 'sx-body': coords = {x: -100, z: 0}; break;
                case 'sx-deco': coords = {x: 60, z: 0}; break;
                case 'sx-necker': coords = {x: 200, z: 0}; break;
                case 'kho-tp-1': coords = {x: -40, z: 310}; break;
                case 'kho-tp-2': coords = {x: -40, z: 400}; break;
                case 'kho-nl': coords = {x: -30, z: 520}; break;
                case 'tram-xlnt': coords = {x: 170, z: 520}; break;
            }
            setMarkerPosition(coords.x, coords.z);
        }

        window.useGPS = function() {
            if (navigator.geolocation) {
                window.showToast("Đang quét vệ tinh lấy tọa độ...", "info");
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        // Công thức quy đổi Vĩ độ Kinh độ sang Metres (Tương đối 1 độ ~ 111km)
                        let dx = (lng - ANCHOR_LNG) * 109000;
                        let dz = -(lat - ANCHOR_LAT) * 111000; 

                        if (Math.abs(dx) > 600 || Math.abs(dz) > 800) {
                            window.showToast("Bạn đang ở ngoài KCN. Dùng tọa độ giả lập để test.", "error");
                            dx = (Math.random() - 0.5) * 300; dz = (Math.random() - 0.5) * 500;
                        } else { window.showToast("Khóa mục tiêu thành công!", "success"); }
                        setMarkerPosition(dx, dz);
                    },
                    (error) => { window.showToast("Mất sóng GPS. Vui lòng chạm đúp lên khu vực bạn đứng.", "error"); },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else { window.showToast("Thiết bị không hỗ trợ GPS.", "error"); }
        }

        function setMarkerPosition(px, pz) {
            currentPos.x = px; currentPos.z = pz;
            
            let zoneName = "Khu vực chung";
            if(pz < -300) zoneName = "Khu Cổng NA3 / Tập Kết";
            else if(pz < -200) zoneName = "Khu Văn phòng / Canteen";
            else if(pz > 450) zoneName = "Kho NL / Trạm XLNT";
            else if(pz > 250) zoneName = "Khu Kho Thành Phẩm";
            else {
                if(px < -150) zoneName = "Khu Cupper";
                else if(px < -10) zoneName = "Khu Body Maker";
                else if(px < 120) zoneName = "Khu Decorator / PDP";
                else zoneName = "Khu Necker / Đóng gói";
            }
            currentPos.zone = zoneName;

            if(myLocationMarker) scene.remove(myLocationMarker);

            myLocationMarker = createMapPin();
            myLocationMarker.position.set(px, 0, pz);
            scene.add(myLocationMarker);

            gsapFlyCamera(px, 700, pz + 400, px, 0, pz);

            evacuationLineGroup.clear(); 
            
            const selector = document.getElementById('zone-selector');
            selector.options[0].text = `📍 Tọa độ: ${zoneName}`;
            selector.value = 'none';
            selector.classList.replace('text-sky-400', 'text-white');
            selector.classList.replace('bg-slate-800', 'bg-blue-600');
            
            if(!isDrawerOpen) window.toggleDrawer();
        }

        function getDijkstraPath(startNode, endNode) {
            let distances = {}; let prev = {}; let pq = [];
            for (let node in gridPoints) { distances[node] = Infinity; prev[node] = null; pq.push(node); }
            distances[startNode] = 0;

            while (pq.length > 0) {
                pq.sort((a, b) => distances[a] - distances[b]);
                let currNode = pq.shift();
                if (currNode === endNode || distances[currNode] === Infinity) break;

                let neighbors = [];
                navEdges.forEach(edge => {
                    if (edge[0] === currNode) neighbors.push(edge[1]);
                    if (edge[1] === currNode) neighbors.push(edge[0]);
                });

                neighbors.forEach(neighbor => {
                    if (pq.includes(neighbor)) {
                        let p1 = gridPoints[currNode]; let p2 = gridPoints[neighbor];
                        let dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.z - p2.z, 2));
                        let alt = distances[currNode] + dist;
                        if (alt < distances[neighbor]) { distances[neighbor] = alt; prev[neighbor] = currNode; }
                    }
                });
            }

            let path = []; let u = endNode;
            let totalDist = distances[endNode];
            if (prev[u] !== null || u === startNode) {
                while (u !== null) { path.unshift(u); u = prev[u]; }
            }
            return { pathNodes: path, distance: totalDist };
        }

        window.findEvacuationRoute = function() {
            if(currentPos.x === null) return window.showToast("Hãy thả ghim vị trí của bạn trước!", "error");
            evacuationLineGroup.clear();

            const startP = new THREE.Vector3(currentPos.x, 5, currentPos.z);
            
            // 1. Tìm Nút Hành Lang gần nhất
            let nearestNodeName = 'MID_FRONT'; let minDist = Infinity;
            for(let key in gridPoints) {
                let dist = startP.distanceTo(new THREE.Vector3(gridPoints[key].x, 5, gridPoints[key].z));
                if(dist < minDist) { minDist = dist; nearestNodeName = key; }
            }

            // 2. Tìm 3 Cửa thoát hiểm gần nhất
            let doorPaths = [];
            EXIT_DOORS.forEach(door => {
                let toDoor = getDijkstraPath(nearestNodeName, door.node);
                if(toDoor.pathNodes.length > 0) {
                    doorPaths.push({ door: door, distToDoor: toDoor.distance, path1: toDoor.pathNodes });
                }
            });
            doorPaths.sort((a,b) => a.distToDoor - b.distToDoor);
            let selectedDoors = doorPaths.slice(0, 3);

            let allCompleteRoutes = [];

            // 3. Từ mỗi Cửa, tính tiếp đường men theo tường về Điểm Tập Kết NA3
            selectedDoors.forEach(item => {
                let toAssembly = getDijkstraPath(item.door.node, ASSEMBLY_NODE);
                let totalDist = item.distToDoor + toAssembly.distance;
                
                allCompleteRoutes.push({ 
                    doorName: item.door.name, 
                    doorObj: item.door,
                    distance: totalDist, 
                    nodes1: item.path1,          // User -> Cửa
                    nodes2: toAssembly.pathNodes // Cửa -> Assembly
                });
            });
            allCompleteRoutes.sort((a,b) => a.distance - b.distance);

            if(allCompleteRoutes.length === 0) return window.showToast("Lỗi mạng lưới định tuyến!", "error");

            // 4. Hàm Vẽ Dải Lụa 3D (Đã tối ưu logic chống chạy giật lùi)
            function drawRoute(pathObj, colorHex, isPrimary) {
                const points = [startP]; 
                
                // Nối vuông góc từ vị trí đứng ra hành lang gần nhất
                let firstNode = gridPoints[pathObj.nodes1[0]];
                if(Math.abs(startP.x - firstNode.x) > 1 && Math.abs(startP.z - firstNode.z) > 1) {
                    points.push(new THREE.Vector3(startP.x, 5, firstNode.z)); 
                }
                
                // Men hành lang tới Cửa (nodes1 kết thúc chính tại Cửa)
                for(let i=0; i < pathObj.nodes1.length; i++) {
                    let node = gridPoints[pathObj.nodes1[i]];
                    points.push(new THREE.Vector3(node.x, 5, node.z));
                }

                // Chạy tiếp từ Cửa về Điểm Tập Kết (Bỏ qua điểm đầu của nodes2 vì nó trùng với Cửa)
                for(let i=1; i < pathObj.nodes2.length; i++) {
                    let node = gridPoints[pathObj.nodes2[i]];
                    points.push(new THREE.Vector3(node.x, 5, node.z));
                }

                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineDashedMaterial({ color: colorHex, linewidth: isPrimary ? 8 : 4, scale: 1, dashSize: isPrimary ? 25 : 15, gapSize: 15, transparent: true, opacity: isPrimary ? 1 : 0.5 });
                const line = new THREE.Line(geo, mat);
                line.computeLineDistances(); 
                if(isPrimary) line.userData.isEvacLine = true; 
                
                evacuationLineGroup.add(line);
            }

            // Vẽ Lối 1 (Xanh lá) & Lối dự phòng (Cam)
            drawRoute(allCompleteRoutes[0], 0x10b981, true);
            if(allCompleteRoutes[1]) drawRoute(allCompleteRoutes[1], 0xf59e0b, false);
            if(allCompleteRoutes[2]) drawRoute(allCompleteRoutes[2], 0xf59e0b, false);

            window.showToast(`Đã thiết lập 3 đường sơ tán. Chạy theo luồng ánh sáng XANH LÁ ra Cổng NA3 qua [${allCompleteRoutes[0].doorName}]!`, "success");
            gsapFlyCamera(0, 1600, 200, 0, 0, 0); 
            if(isDrawerOpen) window.toggleDrawer(); 
        }

        window.reportIncident = async function(type) {
            if(currentPos.x === null) return window.showToast("Phải ghim vị trí trước khi báo sự cố!", "error");
            
            try {
                // Sửa lỗi: Cần đảm bảo Firebase rules được mở
                await addDoc(collection(db, "ehs_incidents"), {
                    type: type, zone: currentPos.zone, reporter: currentUser,
                    x: currentPos.x, z: currentPos.z, time: new Date().toISOString(), status: 'Active'
                });
                window.showToast(`Đã phát lệnh báo động [${type}] toàn hệ thống!`, "success");
            } catch(e) {
                // Fallback nếu chưa mở Rules
                drawAlarmEffect(currentPos.x, currentPos.z, type);
                window.showToast(`Báo động [${type}] kích hoạt cục bộ! Cần mở Firebase Rules để đồng bộ.`, "info");
            }
            if(isDrawerOpen) window.toggleDrawer();
        }

        function drawAlarmEffect(x, z, type) {
            let markerColor = type === 'Cháy Nổ' ? 0xff0000 : (type === 'Hóa Chất' ? 0xa855f7 : 0x3b82f6);
            const beamGeo = new THREE.CylinderGeometry(20, 50, 800, 16);
            const beamMat = new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(x, 400, z); beam.userData.clock = Math.random() * 100;
            scene.add(beam); alarmMarkers.push(beam);

            document.getElementById('alarm-panel').classList.remove('hidden');
            document.getElementById('alarm-list').innerHTML = `<div class="bg-slate-800 border border-red-500 p-3 rounded-xl shadow-md"><h4 class="font-black text-sm text-red-400 animate-pulse"><i class="ph-bold ph-warning"></i> ${type.toUpperCase()}</h4><p class="text-[11px] text-slate-300 font-bold mt-1"><i class="ph-fill ph-map-pin text-red-500"></i> ${currentPos.zone}</p></div>`;
            
            const sound = document.getElementById('alarm-sound');
            if(sound.paused) sound.play().catch(e => console.log('Audio blocked'));
            gsapFlyCamera(x, 800, z + 300, x, 0, z);
        }

        try {
            signInAnonymously(auth).then(() => {
                onSnapshot(collection(db, "ehs_incidents"), (snapshot) => {
                    const panel = document.getElementById('alarm-panel');
                    const list = document.getElementById('alarm-list');
                    const sound = document.getElementById('alarm-sound');
                    
                    alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
                    list.innerHTML = ''; let hasActiveAlarm = false;

                    snapshot.forEach(doc => {
                        const data = doc.data(); if(data.status !== 'Active') return;
                        hasActiveAlarm = true;

                        let colorCls = data.type === 'Cháy Nổ' ? 'text-red-400 border-red-500' : (data.type === 'Hóa Chất' ? 'text-purple-400 border-purple-500' : 'text-blue-400 border-blue-500');
                        let iconCls = data.type === 'Cháy Nổ' ? 'text-red-500' : (data.type === 'Hóa Chất' ? 'text-purple-500' : 'text-blue-500');

                        list.innerHTML += `
                            <div class="bg-slate-800 border ${colorCls} p-3 rounded-xl shadow-md cursor-pointer hover:bg-slate-700 transition" onclick="window.focusIncident(${data.x}, ${data.z})">
                                <h4 class="font-black text-sm ${colorCls.split(' ')[0]} animate-pulse"><i class="ph-bold ph-warning"></i> ${data.type.toUpperCase()}</h4>
                                <p class="text-[11px] text-slate-300 font-bold mt-1"><i class="ph-fill ph-map-pin ${iconCls}"></i> ${data.zone}</p>
                            </div>
                        `;
                        drawAlarmEffect(data.x, data.z, data.type); 
                    });

                    if (hasActiveAlarm) {
                        panel.classList.remove('hidden'); document.body.classList.add('border-4', 'border-red-600');
                    } else {
                        panel.classList.add('hidden'); document.body.classList.remove('border-4', 'border-red-600');
                        sound.pause(); sound.currentTime = 0;
                    }
                }, (error) => { console.log("Firebase Rules lỗi."); });
            });
        } catch(err) { console.log("Bỏ qua lỗi Auth."); }

        window.clearAlarms = async function() {
            try {
                const snap = await getDocs(collection(db, "ehs_incidents"));
                snap.forEach(async (d) => { if(d.data().status === 'Active') await deleteDoc(doc(db, "ehs_incidents", d.id)); });
            } catch(e) { } 
            
            alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
            document.getElementById('alarm-panel').classList.add('hidden');
            document.body.classList.remove('border-4', 'border-red-600');
            document.getElementById('alarm-sound').pause();
            window.showToast("Đã tắt còi báo động.");
        }

        window.openGoogleMaps = function() {
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${ANCHOR_LAT},${ANCHOR_LNG}`;
            window.open(mapsUrl, '_blank');
        }

        window.focusIncident = function(x, z) { gsapFlyCamera(x, 600, z + 300, x, 0, z); }

        function gsapFlyCamera(tx, ty, tz, lx, ly, lz) {
            const startPos = camera.position.clone(); const targetPos = new THREE.Vector3(tx, ty, tz);
            const startLook = controls.target.clone(); const targetLook = new THREE.Vector3(lx, ly, lz);
            let frame = 0; const maxFrames = 40;

            function anim() {
                frame++; let t = frame / maxFrames; t = t * (2 - t); 
                camera.position.lerpVectors(startPos, targetPos, t);
                controls.target.lerpVectors(startLook, targetLook, t);
                controls.update();
                if(frame < maxFrames) requestAnimationFrame(anim);
            }
            anim();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.005;
            
            if(myLocationMarker && myLocationMarker.userData.ring) {
                myLocationMarker.userData.ring.scale.x += 0.04;
                myLocationMarker.userData.ring.scale.y += 0.04;
                myLocationMarker.userData.ring.material.opacity -= 0.015;
                if(myLocationMarker.userData.ring.scale.x > 3) {
                    myLocationMarker.userData.ring.scale.set(1, 1, 1);
                    myLocationMarker.userData.ring.material.opacity = 0.8;
                }
            }

            alarmMarkers.forEach(m => { m.material.opacity = 0.5 + Math.sin(time + m.userData.clock) * 0.5; });
            
            evacuationLineGroup.children.forEach(child => {
                if(child.userData.isEvacLine) { child.material.dashOffset -= 1.5; }
            });

            controls.update(); renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
