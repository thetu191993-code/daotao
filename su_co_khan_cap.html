    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; background-color: #020617; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 4px; }
        
        /* Hiệu ứng quét radar nền */
        .radar-scan { position: relative; overflow: hidden; }
        .radar-scan::after {
            content: ''; position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(59,130,246,0) 0%, rgba(59,130,246,0.2) 100%);
            animation: radar 3s linear infinite; pointer-events: none;
        }
        @keyframes radar { 0% { top: -50%; } 100% { top: 100%; } }

        .floating-panel { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* CSS Drawer (Kéo trượt từ dưới lên) */
        .drawer { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .drawer-closed { transform: translateY(calc(100% - 44px)); }
    </style>

        // Hệ tọa độ: Tâm X=0 là hành lang giữa. Z âm là cổng NA3. Z dương là NA2.

        const navNodes = {

            'M2_L':{ x: -160, z: 30 },   'M2_M':{ x: 0, z: 30 },   'M2_R':{ x: 160, z: 30 },   // Giữa Thành phẩm 1 & 2
            'M3_L':{ x: -160, z: 130 },  'M3_M':{ x: 0, z: 130 },  'M3_R':{ x: 160, z: 130 },  // Giữa Thành phẩm 2 & Kho Vật tư
            'R_L': { x: -160, z: 220 },  'R_R': { x: 160, z: 220 }                             // Hành lang sau sát NA2 (Không có R_M vì bị Kho Coil chắn)
        };

        const navEdges = [
            // Liên kết Dọc (Trục X)
            ['T_L', 'M1_L'], ['M1_L', 'M2_L'], ['M2_L', 'M3_L'], ['M3_L', 'R_L'], // Vành đai trái
            ['T_M', 'M1_M'], ['M1_M', 'M2_M'], ['M2_M', 'M3_M'],                  // Xương sống giữa (Dừng ở M3_M do Kho Coil chắn)
            ['T_R', 'M1_R'], ['M1_R', 'M2_R'], ['M2_R', 'M3_R'], ['M3_R', 'R_R'], // Vành đai phải
            ['NODE_ASSEMBLY', 'T_M'],                                             // Nối xương sống ra điểm tập kết

            // Liên kết Ngang (Trục Z)
            ['T_L', 'T_M'], ['T_M', 'T_R'],
            ['M1_L', 'M1_M'], ['M1_M', 'M1_R'],
            ['M2_L', 'M2_M'], ['M2_M', 'M2_R'],
            ['M3_L', 'M3_M'], ['M3_M', 'M3_R'],
            ['R_L', 'R_R'] // Hành lang sau nối thẳng 2 bên hông
        ];

        function dijkstra(startNode, endNode) {
            let distances = {}; let prev = {}; let pq = [];
            for (let node in navNodes) { distances[node] = Infinity; prev[node] = null; pq.push(node); }
            distances[startNode] = 0;

            while (pq.length > 0) {
                pq.sort((a, b) => distances[a] - distances[b]);
                let currNode = pq.shift();
                if (currNode === endNode || distances[currNode] === Infinity) break;

                let neighbors = [];
                navEdges.forEach(edge => {
                    if (edge[0] === currNode) neighbors.push(edge[1]);
                    if (edge[1] === currNode) neighbors.push(edge[0]);
                });

                neighbors.forEach(neighbor => {
                    if (pq.includes(neighbor)) {
                        let p1 = navNodes[currNode]; let p2 = navNodes[neighbor];
                        let dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.z - p2.z, 2));
                        let alt = distances[currNode] + dist;
                        if (alt < distances[neighbor]) { distances[neighbor] = alt; prev[neighbor] = currNode; }
                    }
                });
            }

            let path = []; let u = endNode;
            if (prev[u] !== null || u === startNode) {
                while (u !== null) { path.unshift(u); u = prev[u]; }
            }
            return path;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617); // Nền tối sâu
            scene.fog = new THREE.FogExp2(0x020617, 0.0015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
            camera.position.set(0, 800, -600); // Bird-eye view, nhìn từ NA3 vào

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; 
            controls.minDistance = 100; controls.maxDistance = 1200;
            controls.target.set(0, 0, 0); 

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            
            const gridHelper = new THREE.GridHelper(2000, 100, 0x1e293b, 0x0f172a); 
            gridHelper.position.y = -1; scene.add(gridHelper);

            buildAccurateBlueprint();

            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();
            
            renderer.domElement.addEventListener('dblclick', onDoubleClick);
            let lastTap = 0;
            renderer.domElement.addEventListener('touchend', function(e) {
                let currentTime = new Date().getTime(); let tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) { e.preventDefault(); onDoubleClick(e.changedTouches[0]); }
                lastTap = currentTime;
            }, {passive: false});

            window.addEventListener('resize', onWindowResize);
            
            // Tự mở ngăn kéo sau 1 giây
            setTimeout(() => { if(!isDrawerOpen) window.toggleDrawer(); }, 1000);
            animate();
        }

        function buildAccurateBlueprint() {
            const floorGeo = new THREE.PlaneGeometry(800, 1000);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.0, side: THREE.DoubleSide });
            factoryFloor = new THREE.Mesh(floorGeo, floorMat);
            factoryFloor.rotation.x = -Math.PI / 2;
            scene.add(factoryFloor);

            // ĐƯỜNG NA3 CỔNG CHÍNH (X=0, Z=-320)
            createTextLabel("ĐƯỜNG NA3 (CỔNG CHÍNH)", 0, 2, -320, 0x94a3b8, 20);
            
            // ZONE MẶT TIỀN (Z = -220)
            drawZone(120, 60, 0, -260, 0x10b981, "VỊ TRÍ TẬP KẾT SỰ CỐ"); 
            drawZone(80, 40, -100, -230, 0x64748b, "NHÀ XE (PARKING)");
            drawZone(60, 40, 110, -230, 0xf59e0b, "TRẠM GAS");
            
            // Khối Văn Phòng dính liền Canteen
            drawZone(200, 40, -40, -220, 0x0ea5e9, "VĂN PHÒNG (OFFICE)");
            drawZone(80, 40, 100, -220, 0x0ea5e9, "CANTEEN");

            // KHOẢNG HỞ HÀNH LANG T_M (Z = -180)

            // ZONE SẢN XUẤT (Z = -120, Rộng 80)
            drawZone(130, 80, -75, -120, 0xef4444, "BODY MAKER #1");
            drawZone(130, 80, 75, -120, 0xef4444, "DECORATOR / NECKER");

            // KHOẢNG HỞ HÀNH LANG M1_M (Z = -70)

            // ZONE KHO THÀNH PHẨM 1 (Z = -20, Rộng 80)
            drawZone(130, 80, -75, -20, 0x8b5cf6, "KHO THÀNH PHẨM 1 (A)");
            drawZone(130, 80, 75, -20, 0x8b5cf6, "KHO THÀNH PHẨM 1 (B)");

            // KHOẢNG HỞ HÀNH LANG M2_M (Z = 30)

            // ZONE KHO THÀNH PHẨM 2 (Z = 80, Rộng 80)
            drawZone(130, 80, -75, 80, 0x8b5cf6, "KHO THÀNH PHẨM 2 (A)");
            drawZone(130, 80, 75, 80, 0x8b5cf6, "KHO THÀNH PHẨM 2 (B)");

            // KHOẢNG HỞ HÀNH LANG M3_M (Z = 130)

            // ZONE KHO NGUYÊN LIỆU & XLNT (Z = 170, Rộng 60)
            // Kho Coil nguyên liệu chắn ngang xương sống giữa
            drawZone(200, 60, -40, 170, 0xa8a29e, "KHO NGUYÊN LIỆU (COIL)");
            drawZone(80, 60, 100, 170, 0x3b82f6, "TRẠM XỬ LÝ NƯỚC (WWTP)");

        function drawZone(w, d, x, z, colorHex, name) {
            const geo = new THREE.BoxGeometry(w, 20, d);
            const fillMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, fillMat); mesh.position.set(x, 10, z); scene.add(mesh);

            const edges = new THREE.EdgesGeometry(geo);
            const lineMat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2, transparent: true, opacity: 0.8 });
            const line = new THREE.LineSegments(edges, lineMat); line.position.set(x, 10, z); scene.add(line);

            if (name) createTextLabel(name, x, 25, z, colorHex, 8); // Chữ nhỏ lại xíu cho đỡ rối
        }

        function createTextLabel(text, x, y, z, colorHex, fontSize) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
            ctx.font = `bold ${fontSize*2.5}px Inter`; ctx.textAlign = 'center'; ctx.fillText(text, 256, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.9, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(120, 30, 1); sprite.position.set(x, y, z); sprite.renderOrder = 1; scene.add(sprite);
        }

        function createMapPin() {
            const group = new THREE.Group();
            
            // Bầu tròn phía trên
            const sphereGeo = new THREE.SphereGeometry(4, 32, 32);
            const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 }); // Cyan color
            const sphere = new THREE.Mesh(sphereGeo, mat);
            sphere.position.y = 12; group.add(sphere);

            // Chóp nhọn phía dưới
            const coneGeo = new THREE.ConeGeometry(4, 10, 32);
            const cone = new THREE.Mesh(coneGeo, mat);
            cone.rotation.x = Math.PI; cone.position.y = 7; group.add(cone);

            // Chấm trắng ở giữa
            const dotGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.y = 12; dot.position.z = 3.5; group.add(dot);

            // Vòng tròn sóng âm (Radar pulse) dưới gốc
            const ringGeo = new THREE.RingGeometry(0.1, 8, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthTest: false });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2; ring.position.y = 1;
            group.add(ring);
            
            group.userData.ring = ring;
            return group;
        }

        window.toggleDrawer = function() {
            const drawer = document.getElementById('tactical-drawer');
            const miniStatus = document.getElementById('mini-status');
            if (isDrawerOpen) {

                miniStatus.innerHTML = '<i class="ph-fill ph-caret-up"></i> Mở Menu';
            } else {
                drawer.classList.remove('drawer-closed');
                miniStatus.innerHTML = '<i class="ph-fill ph-caret-down"></i> Đóng';
            }
            isDrawerOpen = !isDrawerOpen;
        }

        window.useGPS = function() {
            if (navigator.geolocation) {
                window.showToast("Đang mượn sóng vệ tinh...", "info");
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let dx = (Math.random() - 0.5) * 150; let dz = (Math.random() - 0.5) * 200;
                        setMarkerPosition(dx, dz);
                        if(!isDrawerOpen) window.toggleDrawer();
                    },
                    (error) => { window.showToast("Mất sóng GPS. Vui lòng chạm đúp vào bản đồ 3D.", "error"); },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else { window.showToast("Thiết bị không hỗ trợ.", "error"); }
        }

        function onDoubleClick(event) {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);
            mouse.x = (clientX / window.innerWidth) * 2 - 1; mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(factoryFloor);
            if (intersects.length > 0) {
                setMarkerPosition(intersects[0].point.x, intersects[0].point.z);
                if(!isDrawerOpen) window.toggleDrawer();
            }
        }

        function setMarkerPosition(px, pz) {
            currentPos.x = px; currentPos.z = pz;
            
            if(pz < -180) currentPos.zone = "Khu Cổng NA3 / VP / Canteen";
            else if(pz < -70) currentPos.zone = "Khu Sản Xuất (Cupper/Decorator)";
            else if(pz < 30) currentPos.zone = "Khu Thành Phẩm 1";
            else if(pz < 130) currentPos.zone = "Khu Thành Phẩm 2";
            else currentPos.zone = "Kho Nguyên Liệu / XLNT / NA2";

            if(myLocationMarker) scene.remove(myLocationMarker);

            myLocationMarker = createMapPin();
            myLocationMarker.position.set(px, 0, pz);
            scene.add(myLocationMarker);

            gsapFlyCamera(px, 400, pz + 200, px, 0, pz);

            if(evacuationLine) { scene.remove(evacuationLine); evacuationLine = null; }
            
            document.getElementById('current-loc-text').innerText = `${currentPos.zone}`;
            document.getElementById('current-loc-text').classList.replace('text-slate-400', 'text-cyan-400');
            document.getElementById('loc-dot').className = "w-2 h-2 rounded-full bg-cyan-400 animate-pulse shrink-0";
        }

        window.findEvacuationRoute = function() {
            if(currentPos.x === null) return window.showToast("Vui lòng chạm đúp bản đồ để ghim vị trí trước!", "error");
            if(evacuationLine) scene.remove(evacuationLine);

            const startP = new THREE.Vector3(currentPos.x, 2, currentPos.z);
            
            // 1. Tìm Nút Hành Lang gần nhất (bỏ qua điểm tập kết)
            let nearestNodeName = 'T_M'; let minDist = Infinity;
            for(let key in navNodes) {
                if(key === NODE_ASSEMBLY) continue; 
                let dist = startP.distanceTo(new THREE.Vector3(navNodes[key].x, 2, navNodes[key].z));
                if(dist < minDist) { minDist = dist; nearestNodeName = key; }
            }

            // 2. Chạy AI Dijkstra ra Điểm tập kết NA3
            const pathNodeNames = dijkstra(nearestNodeName, NODE_ASSEMBLY);
            if(pathNodeNames.length === 0) return window.showToast("Lỗi mạng lưới thoát hiểm!", "error");

            // 3. Xây dựng dải điểm vuông góc (Ép bẻ góc 90 độ nếu đi xéo)
            const points = [startP]; 
            
            // Bẻ góc vuông cho đoạn từ Chỗ đứng -> Nút hành lang đầu tiên
            let firstNodeObj = navNodes[pathNodeNames[0]];
            // Đi dọc ra hành lang trước (X=0 hoặc X=+-160), sau đó đi ngang. 
            // Thường thì men theo hành lang ngang Z sẽ nhanh hơn.
            points.push(new THREE.Vector3(startP.x, 2, firstNodeObj.z));
            points.push(new THREE.Vector3(firstNodeObj.x, 2, firstNodeObj.z));

            // Bẻ góc vuông cho các nút nội bộ (Đề phòng có đường chéo do sửa file)
            for(let i=1; i < pathNodeNames.length; i++) {
                let n1 = navNodes[pathNodeNames[i-1]]; let n2 = navNodes[pathNodeNames[i]];
                if(n1.x !== n2.x && n1.z !== n2.z) points.push(new THREE.Vector3(n1.x, 2, n2.z));
                points.push(new THREE.Vector3(n2.x, 2, n2.z));
            }

            // 4. Vẽ dải ánh sáng đứt khúc đang chảy
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineDashedMaterial({ color: 0x10b981, linewidth: 8, scale: 1, dashSize: 10, gapSize: 6 });
            evacuationLine = new THREE.Line(geo, mat);
            evacuationLine.computeLineDistances(); 
            scene.add(evacuationLine);

            window.showToast(`Bình tĩnh! Di chuyển theo Mũi tên Xanh lá ra Cổng NA3!`, "success");
            gsapFlyCamera(0, 700, -100, 0, 0, -100); 
            if(isDrawerOpen) window.toggleDrawer(); // Đóng ngăn kéo để nhìn toàn cảnh
        }

        window.reportIncident = async function(type) {
            if(currentPos.x === null) return window.showToast("Phải ghim vị trí trước khi báo sự cố!", "error");
            
            try {
                // Thử ghi Firebase, nếu tường lửa chặn thì catch lỗi và chạy Offline
                await addDoc(collection(db, "ehs_incidents"), {
                    type: type, zone: currentPos.zone, reporter: currentUser,
                    x: currentPos.x, z: currentPos.z, time: new Date().toISOString(), status: 'Active'
                });
                window.showToast(`Đã phát lệnh báo động [${type}] lên máy chủ!`, "success");
            } catch(e) {
                console.warn("Firebase bị khóa quyền. Chuyển sang vẽ Offline.");
                drawOfflineAlarm(currentPos.x, currentPos.z, type);
                window.showToast(`Báo động [${type}] kích hoạt cục bộ!`, "info");
            }
            if(isDrawerOpen) window.toggleDrawer();
        }

        function drawOfflineAlarm(x, z, type) {
            let markerColor = type === 'Cháy Nổ' ? 0xff0000 : (type === 'Hóa Chất' ? 0xa855f7 : 0x3b82f6);
            const beamGeo = new THREE.CylinderGeometry(15, 40, 500, 16);
            const beamMat = new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(x, 250, z); beam.userData.clock = Math.random() * 100;
            scene.add(beam); alarmMarkers.push(beam);

            document.getElementById('alarm-panel').classList.remove('hidden');
            document.getElementById('alarm-list').innerHTML = `<div class="bg-slate-800 border border-red-500 p-2 rounded-xl shadow-md"><h4 class="font-black text-xs text-red-400 animate-pulse"><i class="ph-bold ph-warning"></i> ${type.toUpperCase()}</h4><p class="text-[10px] text-slate-300 font-bold"><i class="ph-fill ph-map-pin"></i> ${currentPos.zone}</p></div>`;
            const sound = document.getElementById('alarm-sound');
            if(sound.paused) sound.play().catch(e => console.log('Audio blocked'));
            gsapFlyCamera(x, 500, z + 200, x, 0, z);
        }

        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, "ehs_incidents"), (snapshot) => {
                const panel = document.getElementById('alarm-panel');
                const list = document.getElementById('alarm-list');
                const sound = document.getElementById('alarm-sound');
                
                alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
                list.innerHTML = ''; let hasActiveAlarm = false;

                snapshot.forEach(doc => {
                    const data = doc.data(); if(data.status !== 'Active') return;
                    hasActiveAlarm = true;

                    let colorCls = data.type === 'Cháy Nổ' ? 'text-red-400 border-red-500' : (data.type === 'Hóa Chất' ? 'text-purple-400 border-purple-500' : 'text-blue-400 border-blue-500');
                    
                    list.innerHTML += `
                        <div class="bg-slate-800 border ${colorCls} p-2 rounded-xl shadow-md cursor-pointer hover:bg-slate-700 transition" onclick="window.focusIncident(${data.x}, ${data.z})">
                            <h4 class="font-black text-xs ${colorCls.split(' ')[0]} animate-pulse"><i class="ph-bold ph-warning"></i> ${data.type.toUpperCase()}</h4>
                            <p class="text-[10px] text-slate-300 font-bold"><i class="ph-fill ph-map-pin"></i> ${data.zone}</p>
                        </div>
                    `;

                    let markerColor = data.type === 'Cháy Nổ' ? 0xff0000 : (data.type === 'Hóa Chất' ? 0xa855f7 : 0x3b82f6);
                    const beamGeo = new THREE.CylinderGeometry(15, 40, 500, 16);
                    const beamMat = new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.8 });
                    const beam = new THREE.Mesh(beamGeo, beamMat);
                    beam.position.set(data.x, 250, data.z); beam.userData.clock = Math.random() * 100;
                    scene.add(beam); alarmMarkers.push(beam);
                });

                if (hasActiveAlarm) {
                    panel.classList.remove('hidden'); document.body.classList.add('border-4', 'border-red-600');
                    if(sound.paused) sound.play().catch(e => console.log('Audio blocked'));
                } else {
                    panel.classList.add('hidden'); document.body.classList.remove('border-4', 'border-red-600');
                    sound.pause(); sound.currentTime = 0;
                }
            }, (error) => { console.log("Khóa quyền DB, sử dụng Offline Mode."); });
        }).catch(err => { console.log("Lỗi Auth, sử dụng Offline Mode."); });

        window.clearAlarms = async function() {
            try {
                const snap = await getDocs(collection(db, "ehs_incidents"));
                snap.forEach(async (d) => { if(d.data().status === 'Active') await deleteDoc(doc(db, "ehs_incidents", d.id)); });
            } catch(e) { } // Bỏ qua lỗi DB
            alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
            document.getElementById('alarm-panel').classList.add('hidden');
            document.body.classList.remove('border-4', 'border-red-600');
            document.getElementById('alarm-sound').pause();
            window.showToast("Đã tắt còi báo động.");
        }

        window.openGoogleMaps = function() {
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${MAPS_LAT},${MAPS_LNG}`;
            window.open(mapsUrl, '_blank');
        }

        window.focusIncident = function(x, z) { gsapFlyCamera(x, 400, z + 200, x, 0, z); }

        function gsapFlyCamera(tx, ty, tz, lx, ly, lz) {
            const startPos = camera.position.clone(); const targetPos = new THREE.Vector3(tx, ty, tz);
            const startLook = controls.target.clone(); const targetLook = new THREE.Vector3(lx, ly, lz);
            let frame = 0; const maxFrames = 50;

            function anim() {
                frame++; let t = frame / maxFrames; t = t * (2 - t); 
                camera.position.lerpVectors(startPos, targetPos, t);
                controls.target.lerpVectors(startLook, targetLook, t);
                controls.update();
                if(frame < maxFrames) requestAnimationFrame(anim);
            }
            anim();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.005;
            
            if(myLocationMarker && myLocationMarker.userData.ring) {
                myLocationMarker.userData.ring.scale.x += 0.03;
                myLocationMarker.userData.ring.scale.y += 0.03;
                myLocationMarker.userData.ring.material.opacity -= 0.01;
                if(myLocationMarker.userData.ring.scale.x > 3) {
                    myLocationMarker.userData.ring.scale.set(1, 1, 1);
                    myLocationMarker.userData.ring.material.opacity = 0.6;
                }
            }

            alarmMarkers.forEach(m => { m.material.opacity = 0.4 + Math.sin(time + m.userData.clock) * 0.5; });
            if (evacuationLine) { evacuationLine.material.dashOffset -= 0.5; }

            controls.update(); renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
</body>
</html>
