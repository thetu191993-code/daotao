            'EXIT_TOP_LEFT': { x: -140, z: -160 },

            'EXIT_BOT_LEFT': { x: -140, z: 120 },

            'EXIT_REAR_LEFT': { x: -60, z: 220 },

            'PATH_OUT_RR': { x: 60, z: 240 },

            // Hành lang nội bộ xưởng (Central Corridor)
            'PATH_IN_T': { x: 0, z: -100 },
            'PATH_IN_M': { x: 0, z: 0 },
            'PATH_IN_B': { x: 0, z: 100 }
        };

        // Khai báo các đoạn đường nối nhau (Edges)
        const navEdges = [
            // Từ ngoài đường nối thẳng vào Điểm tập kết
            ['PATH_OUT_TL', NODE_ASSEMBLY], ['PATH_OUT_TR', NODE_ASSEMBLY],
            
            // Đường vành đai bao quanh nhà máy
            ['PATH_OUT_TL', 'PATH_OUT_ML'], ['PATH_OUT_ML', 'PATH_OUT_BL'],
            ['PATH_OUT_TR', 'PATH_OUT_MR'], ['PATH_OUT_MR', 'PATH_OUT_BR'],
            ['PATH_OUT_BL', 'PATH_OUT_RL'], ['PATH_OUT_BR', 'PATH_OUT_RR'],
            ['PATH_OUT_RL', 'PATH_OUT_RR'],

            // Nối Cửa thoát hiểm ra đường vành đai
            ['EXIT_TOP_LEFT', 'PATH_OUT_TL'], ['EXIT_TOP_RIGHT', 'PATH_OUT_TR'],
            ['EXIT_MID_LEFT', 'PATH_OUT_ML'], ['EXIT_MID_RIGHT', 'PATH_OUT_MR'],
            ['EXIT_BOT_LEFT', 'PATH_OUT_BL'], ['EXIT_BOT_RIGHT', 'PATH_OUT_BR'],
            ['EXIT_REAR_LEFT', 'PATH_OUT_RL'], ['EXIT_REAR_RIGHT', 'PATH_OUT_RR'],

            // Nối hành lang nội bộ ra cửa
            ['PATH_IN_T', 'EXIT_TOP_LEFT'], ['PATH_IN_T', 'EXIT_TOP_RIGHT'],
            ['PATH_IN_M', 'EXIT_MID_LEFT'], ['PATH_IN_M', 'EXIT_MID_RIGHT'],
            ['PATH_IN_B', 'EXIT_BOT_LEFT'], ['PATH_IN_B', 'EXIT_BOT_RIGHT'],
            ['PATH_IN_B', 'EXIT_REAR_LEFT'], ['PATH_IN_B', 'EXIT_REAR_RIGHT'],

            // Nối dọc hành lang nội bộ
            ['PATH_IN_T', 'PATH_IN_M'], ['PATH_IN_M', 'PATH_IN_B']
        ];

        function dijkstra(startNode, endNode) {
            let distances = {};
            let prev = {};
            let pq = []; // Priority queue đơn giản

            // Khởi tạo đồ thị
            for (let node in navNodes) {
                distances[node] = Infinity;
                prev[node] = null;
                pq.push(node);
            }
            distances[startNode] = 0;

            while (pq.length > 0) {
                // Lấy node có khoảng cách nhỏ nhất
                pq.sort((a, b) => distances[a] - distances[b]);
                let currNode = pq.shift();

                if (currNode === endNode) break; // Đã đến đích
                if (distances[currNode] === Infinity) break;

                // Tìm các node kề
                let neighbors = [];
                navEdges.forEach(edge => {
                    if (edge[0] === currNode) neighbors.push(edge[1]);
                    if (edge[1] === currNode) neighbors.push(edge[0]);
                });

                neighbors.forEach(neighbor => {
                    if (pq.includes(neighbor)) {
                        let p1 = navNodes[currNode];
                        let p2 = navNodes[neighbor];
                        let dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.z - p2.z, 2));
                        let alt = distances[currNode] + dist;

                        if (alt < distances[neighbor]) {
                            distances[neighbor] = alt;
                            prev[neighbor] = currNode;
                        }
                    }
                });
            }

            // Truy vết đường đi
            let path = [];
            let u = endNode;
            if (prev[u] !== null || u === startNode) {
                while (u !== null) {
                    path.unshift(u);
                    u = prev[u];
                }
            }
            return path;
        }

        window.showToast = function(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            toast.className = "fixed top-4 sm:top-20 left-1/2 transform -translate-x-1/2 z-[200] transition-all duration-300 flex items-center gap-2 sm:gap-3 px-4 sm:px-6 py-3 sm:py-4 rounded-xl shadow-2xl font-bold text-white bg-slate-800/95 backdrop-blur border text-xs sm:text-sm w-11/12 sm:w-auto max-w-md text-center justify-center";
            
            if (type === "success") { toast.classList.add('border-emerald-500'); icon.className = "ph-fill ph-check-circle text-emerald-400 shrink-0"; } 
            else if (type === "error") { toast.classList.add('border-red-500'); icon.className = "ph-fill ph-warning-circle text-red-400 animate-pulse shrink-0"; } 
            else { toast.classList.add('border-blue-500'); icon.className = "ph-fill ph-info text-blue-400 shrink-0"; }
            
            document.getElementById('toast-message').innerHTML = message;
            toast.classList.remove('-translate-y-[200%]');
            setTimeout(() => { toast.classList.add('-translate-y-[200%]'); }, 4000);
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060b19); // Nền xanh đen sâu thẳm
            scene.fog = new THREE.FogExp2(0x060b19, 0.001);

            // Camera góc nhìn chiến thuật (Bird's-eye view)
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
            camera.position.set(0, 800, 400); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; 
            controls.minDistance = 100; controls.maxDistance = 1500;
            controls.target.set(0, 0, 0); 

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
            
            // Lưới grid hệ tọa độ quân sự
            const gridHelper = new THREE.GridHelper(2000, 100, 0x1e293b, 0x0f172a); 
            gridHelper.position.y = -1; scene.add(gridHelper);

            buildAccurateBlueprint();

            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();
            
            // Sự kiện Chạm đúp (Desktop & Mobile)
            renderer.domElement.addEventListener('dblclick', onDoubleClick);
            let lastTap = 0;
            renderer.domElement.addEventListener('touchend', function(e) {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) { 
                    e.preventDefault(); 
                    onDoubleClick(e.changedTouches[0]); 
                }
                lastTap = currentTime;
            }, {passive: false});

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildAccurateBlueprint() {

            drawZone(80, 40, -100, -255, 0x64748b, "NHÀ XE (PARKING)");
            drawZone(60, 40, 110, -255, 0xf59e0b, "TRẠM GAS");
            drawZone(80, 40, 100, -200, 0x0ea5e9, "CANTEEN");
            drawZone(60, 30, -100, -200, 0x0ea5e9, "VĂN PHÒNG");

            // ==========================================
            // KHU VỰC SẢN XUẤT CHÍNH (TRỤC Z TỪ -150 ĐẾN 0)
            // ==========================================

            drawZone(100, 60, -20, -120, 0xef4444, "BODY MAKER #1");
            drawZone(80, 60, 80, -120, 0xef4444, "DECORATOR #1");

            drawZone(120, 60, -40, -40, 0xef4444, "BODY MAKER #2");
            drawZone(80, 60, 70, -40, 0xef4444, "DECORATOR #2");
            drawZone(60, 140, 140, -80, 0xef4444, "NECKER LINES");

            // ==========================================

            drawZone(80, 50, 100, 40, 0x8b5cf6, "KHO THÀNH PHẨM 1 (C)");

            drawZone(80, 50, 10, 100, 0x8b5cf6, "KHO THÀNH PHẨM 2 (B)");

            drawZone(180, 80, -40, 240, 0xa8a29e, "KHO NGUYÊN LIỆU (COIL)");
            drawZone(60, 60, 120, 230, 0x3b82f6, "TRẠM XỬ LÝ NƯỚC (WWTP)");
            drawZone(40, 80, 170, 240, 0xd946ef, "KHO HÓA CHẤT");

            // Vẽ ký hiệu Cửa thoát hiểm (Exit Doors) dựa trên tọa độ Nodes

                    const dMesh = new THREE.Mesh(dGeo, dMat);

                    scene.add(dMesh);
                }
            }
        }

        // Vẽ Khối nhà dạng khung viền ánh sáng (Wireframe Hologram)
        function drawZone(w, d, x, z, colorHex, name, isSolid = false) {
            const geo = new THREE.BoxGeometry(w, 20, d);
            
            // Vẽ mặt kính mờ bên trong
            const fillMat = new THREE.MeshBasicMaterial({ 
                color: colorHex, transparent: true, opacity: isSolid ? 0.3 : 0.05, 
                depthWrite: false, side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, fillMat);
            mesh.position.set(x, 10, z);
            scene.add(mesh);

            // Vẽ viền sáng Neon
            const edges = new THREE.EdgesGeometry(geo);
            const lineMat = new THREE.LineBasicMaterial({ 
                color: colorHex, linewidth: 2, transparent: true, opacity: 0.8 
            });
            const line = new THREE.LineSegments(edges, lineMat);
            line.position.set(x, 10, z);
            scene.add(line);

            if (name) createTextLabel(name, x, 25, z, colorHex, 10);
        }

        function createTextLabel(text, x, y, z, colorHex, fontSize) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
            ctx.font = `bold ${fontSize*2.5}px Inter`; // Sửa lỗi w= ở đây
            ctx.textAlign = 'center'; ctx.fillText(text, 256, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.9, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(120, 30, 1); 
            sprite.position.set(x, y, z);
            sprite.renderOrder = 1;
            scene.add(sprite);
        }

        window.useGPS = function() {
            if (navigator.geolocation) {
                window.showToast("Đang mượn sóng GPS vệ tinh...", "info");
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Demo: Rải ngẫu nhiên trong khuôn viên nhà máy
                        let dx = (Math.random() - 0.5) * 200; 
                        let dz = (Math.random() - 0.5) * 300;
                        setMarkerPosition(dx, dz);
                    },
                    (error) => { window.showToast("Mất sóng GPS. Vui lòng chạm vào bản đồ để định vị.", "error"); },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else { window.showToast("Thiết bị không hỗ trợ GPS.", "error"); }
        }

        function onDoubleClick(event) {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(factoryFloor);

            if (intersects.length > 0) {
                setMarkerPosition(intersects[0].point.x, intersects[0].point.z);
            }
        }

        function setMarkerPosition(px, pz) {
            currentPos.x = px;
            currentPos.z = pz;
            
            // Dò tên phân khu
            if(pz < -200) currentPos.zone = "Khu Cổng NA3 / Điểm tập kết";
            else if(pz < 0) currentPos.zone = "Khu Sản Xuất (Body/Decorator)";
            else if(pz < 150) currentPos.zone = "Khu Kho Thành Phẩm";
            else currentPos.zone = "Khu Kho Nguyên Liệu / NA2";

            if(myLocationMarker) scene.remove(myLocationMarker);

            // Vẽ cột sáng định vị
            const geo = new THREE.CylinderGeometry(2, 2, 100, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.9 });
            myLocationMarker = new THREE.Mesh(geo, mat);
            myLocationMarker.position.set(px, 50, pz);
            scene.add(myLocationMarker);

            const ringGeo = new THREE.RingGeometry(8, 10, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2; ring.position.y = -48;
            myLocationMarker.add(ring);

            gsapFlyCamera(px, 300, pz + 200, px, 0, pz);

            if(evacuationLine) { scene.remove(evacuationLine); evacuationLine = null; }
            
            document.getElementById('current-loc-text').innerText = `${currentPos.zone}`;
            document.getElementById('current-loc-text').classList.replace('text-slate-400', 'text-cyan-400');
            document.getElementById('loc-dot').className = "w-2 h-2 rounded-full bg-cyan-400 animate-pulse shrink-0";
        }

        window.findEvacuationRoute = function() {
            if(currentPos.x === null) return window.showToast("Vui lòng chạm đúp để ghim vị trí trước khi tìm đường!", "error");
            if(evacuationLine) scene.remove(evacuationLine);

            const startP = new THREE.Vector3(currentPos.x, 2, currentPos.z);
            
            // 1. Tìm Nút Hành Lang gần nhất với vị trí người dùng
            let nearestNodeName = 'PATH_IN_M';
            let minDist = Infinity;
            for(let key in navNodes) {
                if(key === NODE_ASSEMBLY) continue; // Không bay thẳng ra Assembly
                let dist = startP.distanceTo(new THREE.Vector3(navNodes[key].x, 2, navNodes[key].z));
                if(dist < minDist) {
                    minDist = dist;
                    nearestNodeName = key;
                }
            }

            // 2. Chạy thuật toán Dijkstra từ Nút gần nhất ra tới Điểm Tập Kết
            const pathNodeNames = dijkstra(nearestNodeName, NODE_ASSEMBLY);
            
            if(pathNodeNames.length === 0) return window.showToast("Không tìm thấy lối thoát an toàn!", "error");

            // 3. Nối các điểm lại thành đường vẽ
            const points = [startP]; // Bắt đầu từ chỗ đứng
            pathNodeNames.forEach(nodeName => {
                points.push(new THREE.Vector3(navNodes[nodeName].x, 2, navNodes[nodeName].z));
            });

            // 4. Vẽ dải ánh sáng đứt khúc đang chảy
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineDashedMaterial({ 
                color: 0x10b981, linewidth: 6, scale: 1, dashSize: 8, gapSize: 6 
            });
            evacuationLine = new THREE.Line(geo, mat);
            evacuationLine.computeLineDistances(); 
            scene.add(evacuationLine);

            window.showToast(`Bình tĩnh! Di chuyển theo Mũi tên Xanh lá ra Điểm Tập Kết (NA3)!`, "success");
            gsapFlyCamera(0, 500, -100, 0, 0, -200); // Bay camera để nhìn toàn cảnh lối thoát
        }

        window.reportIncident = async function(type) {
            if(currentPos.x === null) return window.showToast("Cảnh báo: Phải ghim vị trí trước khi báo sự cố!", "error");
            
            try {
                // Ghi lên Firebase (Máy chủ EHS)
                await addDoc(collection(db, "ehs_incidents"), {
                    type: type, zone: currentPos.zone, reporter: currentUser,
                    x: currentPos.x, z: currentPos.z, time: new Date().toISOString(), status: 'Active'
                });
                window.showToast(`Đã phát lệnh báo động [${type}] toàn nhà máy!`, "success");
            } catch(firebaseErr) {
                console.warn("Lỗi máy chủ: Vẽ cảnh báo Cục bộ.");
                drawOfflineAlarm(currentPos.x, currentPos.z, type);
                window.showToast(`Lỗi mạng. Báo động [${type}] cục bộ!`, "error");
            }
        }

        function drawOfflineAlarm(x, z, type) {
            let markerColor = type === 'Cháy Nổ' ? 0xff0000 : (type === 'Hóa Chất' ? 0xa855f7 : 0x3b82f6);
            const beamGeo = new THREE.CylinderGeometry(10, 30, 400, 16);
            const beamMat = new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(x, 200, z);
            beam.userData.clock = Math.random() * 100;
            scene.add(beam); alarmMarkers.push(beam);

            document.getElementById('alarm-panel').classList.remove('hidden');
            document.getElementById('alarm-list').innerHTML = `<div class="bg-slate-800/80 border border-red-500 p-2 rounded-xl shadow-md"><h4 class="font-black text-[10px] text-red-400 animate-pulse"><i class="ph-bold ph-warning"></i> ${type.toUpperCase()} (LOCAL)</h4><p class="text-[10px] text-white font-bold"><i class="ph-fill ph-map-pin"></i> ${currentPos.zone}</p></div>`;
            const sound = document.getElementById('alarm-sound');
            if(sound.paused) sound.play().catch(e => console.log('Audio blocked'));
        }

        // Lắng nghe sự kiện báo cháy Realtime từ mọi người
        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, "ehs_incidents"), (snapshot) => {
                const panel = document.getElementById('alarm-panel');
                const list = document.getElementById('alarm-list');
                const sound = document.getElementById('alarm-sound');
                
                alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
                list.innerHTML = ''; let hasActiveAlarm = false;

                snapshot.forEach(doc => {
                    const data = doc.data(); if(data.status !== 'Active') return;
                    hasActiveAlarm = true;

                    let colorCls = data.type === 'Cháy Nổ' ? 'text-red-400 border-red-500' : (data.type === 'Hóa Chất' ? 'text-purple-400 border-purple-500' : 'text-blue-400 border-blue-500');
                    let timeStr = new Date(data.time).toLocaleTimeString('vi-VN');
                    
                    list.innerHTML += `
                        <div class="bg-slate-800/80 border ${colorCls} p-2 sm:p-3 rounded-xl shadow-md cursor-pointer hover:bg-slate-700 transition" onclick="window.focusIncident(${data.x}, ${data.z})">
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="font-black text-[10px] sm:text-xs ${colorCls.split(' ')[0]} animate-pulse"><i class="ph-bold ph-warning"></i> ${data.type.toUpperCase()}</h4>
                                <span class="text-[8px] sm:text-[10px] text-slate-400 font-mono">${timeStr}</span>
                            </div>
                            <p class="text-[10px] sm:text-xs text-white font-bold mb-1"><i class="ph-fill ph-map-pin"></i> ${data.zone}</p>
                        </div>
                    `;

                    let markerColor = data.type === 'Cháy Nổ' ? 0xff0000 : (data.type === 'Hóa Chất' ? 0xa855f7 : 0x3b82f6);
                    const beamGeo = new THREE.CylinderGeometry(10, 30, 400, 16);
                    const beamMat = new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
                    const beam = new THREE.Mesh(beamGeo, beamMat);
                    beam.position.set(data.x, 200, data.z);
                    beam.userData.clock = Math.random() * 100;
                    
                    scene.add(beam); alarmMarkers.push(beam);
                });

                if (hasActiveAlarm) {
                    panel.classList.remove('hidden'); document.body.classList.add('border-4', 'border-red-600');
                    if(sound.paused) sound.play().catch(e => console.log('Audio blocked'));
                } else {
                    panel.classList.add('hidden'); document.body.classList.remove('border-4', 'border-red-600');
                    sound.pause(); sound.currentTime = 0;
                }
            });
        }).catch(err => { console.warn("Lỗi Firebase Auth:", err); });

        window.clearAlarms = async function() {
            if(confirm("Xác nhận sự cố đã được kiểm soát. Tắt toàn bộ báo động trên hệ thống?")) {
                try {
                    const snap = await getDocs(collection(db, "ehs_incidents"));
                    snap.forEach(async (d) => {
                        if(d.data().status === 'Active') await deleteDoc(doc(db, "ehs_incidents", d.id));
                    });
                    
                    alarmMarkers.forEach(m => scene.remove(m)); alarmMarkers = [];
                    document.getElementById('alarm-panel').classList.add('hidden');
                    document.body.classList.remove('border-4', 'border-red-600');
                    document.getElementById('alarm-sound').pause();
                    window.showToast("Đã tắt còi báo động.");
                } catch(e) { window.showToast("Lỗi xóa: " + e.message, "error"); }
            }
        }

        window.focusIncident = function(x, z) { gsapFlyCamera(x, 300, z + 150, x, 0, z); }

        function gsapFlyCamera(tx, ty, tz, lx, ly, lz) {
            const startPos = camera.position.clone(); const targetPos = new THREE.Vector3(tx, ty, tz);
            const startLook = controls.target.clone(); const targetLook = new THREE.Vector3(lx, ly, lz);
            let frame = 0; const maxFrames = 50;

            function anim() {
                frame++; let t = frame / maxFrames; t = t * (2 - t); 
                camera.position.lerpVectors(startPos, targetPos, t);
                controls.target.lerpVectors(startLook, targetLook, t);
                controls.update();
                if(frame < maxFrames) requestAnimationFrame(anim);
            }
            anim();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.005;
            
            // Animation chớp nháy của cột báo động
            alarmMarkers.forEach(m => { m.material.opacity = 0.4 + Math.sin(time + m.userData.clock) * 0.5; });

            // Mũi tên ánh sáng chạy rần rần trên hành lang thoát hiểm
            if (evacuationLine) { evacuationLine.material.dashOffset -= 0.5; }

            controls.update(); renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
</body>
