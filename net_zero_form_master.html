<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Net Zero - Tổng Hợp</title>
    <!-- Thư viện giao diện & Biểu đồ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Thư viện Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 p-6 font-sans">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h2 class="text-3xl font-bold text-blue-700">Trạm Kiểm Kê Khí Nhà Kính (GHG Inventory)</h2>
            <p class="text-slate-500 mt-1">Hệ sinh thái EHS - Asia Packaging Industries Vietnam</p>
        </div>

        <!-- Bố cục chia 2 cột -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- CỘT TRÁI: FORM NHẬP LIỆU (Chiếm 7 phần) -->
            <div class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h3 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Nhập Liệu Định Kỳ</h3>
                <form id="ghgForm" class="space-y-6">
                    
                    <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Kỳ báo cáo</label>
                            <input type="month" id="period" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Khu vực</label>
                            <select id="factory_zone" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="Line 1">Dây chuyền 1</option>
                                <option value="Line 2">Dây chuyền 2</option>
                                <option value="Line 3">Dây chuyền 3</option>
                                <option value="Toàn nhà máy">Toàn nhà máy</option>
                            </select>
                        </div>
                    </div>

                    <!-- Scope 1 -->
                    <div class="bg-red-50 p-4 rounded-xl border border-red-100">
                        <h4 class="font-bold text-red-700 mb-2">Scope 1 (Gas & Rò rỉ)</h4>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-xs">Washer LPG (kg)</label><input type="number" id="s1_washer" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-red-400"></div>
                            <div><label class="text-xs">Pinoven LPG (kg)</label><input type="number" id="s1_pinoven" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-red-400"></div>
                            <div><label class="text-xs">IBO LPG (kg)</label><input type="number" id="s1_ibo" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-red-400"></div>
                            <div><label class="text-xs">Boiler LPG (kg)</label><input type="number" id="s1_boiler" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-red-400"></div>
                            <div><label class="text-xs">Gas R410A (kg)</label><input type="number" id="s1_r410a" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-red-400"></div>
                            <div><label class="text-xs">Gas R32 (kg)</label><input type="number" id="s1_r32" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-red-400"></div>
                        </div>
                    </div>

                    <!-- Scope 2 & 3 -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                            <h4 class="font-bold text-yellow-700 mb-2">Scope 2</h4>
                            <label class="text-xs">Điện tiêu thụ (kWh)</label>
                            <input type="number" id="scope2_elec" required class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-yellow-400">
                        </div>
                        <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                            <h4 class="font-bold text-green-700 mb-2">Scope 3</h4>
                            <label class="text-xs">Nước cấp (m3)</label>
                            <input type="number" id="scope3_water" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-green-400 mb-2">
                            <label class="text-xs">Rác thải (kg)</label>
                            <input type="number" id="scope3_waste" class="w-full px-2 py-1 border rounded focus:ring-1 focus:ring-green-400">
                        </div>
                    </div>

                    <div class="text-right pt-2">
                        <button type="button" onclick="submitData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow">
                            Lưu & Tính Toán
                        </button>
                    </div>
                </form>
            </div>

            <!-- CỘT PHẢI: BẢNG ĐIỀU KHIỂN BIỂU ĐỒ (Chiếm 5 phần) -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <!-- Status Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-bold text-slate-800">Trạng Thái Kết Nối AI</h3>
                        <p class="text-sm text-slate-500">Đồng bộ Google Colab & Firestore</p>
                    </div>
                    <div class="flex items-center">
                        <span class="relative flex h-3 w-3 mr-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                        </span>
                        <span class="text-green-600 font-bold text-sm">Online</span>
                    </div>
                </div>

                <!-- Chart Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex-grow">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Biểu Đồ Phát Thải KNK</h3>
                    <div class="relative h-72">
                        <canvas id="ghgChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- LOGIC XỬ LÝ DỮ LIỆU & BIỂU ĐỒ -->
    <script>
        // 1. Cấu hình Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyC7iFVmgoUL-sW3UlaMV0rlNQYugFiw2uA",
          authDomain: "ehs-training-app.firebaseapp.com",
          projectId: "ehs-training-app",
          storageBucket: "ehs-training-app.firebasestorage.app",
          messagingSenderId: "354083430003",
          appId: "1:354083430003:web:059953b7b9c1a9470a5406",
          measurementId: "G-74ETHWTJCW"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Khởi tạo Biểu đồ Chart.js
        const ctx = document.getElementById('ghgChart').getContext('2d');
        const ghgChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [
                    { label: 'Scope 1 (Gas) - kgCO2', backgroundColor: '#ef4444', data: [] },
                    { label: 'Scope 2 (Điện) - kgCO2', backgroundColor: '#eab308', data: [] }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, title: { display: true, text: 'Tổng kgCO2' } }
                }
            }
        });

        // 3. Lắng nghe dữ liệu thời gian thực (Cập nhật biểu đồ tự động)
        db.collection("ghg_results").orderBy("period", "asc").onSnapshot((snapshot) => {
            const labels = [];
            const scope1 = [];
            const scope2 = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                labels.push(data.period);
                scope1.push(data.scope1_co2_kg);
                scope2.push(data.scope2_co2_kg);
            });

            ghgChart.data.labels = labels;
            ghgChart.data.datasets[0].data = scope1;
            ghgChart.data.datasets[1].data = scope2;
            ghgChart.update();
        });

        // 4. Hàm đẩy dữ liệu lên Firestore
        async function submitData() {
            const ghgData = {
                period: document.getElementById('period').value,
                factory_zone: document.getElementById('factory_zone').value,
                
                s1_washer_lpg: Number(document.getElementById('s1_washer').value) || 0,
                s1_pinoven_lpg: Number(document.getElementById('s1_pinoven').value) || 0,
                s1_ibo_lpg: Number(document.getElementById('s1_ibo').value) || 0,
                s1_boiler_lpg: Number(document.getElementById('s1_boiler').value) || 0,
                
                s1_r410a: Number(document.getElementById('s1_r410a').value) || 0,
                s1_r22: Number(document.getElementById('s1_r22').value) || 0,
                s1_r32: Number(document.getElementById('s1_r32').value) || 0,
                
                scope2_elec: Number(document.getElementById('scope2_elec').value) || 0,
                scope3_water: Number(document.getElementById('scope3_water').value) || 0,
                scope3_waste: Number(document.getElementById('scope3_waste').value) || 0,
                
                status: "pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (!ghgData.period || ghgData.scope2_elec === 0) {
                alert("Vui lòng nhập Kỳ báo cáo và Số Điện tiêu thụ!");
                return;
            }

            try {
                await db.collection("ghg_raw_inputs").add(ghgData);
                document.getElementById('ghgForm').reset();
                alert("Đã lưu số liệu thành công! Colab đang xử lý...");
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Lỗi kết nối mạng!");
            }
        }
    </script>
</body>
</html>
