<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800 flex flex-col items-center relative">

    <!-- CÔNG TẮC ĐA NGÔN NGỮ -->
    <div class="absolute top-4 right-4 sm:top-8 sm:right-8 z-[60]">
        <div class="relative group">
            <button class="flex items-center gap-1.5 text-sm font-bold text-slate-600 bg-white px-3 py-2 rounded-xl hover:bg-slate-50 transition border border-slate-200 shadow-sm">
                <i class="ph-bold ph-translate"></i> <span id="current-lang-display">Tiếng Việt</span> <i class="ph-bold ph-caret-down text-xs"></i>
            </button>
            <div class="absolute right-0 mt-1 w-36 bg-white border border-slate-200 rounded-xl shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 overflow-hidden">
                <button onclick="changeLanguage('vi')" class="w-full text-left px-4 py-2.5 text-sm font-semibold hover:bg-slate-50 text-slate-700">Tiếng Việt</button>
                <button onclick="changeLanguage('en')" class="w-full text-left px-4 py-2.5 text-sm font-semibold hover:bg-slate-50 text-slate-700 border-t border-slate-100">English</button>

            </div>
        </div>
    </div>

    <!-- TOAST & MODAL -->
    <div id="toast" class="fixed top-5 right-5 z-[100] transform transition-all duration-300 translate-x-[150%] flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-white">
        <i id="toast-icon" class="text-2xl"></i>
        <span id="toast-message"></span>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden text-center p-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 text-red-600 mb-4">
                <i class="ph-fill ph-warning text-4xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2" data-i18n="confirm_del_title">Xác nhận xóa</h3>
            <p class="text-slate-500 text-sm mb-6" id="confirm-message" data-i18n="confirm_del_desc">Bạn có chắc chắn muốn xóa?</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirmModal()" class="px-6 py-2.5 rounded-lg font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition w-1/2" data-i18n="btn_cancel">Hủy</button>
                <button id="btn-confirm-yes" class="bg-red-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-red-700 shadow-md w-1/2" data-i18n="btn_del">Xóa</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="w-full max-w-md mt-16 bg-white p-8 rounded-2xl shadow-xl border border-slate-200 relative">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                <i class="ph-fill ph-hard-hat text-4xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800" data-i18n="login_title">Khai Báo Nhà Thầu</h2>
            <p class="text-slate-500 text-sm mt-1 font-medium" id="form-subtitle" data-i18n="login_subtitle">Đăng nhập bằng Số điện thoại của bạn</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="lbl_phone">Số điện thoại</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph-bold ph-phone text-slate-400 text-lg"></i></div>
                    <input type="text" id="nt-phone" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-medium" placeholder="VD: 0909123456" data-i18n-placeholder="plc_phone">
                </div>
            </div>

            <div id="company-field" class="hidden">
                <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="lbl_company">Tên Công Ty Nhà Thầu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph-bold ph-buildings text-slate-400 text-lg"></i></div>
                    <input type="text" id="nt-company" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-700" placeholder="VD: Công ty TNHH Xây Dựng ABC" data-i18n-placeholder="plc_company">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="lbl_pass">Mật khẩu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph-bold ph-lock-key text-slate-400 text-lg"></i></div>
                    <input type="password" id="nt-pass" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none tracking-widest" placeholder="••••••••">
                </div>
            </div>

            <button id="btn-login" onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl mt-2 hover:bg-blue-700 transition shadow-md" data-i18n="btn_login">Đăng nhập</button>
        </div>

        <div class="mt-6 text-center text-sm font-medium text-slate-600 border-t border-slate-100 pt-5">
            <span id="toggle-text" data-i18n="msg_new_contractor">Nhà thầu mới?</span> 
            <button onclick="toggleMode()" id="btn-toggle" class="text-blue-600 font-bold hover:text-blue-800 ml-1 transition" data-i18n="btn_register">Đăng ký tài khoản</button>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH (QUẢN LÝ HỒ SƠ) -->
    <div id="main-content" class="w-full max-w-7xl bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 hidden mt-4">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
            <div>
                <h2 class="text-2xl font-black text-slate-800 flex items-center">
                    <i class="ph-fill ph-folder-notch-plus text-blue-600 text-3xl mr-3"></i>
                    <span data-i18n="main_title">Hồ Sơ Nhân Sự Nhà Thầu</span>
                </h2>
                <p class="text-slate-500 mt-1 font-medium"><span data-i18n="main_subtitle">Đơn vị khai báo:</span> <span id="display-company" class="font-bold text-blue-700"></span></p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="handleLogout()" class="bg-slate-100 text-slate-600 px-4 py-2.5 rounded-xl font-bold hover:bg-slate-200 transition flex items-center justify-center gap-2 border border-slate-200 flex-1 md:flex-none">
                    <i class="ph-bold ph-sign-out"></i> <span data-i18n="btn_logout">Đăng xuất</span>
                </button>
                <button onclick="openModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-blue-700 transition flex items-center justify-center gap-2 shadow-md flex-1 md:flex-none">
                    <i class="ph-bold ph-user-plus text-lg"></i> <span data-i18n="btn_add_worker">Khai báo nhân sự</span>
                </button>
            </div>
        </div>

        <div id="loading-msg" class="text-center py-10 text-blue-600 font-bold hidden">
            <i class="ph-bold ph-spinner animate-spin text-4xl mb-3"></i>
            <p data-i18n="msg_loading">Đang đồng bộ dữ liệu hồ sơ...</p>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-sm custom-scrollbar" id="table-container">
            <table class="w-full text-left border-collapse min-w-[1100px]">
                <thead>
                    <tr class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                        <th class="p-4 font-bold w-12 text-center">STT</th>
                        <th class="p-4 font-bold" data-i18n="col_name">Họ và Tên</th>
                        <th class="p-4 font-bold" data-i18n="col_dob">Ngày Sinh</th>
                        <th class="p-4 font-bold" data-i18n="col_id">Số CCCD</th>
                        <th class="p-4 font-bold text-center" data-i18n="col_group">An Toàn LĐ</th>
                        <th class="p-4 font-bold text-center" data-i18n="col_insurance">Bảo hiểm TN</th>
                        <th class="p-4 font-bold text-center" data-i18n="col_health">Khám Sức Khỏe</th>
                        <th class="p-4 font-bold text-center" data-i18n="col_action">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="worker-results" class="text-sm divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL KHAI BÁO NHÂN SỰ -->

                <h3 class="text-lg font-black text-slate-800 flex items-center gap-2" id="modal-title">Khai báo Nhân sự</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 transition bg-white p-1 rounded-lg border border-slate-200 shadow-sm"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scrollbar space-y-5">
                <input type="hidden" id="wk-doc-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="col_name">Họ và Tên <span class="text-red-500">*</span></label>
                        <input type="text" id="wk-ho-ten" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-slate-700 bg-slate-50 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="col_id">Số CCCD <span class="text-red-500">*</span></label>
                        <input type="text" id="wk-cccd" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-slate-700 bg-slate-50 focus:bg-white transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="col_dob">Ngày Sinh</label>
                        <input type="date" id="wk-ngay-sinh" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="col_group">Đào tạo ATLĐ</label>
                        <select id="wk-nhom-atld" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-white font-bold text-slate-700">
                            <option value="Chưa đào tạo" data-i18n="opt_none">-- Chưa đào tạo --</option>
                            <option value="Nhóm 1">Nhóm 1 (Quản lý)</option>
                            <option value="Nhóm 2">Nhóm 2 (CB An toàn)</option>
                            <option value="Nhóm 3">Nhóm 3 (Nghiêm ngặt)</option>
                            <option value="Nhóm 4">Nhóm 4 (LĐ chung)</option>
                            <option value="Nhóm 5">Nhóm 5 (Y tế)</option>
                            <option value="Nhóm 6">Nhóm 6 (ATVSV)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="lbl_exp_atld">Hết Hạn Thẻ ATLĐ</label>
                        <input type="date" id="wk-han-atld" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="lbl_exp_insure">Hết Hạn Bảo Hiểm TN</label>
                        <input type="date" id="wk-han-bao-hiem" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="lbl_exp_health">Hết Hạn Khám Sức Khỏe</label>
                        <input type="date" id="wk-han-suc-khoe" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white font-medium">
                    </div>
                </div>
            </div>
            
            <div class="p-5 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                <button onclick="closeModal()" class="px-6 py-2.5 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition" data-i18n="btn_cancel">Hủy</button>
                <button id="btn-save" onclick="saveWorker()" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold hover:bg-blue-700 shadow-md flex items-center gap-2 transition"><i class="ph-bold ph-floppy-disk text-lg"></i> <span data-i18n="btn_save_profile">Lưu Hồ Sơ</span></button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC TRUNG TÂM -->
    <script>
        // 1. TỪ ĐIỂN ĐA NGÔN NGỮ
        const translations = {
            "vi": {

                btn_cancel: "Hủy", btn_save_profile: "Lưu Hồ Sơ", btn_del: "Xóa", confirm_del_title: "Xác nhận xóa", confirm_del_desc: "Bạn có chắc chắn muốn xóa?",
                status_valid: "Hợp lệ", status_expired: "Hết hạn", status_none: "Chưa có", msg_empty: "Bạn chưa khai báo nhân sự nào. Bấm 'Khai báo nhân sự' để bắt đầu."
            },
            "en": {
                login_title: "Contractor Portal", login_subtitle: "Login with your Phone number",
                lbl_phone: "Phone Number", plc_phone: "Ex: 0909123456",
                lbl_company: "Contractor Company Name", plc_company: "Ex: ABC Construction Co.",
                lbl_pass: "Password", btn_login: "Login", btn_register: "Register Account",
                msg_new_contractor: "New contractor?", msg_has_account: "Already have an account?", btn_login_now: "Login now",
                login_subtitle_reg: "Create an account for your Company",
                main_title: "Contractor Personnel Profiles", main_subtitle: "Declaring Unit:",
                btn_logout: "Logout", btn_add_worker: "Declare Personnel", msg_loading: "Syncing profile data...",
                col_name: "Full Name", col_dob: "Date of Birth", col_id: "ID Number", col_group: "Safety Training",

        };

        let currentLang = localStorage.getItem('ehs_lang') || 'vi';

        window.changeLanguage = function(lang) {
            currentLang = lang;
            localStorage.setItem('ehs_lang', lang);
            const langNames = { 'vi': 'Tiếng Việt', 'en': 'English', 'zh': '中文' };
            document.getElementById('current-lang-display').innerText = langNames[lang];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key]; 
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
            
            // Render lại dữ liệu bảng nếu đang hiển thị để cập nhật chữ Hợp lệ/Hết hạn
            if(myCompany && myPhone) loadData(); 
        };

            changeLanguage(currentLang);

            inputs.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') window.handleLogin();
                    });
                }
            });
        });

        // 3. UI HELPERS (TOAST, MODAL)
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            toast.className = "fixed top-5 right-5 z-[200] transform transition-all duration-300 flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-white";
            
            if (type === "success") {
                toast.classList.add('bg-emerald-600');
                icon.className = "ph-fill ph-check-circle text-2xl";
            } else {
                toast.classList.add('bg-red-600');
                icon.className = "ph-fill ph-warning-circle text-2xl";
            }
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-x-[150%]');
            setTimeout(() => { toast.classList.add('translate-x-[150%]'); }, 3000);
        }

        let deleteActionCallback = null;
        window.confirmDelete = function(id, name) {
            const langObj = translations[currentLang];
            document.getElementById('confirm-message').innerHTML = `${langObj.confirm_del_desc} <b>${name}</b>`;
            document.getElementById('confirm-modal').classList.remove('hidden');
            deleteActionCallback = async function() {
                try {
                    document.getElementById('btn-confirm-yes').innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>';
                    await window.deleteDoc(window.doc(window.db, "nha_thau_nhan_su", id));
                    showToast(currentLang === 'vi' ? "Đã xóa nhân sự thành công!" : "Deleted successfully!");
                    closeConfirmModal();
                    loadData();
                } catch (error) {
                    showToast("Lỗi: " + error.message, "error");
                }
            };
            document.getElementById('btn-confirm-yes').onclick = deleteActionCallback;
        }

        window.closeConfirmModal = function() {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('btn-confirm-yes').innerText = translations[currentLang].btn_del;
        }

        // 4. LOGIC ĐĂNG NHẬP (PHONE & PASSWORD)
        let isLoginMode = true;
        let myCompany = localStorage.getItem("nt_company_name") || "";
        let myPhone = localStorage.getItem("nt_phone") || "";

        window.toggleMode = function() {
            isLoginMode = !isLoginMode;
            const langObj = translations[currentLang];
            
            if (isLoginMode) {
                document.getElementById('company-field').classList.add('hidden');
                document.getElementById('btn-login').innerText = langObj.btn_login;
                document.getElementById('toggle-text').innerText = langObj.msg_new_contractor;
                document.getElementById('btn-toggle').innerText = langObj.btn_register;
                document.getElementById('form-subtitle').innerText = langObj.login_subtitle;
            } else {
                document.getElementById('company-field').classList.remove('hidden');
                document.getElementById('btn-login').innerText = langObj.btn_register;
                document.getElementById('toggle-text').innerText = langObj.msg_has_account;
                document.getElementById('btn-toggle').innerText = langObj.btn_login_now;
                document.getElementById('form-subtitle').innerText = langObj.login_subtitle_reg;
            }
        }

        function checkAuth() {
            if (myCompany && myPhone) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('display-company').innerText = myCompany;
                loadData();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        }

        window.handleLogin = async function() {
            const phone = document.getElementById('nt-phone').value.trim();
            const pass = document.getElementById('nt-pass').value.trim();
            const company = document.getElementById('nt-company').value.trim();

            if (!phone || !pass) return showToast(currentLang === 'vi' ? "Vui lòng nhập đủ SĐT và Mật khẩu!" : "Please enter Phone and Password!", "error");
            if (!isLoginMode && !company) return showToast(currentLang === 'vi' ? "Vui lòng nhập Tên Công Ty!" : "Please enter Company name!", "error");

            const btn = document.getElementById('btn-login');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>...';

            try {
                if (!isLoginMode) {
                    const q = window.query(window.collection(window.db, "nha_thau_account"), window.where("phone", "==", phone));
                    const snap = await window.getDocs(q);
                    if (!snap.empty) {
                        showToast(currentLang === 'vi' ? "Số điện thoại đã tồn tại!" : "Phone number already registered!", "error");
                        btn.disabled = false; btn.innerText = originalText; return;
                    }
                    await window.addDoc(window.collection(window.db, "nha_thau_account"), {
                        phone: phone, password: pass, company: company, created_at: new Date()
                    });
                    localStorage.setItem("nt_phone", phone);
                    localStorage.setItem("nt_company_name", company);
                    showToast(currentLang === 'vi' ? "Đăng ký thành công!" : "Registered successfully!");
                } else {
                    const q = window.query(window.collection(window.db, "nha_thau_account"), window.where("phone", "==", phone), window.where("password", "==", pass));
                    const snap = await window.getDocs(q);
                    if (snap.empty) {
                        showToast(currentLang === 'vi' ? "Sai SĐT hoặc Mật khẩu!" : "Invalid Phone or Password!", "error");
                        btn.disabled = false; btn.innerText = originalText; return;
                    }
                    let compName = "";
                    snap.forEach(doc => { compName = doc.data().company; });
                    
                    localStorage.setItem("nt_phone", phone);
                    localStorage.setItem("nt_company_name", compName);
                    showToast(currentLang === 'vi' ? "Đăng nhập thành công!" : "Logged in successfully!");
                }
                
                myCompany = localStorage.getItem("nt_company_name");
                myPhone = localStorage.getItem("nt_phone");
                checkAuth();

            } catch (error) {
                showToast("Error: " + error.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        window.handleLogout = function() {
            localStorage.removeItem("nt_phone");
            localStorage.removeItem("nt_company_name");
            myCompany = ""; myPhone = "";
            document.getElementById('nt-pass').value = '';
            checkAuth();
        }

        // 5. LOGIC DỮ LIỆU & BẢNG
        function formatDateAndStatus(dateString) {
            const langObj = translations[currentLang];
            if (!dateString) return { html: `<span class="bg-slate-100 text-slate-500 px-2 py-1 rounded text-[11px] font-bold">${langObj.status_none}</span>` };
            
            const expDate = new Date(dateString);
            const today = new Date(); today.setHours(0,0,0,0);
            const formatted = expDate.toLocaleDateString('vi-VN');
            
            if (expDate < today) {
                return { html: `<span class="bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded text-[11px] font-bold">${langObj.status_expired} (${formatted})</span>` };
            } else {
                return { html: `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded text-[11px] font-bold">${langObj.status_valid} (${formatted})</span>` };
            }
        }

        function formatSimpleDate(dateString) {
            return !dateString ? "N/A" : new Date(dateString).toLocaleDateString('vi-VN');
        }

        async function loadData() {
            const tbody = document.getElementById('worker-results');
            const loading = document.getElementById('loading-msg');
            const container = document.getElementById('table-container');
            const langObj = translations[currentLang];
            
            tbody.innerHTML = '';
            container.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const q = window.query(window.collection(window.db, "nha_thau_nhan_su"), window.where("cong_ty", "==", myCompany));
                const querySnapshot = await window.getDocs(q);
                let stt = 1;
                
                let allData = [];
                querySnapshot.forEach((doc) => { allData.push({ id: doc.id, ...doc.data() }); });
                allData.sort((a, b) => b.thoi_gian_tao - a.thoi_gian_tao);

                if(allData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-500 font-medium">${langObj.msg_empty}</td></tr>`;
                }

                allData.forEach((data) => {
                    const bhStatus = formatDateAndStatus(data.han_bao_hiem);
                    const skStatus = formatDateAndStatus(data.han_suc_khoe);
                    const atldStatus = formatDateAndStatus(data.han_atld);
                    let atldClass = data.nhom_atld === "Chưa đào tạo" ? "bg-red-50 text-red-600 border-red-100" : "bg-blue-50 text-blue-700 border-blue-100";
                    let displayNhom = data.nhom_atld === "Chưa đào tạo" ? langObj.opt_none : data.nhom_atld;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors";
                    tr.innerHTML = `
                        <td class="p-4 text-center font-medium text-slate-500">${stt++}</td>
                        <td class="p-4 font-bold text-slate-800">${data.ho_ten}</td>
                        <td class="p-4 text-slate-600">${formatSimpleDate(data.ngay_sinh)}</td>
                        <td class="p-4 text-slate-600 font-mono text-sm">${data.cccd}</td>
                        <td class="p-4 text-center">
                            <div class="mb-1"><span class="px-2 py-1 border rounded text-[11px] font-bold whitespace-nowrap ${atldClass}">${displayNhom}</span></div>
                            ${atldStatus.html}
                        </td>
                        <td class="p-4 text-center">${bhStatus.html}</td>
                        <td class="p-4 text-center">${skStatus.html}</td>
                        <td class="p-4 text-center whitespace-nowrap">
                            <button onclick="editWorker('${data.id}', '${data.ho_ten}', '${data.ngay_sinh || ''}', '${data.cccd}', '${data.nhom_atld}', '${data.han_atld || ''}', '${data.han_bao_hiem || ''}', '${data.han_suc_khoe || ''}')" class="text-blue-600 hover:text-blue-800 p-1 mx-1 bg-blue-50 rounded-lg shadow-sm border border-blue-100"><i class="ph-bold ph-pencil-simple text-lg"></i></button>
                            <button onclick="confirmDelete('${data.id}', '${data.ho_ten}')" class="text-red-500 hover:text-red-700 p-1 mx-1 bg-red-50 rounded-lg shadow-sm border border-red-100"><i class="ph-bold ph-trash text-lg"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-500 font-medium">Error: ${error.message}</td></tr>`;
            } finally {
                loading.classList.add('hidden');
                container.classList.remove('hidden');
            }
        }

        window.openModal = function() {
            const langObj = translations[currentLang];
            document.getElementById('modal-title').innerHTML = `<i class="ph-fill ph-user-plus text-blue-600 text-2xl"></i> ${langObj.btn_add_worker}`;
            document.getElementById('wk-doc-id').value = '';
            document.getElementById('wk-ho-ten').value = '';
            document.getElementById('wk-ngay-sinh').value = '';
            document.getElementById('wk-cccd').value = '';
            document.getElementById('wk-nhom-atld').value = 'Chưa đào tạo';
            document.getElementById('wk-han-atld').value = '';
            document.getElementById('wk-han-bao-hiem').value = '';
            document.getElementById('wk-han-suc-khoe').value = '';
            document.getElementById('worker-modal').classList.remove('hidden');
        }

        window.editWorker = function(id, hoTen, ngaySinh, cccd, nhom, hanATLD, hanBH, hanSK) {
            document.getElementById('modal-title').innerHTML = `<i class="ph-fill ph-pencil-simple text-amber-600 text-2xl"></i> Update Profile`;
            document.getElementById('wk-doc-id').value = id;
            document.getElementById('wk-ho-ten').value = hoTen;
            document.getElementById('wk-ngay-sinh').value = ngaySinh;
            document.getElementById('wk-cccd').value = cccd;
            document.getElementById('wk-nhom-atld').value = nhom;
            document.getElementById('wk-han-atld').value = hanATLD;
            document.getElementById('wk-han-bao-hiem').value = hanBH;
            document.getElementById('wk-han-suc-khoe').value = hanSK;
            document.getElementById('worker-modal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('worker-modal').classList.add('hidden');
        }

        window.saveWorker = async function() {
            const id = document.getElementById('wk-doc-id').value;
            const data = {
                cong_ty: myCompany, 
                ho_ten: document.getElementById('wk-ho-ten').value.trim(),
                ngay_sinh: document.getElementById('wk-ngay-sinh').value,
                cccd: document.getElementById('wk-cccd').value.trim(),
                nhom_atld: document.getElementById('wk-nhom-atld').value,
                han_atld: document.getElementById('wk-han-atld').value,
                han_bao_hiem: document.getElementById('wk-han-bao-hiem').value,
                han_suc_khoe: document.getElementById('wk-han-suc-khoe').value,
                thoi_gian_cap_nhat: new Date()
            };
            
            if (!data.ho_ten || !data.cccd) return showToast("Vui lòng nhập Họ tên và CCCD!", "error");

            const btn = document.getElementById('btn-save');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i>';

            try {
                if (id) {
                    await window.updateDoc(window.doc(window.db, "nha_thau_nhan_su", id), data);
                    showToast(currentLang === 'vi' ? "Cập nhật hồ sơ thành công!" : "Profile updated!");
                } else {
                    data.thoi_gian_tao = new Date();
                    await window.addDoc(window.collection(window.db, "nha_thau_nhan_su"), data);
                    showToast(currentLang === 'vi' ? "Khai báo nhân sự mới thành công!" : "Personnel declared successfully!");
                }
                closeModal();
                loadData();
            } catch (error) {
                showToast("Lỗi: " + error.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        checkAuth();
    </script>
</body>
</html>
