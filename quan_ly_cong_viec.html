<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Công Việc & Tiến Độ EHS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', muted: '#94a3b8' } }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-800 dark:text-slate-200 h-screen flex flex-col transition-colors duration-300 overflow-hidden">

    <div id="toast" class="fixed top-5 right-5 z-[100] transform transition-all duration-300 translate-x-[150%] flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-white">
        <i id="toast-icon" class="text-2xl"></i>
        <span id="toast-message">Thành công!</span>
    </div>

    <!-- HEADER -->
    <header class="h-16 bg-white dark:bg-dark-card border-b border-slate-200 dark:border-dark-border flex items-center justify-between px-4 sm:px-8 shrink-0 z-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-10 h-10 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full flex items-center justify-center transition">
                <i class="ph-bold ph-arrow-left text-lg"></i>
            </a>
            <div>
                <h1 class="font-black text-xl leading-tight text-blue-700 dark:text-blue-400 flex items-center gap-2">
                    <i class="ph-fill ph-kanban"></i> <span>Quản Lý Tiến Độ</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-sm font-bold bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg hidden sm:block" id="header-user-name">Đang tải...</div>
            <button onclick="window.toggleDarkMode()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i id="theme-icon" class="ph-bold ph-moon"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 relative">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <!-- TÌM KIẾM & BỘ LỌC -->
            <div class="bg-white dark:bg-dark-card p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2 relative">
                    <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-box" onkeyup="window.renderTasks()" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:border-blue-500 font-medium" placeholder="Tìm tên công việc, người nhận, người giao...">
                </div>
                <div>
                    <select id="filter-category" onchange="window.renderTasks()" class="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm font-bold outline-none focus:border-blue-500 text-slate-700 dark:text-slate-300 appearance-none">
                        <option value="all">Tất cả mảng công việc</option>
                        <option value="EHS Chung">Mảng EHS Chung</option>
                        <option value="PCCC">Mảng PCCC</option>
                        <option value="ATVSV">Mạng lưới ATVSV</option>
                        <option value="Khác">Mảng Khác</option>
                    </select>
                </div>
                <div>
                    <button onclick="window.openTaskModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2">
                        <i class="ph-bold ph-plus"></i> Tạo Công Việc
                    </button>
                </div>
            </div>

            <!-- TAB ĐIỀU HƯỚNG TỰ THEO DÕI TIẾN ĐỘ -->
            <div class="flex flex-wrap bg-slate-200 dark:bg-slate-800 p-1 rounded-xl w-fit">
                <button onclick="window.switchTab('my-tasks')" id="tab-my-tasks" class="px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-600 shadow text-blue-700 dark:text-white transition">Việc tôi phải làm</button>
                <button onclick="window.switchTab('assigned-tasks')" id="tab-assigned" class="px-6 py-2 rounded-lg font-bold text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition">Việc tôi đã giao</button>
                <button onclick="window.switchTab('all-tasks')" id="tab-all" class="px-6 py-2 rounded-lg font-bold text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition flex items-center gap-1"><i class="ph-fill ph-crown"></i> Góc Lãnh Đạo</button>
            </div>

            <div id="loader" class="flex flex-col items-center justify-center py-20 text-blue-500">
                <i class="ph-bold ph-spinner animate-spin text-4xl mb-4"></i>
                <p class="font-bold text-slate-500 dark:text-dark-muted" id="loader-text">Đang kết nối hệ thống và xác thực người dùng...</p>
            </div>

            <div id="task-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden">
                <!-- Thẻ công việc sẽ được JS vẽ vào đây -->
            </div>
            
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400 dark:text-slate-600">
                <i class="ph-fill ph-clipboard-text text-6xl mb-4 opacity-50"></i>
                <p class="font-bold text-lg">Chưa có công việc nào trong mục này.</p>
            </div>

        </div>
    </main>

    <!-- MODAL GIAO VIỆC & LẬP KẾ HOẠCH -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-dark-card rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-200 dark:border-dark-border flex justify-between items-center bg-slate-50 dark:bg-slate-800/50 rounded-t-2xl">
                <h2 class="text-lg font-black text-slate-800 dark:text-white flex items-center gap-2">
                    <i class="ph-fill ph-clipboard-text text-blue-600"></i> Lập Kế Hoạch & Giao Việc
                </h2>
                <button onclick="window.closeTaskModal()" class="text-slate-400 hover:text-red-500"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Tên công việc / Dự án</label>
                    <input type="text" id="task-title" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-xl px-4 py-3 font-bold text-slate-800 dark:text-white outline-none focus:border-blue-500" placeholder="VD: Lập danh sách hóa chất nhà máy 1">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Phân loại Mảng</label>
                        <select id="task-category" class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-xl px-3 py-3 font-semibold text-slate-700 dark:text-slate-300 outline-none focus:border-blue-500">
                            <option value="EHS Chung">EHS Chung</option>
                            <option value="PCCC">PCCC</option>
                            <option value="ATVSV">ATVSV</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>

                    <!-- DROPDOWN THÔNG MINH CHO NHÂN SỰ (MỚI) -->
                    <div class="sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Giao cho ai?</label>
                        <div class="relative" id="assignee-wrapper">
                            <input type="hidden" id="task-assignee" value="">
                            <button type="button" onclick="window.toggleDropdown()" id="assignee-display" class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-xl px-3 py-3 font-bold text-blue-700 dark:text-blue-400 outline-none flex justify-between items-center text-sm shadow-sm transition h-[46px]">
                                <span class="truncate">-- Đang tải... --</span>
                                <i class="ph-bold ph-caret-down shrink-0"></i>
                            </button>
                            <!-- Khung menu thả xuống -->
                            <div id="assignee-menu" class="absolute z-[100] w-full mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl hidden flex-col max-h-64 overflow-hidden">
                                <div class="p-2 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                    <input type="text" id="assignee-search" onkeyup="window.filterAssignee()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" placeholder="🔍 Tìm tên, mã NV, bộ phận...">
                                </div>
                                <ul id="assignee-list" class="overflow-y-auto custom-scrollbar p-1">
                                    <!-- JS sẽ nạp thẻ <li> vào đây -->
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Deadline (Hạn chót)</label>
                        <input type="date" id="task-deadline" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-xl px-3 py-3 font-bold text-slate-800 dark:text-white outline-none focus:border-red-500 text-sm h-[46px]">
                    </div>
                </div>

                <!-- AI ASSISTANT -->
                <div class="bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 p-4 rounded-xl relative">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-black text-indigo-700 dark:text-indigo-400 uppercase flex items-center gap-1">
                            <i class="ph-fill ph-robot"></i> Kế hoạch chi tiết (AI Hỗ trợ)
                        </label>
                        <button onclick="window.generateAIPlan()" id="btn-ai" class="bg-indigo-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-indigo-700 transition flex items-center gap-1">
                            <i class="ph-bold ph-magic-wand"></i> AI Phân tách việc
                        </button>
                    </div>
                    <textarea id="task-desc" class="w-full border border-indigo-200 dark:border-indigo-800/50 bg-white dark:bg-slate-900 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-300 outline-none focus:border-indigo-500 min-h-[120px] custom-scrollbar" placeholder="Tự nhập kế hoạch HOẶC gõ Tên công việc ở trên và bấm 'AI Phân tách việc' để xé nhỏ dự án thành các bước..."></textarea>
                </div>
            </div>

            <div class="p-5 border-t border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-slate-800/50 flex justify-end gap-3 rounded-b-2xl">
                <button onclick="window.closeTaskModal()" class="px-6 py-2.5 font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition">Hủy</button>
                <button id="btn-save-task" onclick="window.saveTask()" class="bg-blue-600 text-white px-8 py-2.5 font-bold rounded-xl shadow-md hover:bg-blue-700 transition flex items-center gap-2">
                    <i class="ph-bold ph-paper-plane-tilt text-lg"></i> Phát Hành Kế Hoạch
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CẬP NHẬT TIẾN ĐỘ -->
    <div id="update-modal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-dark-card rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="p-5 border-b border-slate-200 dark:border-dark-border flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h2 class="text-lg font-black text-slate-800 dark:text-white">Cập nhật Tiến độ</h2>
                <button onclick="window.closeUpdateModal()" class="text-slate-400 hover:text-red-500"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            
            <div class="p-6 space-y-5">
                <input type="hidden" id="up-task-id">
                
                <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                    <h3 id="disp-title" class="font-bold text-lg text-slate-800 dark:text-white mb-1">...</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400"><i class="ph-fill ph-calendar"></i> Deadline: <span id="disp-deadline" class="font-mono font-bold text-red-500">...</span></p>
                </div>

                <div id="progress-section">
                    <label class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase">Tự báo cáo Tiến độ hoàn thành (%)</span>
                        <span id="prog-val" class="font-black text-2xl text-blue-600">0%</span>
                    </label>
                    <input type="range" id="task-progress" min="0" max="100" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="document.getElementById('prog-val').innerText = this.value + '%'">
                </div>

                <div id="eval-section" class="hidden pt-4 border-t border-slate-200 dark:border-slate-700">
                    <label class="block text-xs font-bold text-emerald-600 uppercase mb-2">Góc Lãnh Đạo Đánh giá & Nghiệm thu</label>
                    <textarea id="task-eval" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-300 outline-none focus:border-emerald-500" placeholder="Nhận xét mức độ hoàn thành công việc của nhân sự..." rows="3"></textarea>
                    
                    <label class="flex items-center gap-2 mt-3 cursor-pointer p-3 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-xl">
                        <input type="checkbox" id="task-done" class="w-5 h-5 text-emerald-600 rounded">
                        <span class="font-bold text-emerald-700 dark:text-emerald-400 text-sm">Nghiệm thu Đóng việc (Hoàn thành 100%)</span>
                    </label>
                </div>
            </div>

            <div class="p-5 border-t border-slate-200 dark:border-dark-border flex justify-end gap-3 bg-slate-50 dark:bg-slate-800/50">
                <button id="btn-update-task" onclick="window.saveUpdate()" class="w-full bg-blue-600 text-white py-3 font-bold rounded-xl shadow-md hover:bg-blue-700 transition">Lưu Cập Nhật Tiến Độ</button>
            </div>
        </div>
    </div>

    <!-- TÍCH HỢP TOÀN BỘ LOGIC VÀO MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. ANH DÁN API KEY CỦA GEMINI VÀO ĐÂY (ĐỂ GỌI AI TRỰC TIẾP)
        // ==========================================
        const GEMINI_API_KEY = "AQ.Ab8RN6I44Xy7m4CgYwbbsFdBogjKGNqCkJGKGYjMz5VeGXtEFA";

        // ==========================================
        // 2. ANH DÁN API KEY CỦA FIREBASE VÀO ĐÂY (ĐỂ LƯU DỮ LIỆU)
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC7iFVmgoUL-sW3UlaMV0rlNQYugFiw2uA",
          authDomain: "ehs-training-app.firebaseapp.com",
          projectId: "ehs-training-app",
          storageBucket: "ehs-training-app.firebasestorage.app",
          messagingSenderId: "354083430003",
          appId: "1:354083430003:web:059953b7b9c1a9470a5406",
          measurementId: "G-74ETHWTJCW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // BIẾN TOÀN CỤC CỦA TRANG
        let isDarkMode = localStorage.getItem('ehs_theme') === 'dark';
        let currentUserId = localStorage.getItem("ehs_user_id");
        let currentUserName = localStorage.getItem("ehs_user_name") || "Nhân viên EHS";
        let currentTab = 'my-tasks'; 
        let rawTasksData = [];
        let upTaskId = "";
        let upTaskAssigner = "";

        // HÀM HIỂN THỊ THÔNG BÁO TOAST
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            toast.className = "fixed top-5 right-5 z-[100] transform transition-all duration-300 flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-white";
            
            if (type === "success") {
                toast.classList.add('bg-emerald-600');
                icon.className = "ph-fill ph-check-circle text-2xl";
            } else {
                toast.classList.add('bg-red-600');
                icon.className = "ph-fill ph-warning-circle text-2xl";
            }
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-x-[150%]');
            setTimeout(() => { toast.classList.add('translate-x-[150%]'); }, 3000);
        }

        // ==========================================
        // GẮN CÁC HÀM GIAO DIỆN VÀO WINDOW ĐỂ HTML GỌI ĐƯỢC
        // ==========================================
        
        window.toggleDarkMode = function() {
            isDarkMode = !isDarkMode; 
            localStorage.setItem('ehs_theme', isDarkMode ? 'dark' : 'light'); 
            applyTheme();
        };

        function applyTheme() {
            if (isDarkMode) { document.documentElement.classList.add('dark'); document.getElementById('theme-icon').className = "ph-fill ph-sun text-amber-400"; } 
            else { document.documentElement.classList.remove('dark'); document.getElementById('theme-icon').className = "ph-bold ph-moon text-slate-600"; }
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            const btnMy = document.getElementById('tab-my-tasks');
            const btnAssigned = document.getElementById('tab-assigned');
            const btnAll = document.getElementById('tab-all');
            
            const activeClass = "px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-600 shadow text-blue-700 dark:text-white transition";
            const inactiveClass = "px-6 py-2 rounded-lg font-bold text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition";
            
            btnMy.className = (tab === 'my-tasks') ? activeClass : inactiveClass;
            btnAssigned.className = (tab === 'assigned-tasks') ? activeClass : inactiveClass;
            btnAll.className = (tab === 'all-tasks') ? activeClass + " flex items-center gap-1" : inactiveClass + " flex items-center gap-1";
            
            window.renderTasks();
        };

        window.openTaskModal = function() { document.getElementById('task-modal').classList.remove('hidden'); };
        window.closeTaskModal = function() { document.getElementById('task-modal').classList.add('hidden'); };

        // CÁC HÀM XỬ LÝ DROPDOWN NHÂN SỰ
        window.toggleDropdown = function() {
            const menu = document.getElementById('assignee-menu');
            menu.classList.toggle('hidden');
            if(!menu.classList.contains('hidden')) {
                document.getElementById('assignee-search').focus();
            }
        };

        document.addEventListener('click', function(event) {
            const wrapper = document.getElementById('assignee-wrapper');
            const menu = document.getElementById('assignee-menu');
            if (wrapper && !wrapper.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        window.selectAssignee = function(id, name) {
            document.getElementById('task-assignee').value = id + '|' + name;
            document.getElementById('assignee-display').innerHTML = `<span class="truncate font-black">${name}</span> <i class="ph-bold ph-caret-down shrink-0"></i>`;
            document.getElementById('assignee-menu').classList.add('hidden');
        };

        window.filterAssignee = function() {
            const keyword = document.getElementById('assignee-search').value.toLowerCase();
            const items = document.querySelectorAll('.assignee-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(keyword)) item.style.display = 'block';
                else item.style.display = 'none';
            });
        };

        window.openUpdateModal = function(id, title, date, progress, status, assignerId) {
            upTaskId = id; upTaskAssigner = assignerId;
            document.getElementById('up-task-id').value = id;
            document.getElementById('disp-title').innerText = title;
            document.getElementById('disp-deadline').innerText = new Date(date).toLocaleDateString('vi-VN');
            
            const progInput = document.getElementById('task-progress');
            progInput.value = progress; 
            document.getElementById('prog-val').innerText = progress + '%';
            
            const isManager = (currentUserId === assignerId);
            const evalSec = document.getElementById('eval-section');
            const doneCheck = document.getElementById('task-done');
            
            if (isManager) {
                evalSec.classList.remove('hidden');
                doneCheck.checked = (status === 'Done');
            } else {
                evalSec.classList.add('hidden');
            }

            document.getElementById('update-modal').classList.remove('hidden');
            const btnUpdate = document.getElementById('btn-update-task');
            btnUpdate.innerHTML = 'Lưu Cập Nhật Tiến Độ';
            btnUpdate.disabled = false;
        };

        window.closeUpdateModal = function() { document.getElementById('update-modal').classList.add('hidden'); };

        // ==========================================
        // CÁC HÀM KẾT NỐI DATABASE VÀ XỬ LÝ LOGIC
        // ==========================================

        async function loadUsersDropdown() {
            const ul = document.getElementById('assignee-list');
            document.getElementById('assignee-display').innerHTML = `<span>-- Chọn nhân sự --</span> <i class="ph-bold ph-caret-down shrink-0"></i>`;
            try {
                const snap = await getDocs(collection(db, "nhan_su_noi_bo"));
                let html = `<li onclick="window.selectAssignee('${currentUserId}', '${currentUserName}')" class="assignee-item p-3 mb-1 hover:bg-blue-100 dark:hover:bg-blue-900/50 rounded-lg cursor-pointer transition font-black text-blue-700 dark:text-blue-400 bg-blue-50/50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800">🌟 [TỰ GIAO] Việc cá nhân của tôi</li>`;
                
                snap.forEach(doc => {
                    const data = doc.data();
                    if(data.ma_nv && data.ho_ten && data.ma_nv !== currentUserId) {
                        html += `<li onclick="window.selectAssignee('${data.ma_nv}', '${data.ho_ten.replace(/'/g, "\\'")}')" class="assignee-item p-2 mb-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg cursor-pointer transition text-sm">
                            <div class="font-bold text-slate-800 dark:text-slate-200">${data.ho_ten} (${data.ma_nv})</div>
                            <div class="text-[10px] text-slate-500 mt-0.5">${data.bo_phan || 'Chưa cập nhật bộ phận'}</div>
                        </li>`;
                    }
                });
                ul.innerHTML = html;
            } catch (e) {
                ul.innerHTML = '<li class="p-2 text-red-500 font-bold">Lỗi tải danh sách từ Firebase</li>';
                console.error("Lỗi dropdown: ", e);
            }
        }

        async function fetchAllTasks() {
            const grid = document.getElementById('task-grid');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');
            
            grid.classList.add('hidden'); empty.classList.add('hidden'); loader.classList.remove('hidden');

            try {
                const snap = await getDocs(collection(db, "ehs_tasks"));
                rawTasksData = [];
                snap.forEach(doc => rawTasksData.push({id: doc.id, ...doc.data()}));
                window.renderTasks();
            } catch (e) {
                console.error("Lỗi fetchAllTasks:", e);
                loader.innerHTML = `<div class="text-center text-red-500 font-bold"><i class="ph-bold ph-warning-circle text-4xl mb-2"></i><br>Lỗi máy chủ: Không thể đọc CSDL EHS_Tasks.<br>${e.message}</div>`;
            }
        }

        window.renderTasks = function() {
            const grid = document.getElementById('task-grid');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');
            
            grid.innerHTML = '';
            
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const filterCat = document.getElementById('filter-category').value;

            let filteredTasks = rawTasksData.filter(t => {
                let tabMatch = false;
                if (currentTab === 'my-tasks' && t.assignee_id === currentUserId) tabMatch = true;
                if (currentTab === 'assigned-tasks' && t.assigner_id === currentUserId) tabMatch = true;
                if (currentTab === 'all-tasks') tabMatch = true; 
                if (!tabMatch) return false;

                if (filterCat !== 'all' && t.category !== filterCat) return false;

                const textSearch = ((t.title||"") + " " + (t.assignee_name||"") + " " + (t.assigner_name||"")).toLowerCase();
                if (keyword && !textSearch.includes(keyword)) return false;

                return true;
            });

            // Sắp xếp Mới nhất lên đầu
            filteredTasks.sort((a,b) => {
                let timeA = a.created_at ? (a.created_at.toDate ? a.created_at.toDate().getTime() : a.created_at) : 0;
                let timeB = b.created_at ? (b.created_at.toDate ? b.created_at.toDate().getTime() : b.created_at) : 0;
                return timeB - timeA;
            });

            if(filteredTasks.length === 0) { 
                empty.classList.remove('hidden'); grid.classList.add('hidden'); loader.classList.add('hidden'); 
                return; 
            }

            filteredTasks.forEach(t => {
                const today = new Date(); today.setHours(0,0,0,0);
                const deadline = new Date(t.due_date);
                const isOverdue = deadline < today && t.status !== 'Done';
                
                let statusHtml = '';
                if (t.status === 'Done') statusHtml = `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-check-circle"></i> Hoàn thành</span>`;
                else if (isOverdue) statusHtml = `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-warning-circle"></i> Quá hạn</span>`;
                else if (t.status === 'Review') statusHtml = `<span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-eye"></i> Chờ nghiệm thu</span>`;
                else if (t.progress > 0) statusHtml = `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-spinner animate-spin"></i> Đang làm</span>`;
                else statusHtml = `<span class="bg-slate-200 text-slate-600 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-clock"></i> Mới giao</span>`;

                let catColor = "bg-slate-100 text-slate-600";
                if(t.category === 'PCCC') catColor = "bg-orange-100 text-orange-700 border-orange-200";
                if(t.category === 'ATVSV') catColor = "bg-teal-100 text-teal-700 border-teal-200";
                let catBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold border ${catColor} whitespace-nowrap">${t.category || 'Khác'}</span>`;

                const dateStr = deadline.toLocaleDateString('vi-VN');
                const parsedDesc = marked.parse(t.description || "");
                const isSelfAssigned = (t.assignee_id === t.assigner_id);

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-dark-card border ${isOverdue && t.status !== 'Done' ? 'border-red-300 shadow-[0_0_15px_rgba(239,68,68,0.15)]' : 'border-slate-200 dark:border-dark-border shadow-sm hover:shadow-md'} p-5 rounded-2xl flex flex-col transition-all`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex gap-2">${statusHtml} ${catBadge}</div>
                        <span class="text-xs font-mono font-bold ${isOverdue && t.status !== 'Done' ? 'text-red-600' : 'text-slate-500 dark:text-slate-400'}"><i class="ph-fill ph-calendar-blank"></i> ${dateStr}</span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-2 leading-tight">${t.title}</h3>
                    <div class="text-[13px] text-slate-500 dark:text-slate-400 mb-4 flex-1">
                        ${isSelfAssigned ? 
                            `<div class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 p-2 rounded-lg font-semibold inline-flex items-center gap-1 border border-indigo-100 dark:border-indigo-800"><i class="ph-fill ph-user-circle"></i> Công việc tự theo dõi</div>` :
                            `<div class="space-y-1"><p><i class="ph-fill ph-user-circle"></i> Nhận: <b class="text-slate-700 dark:text-slate-200">${t.assignee_name}</b></p>
                             <p><i class="ph-fill ph-user-focus"></i> Giao: <b class="text-slate-700 dark:text-slate-200">${t.assigner_name}</b></p></div>`
                        }
                    </div>
                    
                    <div class="mb-4 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800 text-[13px] text-slate-600 dark:text-slate-300 max-h-32 overflow-y-auto custom-scrollbar prose dark:prose-invert prose-sm">
                        ${parsedDesc}
                    </div>

                    <div class="mt-auto pt-4 border-t border-slate-100 dark:border-slate-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Tiến độ hoàn thành</span>
                            <span class="text-xs font-black text-blue-600 dark:text-blue-400">${t.progress}%</span>
                        </div>
                        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 mb-4 overflow-hidden">
                            <div class="bg-blue-600 dark:bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: ${t.progress}%"></div>
                        </div>
                        
                        <button onclick="window.openUpdateModal('${t.id}', '${t.title.replace(/'/g, "\\'")}', '${t.due_date}', ${t.progress}, '${t.status}', '${t.assigner_id}')" class="w-full bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-bold py-2.5 rounded-xl text-sm transition border-2 border-blue-100 dark:border-slate-700 flex justify-center items-center gap-2">
                            <i class="ph-bold ph-pencil-simple"></i> Cập Nhật Tiến Độ
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            loader.classList.add('hidden');
            empty.classList.add('hidden');
            grid.classList.remove('hidden');
        };

        window.generateAIPlan = async function() {
            const title = document.getElementById('task-title').value.trim();
            if(!title) return showToast("Vui lòng gõ Tên công việc trước khi gọi AI!", "error");
            
            if(!GEMINI_API_KEY || GEMINI_API_KEY.includes("DÁN_API_KEY")) {
                return showToast("Chưa cấu hình API Key cho AI. Vui lòng cập nhật code.", "error");
            }

            const btn = document.getElementById('btn-ai');
            const desc = document.getElementById('task-desc');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> AI đang phân tích...'; 
            btn.disabled = true;
            
            try {
                const prompt = `Tôi là quản lý EHS. Tôi muốn giao nhiệm vụ hoặc thực hiện kế hoạch: "${title}". Hãy xé nhỏ công việc này thành 3-5 bước thực hiện cốt lõi, ngắn gọn, dễ hiểu để nhân viên thực hiện theo thứ tự. Trình bày dưới dạng danh sách gạch đầu dòng (Markdown). Không nói lan man.`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.2 }
                };

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("Lỗi kết nối AI");
                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content) {
                    desc.value = result.candidates[0].content.parts[0].text;
                    showToast("AI đã lên xong kế hoạch!");
                } else {
                    desc.value = "AI đang bận. Bạn vui lòng tự gõ kế hoạch vào đây nhé.";
                }
            } catch (e) {
                console.error(e);
                showToast("Không thể kết nối AI lúc này. Vui lòng tự nhập.", "error");
            } finally {
                btn.innerHTML = ogText; btn.disabled = false;
            }
        };

        window.saveTask = async function() {
            const title = document.getElementById('task-title').value.trim();
            const assigneeRaw = document.getElementById('task-assignee').value;
            const deadline = document.getElementById('task-deadline').value;
            const desc = document.getElementById('task-desc').value.trim();
            const cat = document.getElementById('task-category').value;

            if(!title || !assigneeRaw || !deadline) return showToast("Vui lòng điền đủ Tên, Người nhận và Hạn chót!", "error");

            const [assignee_id, assignee_name] = assigneeRaw.split('|');
            const btn = document.getElementById('btn-save-task');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Đang tải lên...'; btn.disabled = true;

            try {
                const newTask = {
                    title: title, description: desc, due_date: deadline, category: cat,
                    assigner_id: currentUserId, assigner_name: currentUserName,
                    assignee_id: assignee_id, assignee_name: assignee_name,
                    progress: 0, status: 'To Do', evaluation: '',
                    created_at: new Date()
                };
                
                await addDoc(collection(db, "ehs_tasks"), newTask);
                window.closeTaskModal();
                showToast("Đã phát hành kế hoạch thành công!");
                
                // Reset form
                document.getElementById('task-title').value = ''; document.getElementById('task-desc').value = '';
                document.getElementById('task-assignee').value = ''; document.getElementById('task-deadline').value = '';
                document.getElementById('assignee-display').innerHTML = `<span>-- Chọn nhân sự --</span> <i class="ph-bold ph-caret-down shrink-0"></i>`;
                
                window.switchTab((assignee_id === currentUserId) ? 'my-tasks' : 'assigned-tasks');
                await fetchAllTasks(); 
                
            } catch (e) {
                showToast("Lỗi lưu dữ liệu: " + e.message, "error");
            } finally {
                btn.innerHTML = '<i class="ph-bold ph-paper-plane-tilt text-lg"></i> Phát Hành Kế Hoạch'; btn.disabled = false;
            }
        };

        window.saveUpdate = async function() {
            const newProg = parseInt(document.getElementById('task-progress').value);
            const isManager = (currentUserId === upTaskAssigner);
            
            let updateData = { progress: newProg };
            
            if (isManager) {
                const evalText = document.getElementById('task-eval').value.trim();
                const isDone = document.getElementById('task-done').checked;
                updateData.evaluation = evalText;
                if (isDone) { updateData.status = 'Done'; updateData.progress = 100; }
                else if (updateData.status === 'Done' && !isDone) { updateData.status = 'In Progress'; }
            } else {
                if (newProg > 0 && newProg < 100) updateData.status = 'In Progress';
                if (newProg === 100) updateData.status = 'Review'; 
            }

            const btn = document.getElementById('btn-update-task');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i> Đang lưu...'; btn.disabled = true;

            try {
                await updateDoc(doc(db, "ehs_tasks", upTaskId), updateData);
                window.closeUpdateModal(); 
                showToast("Cập nhật tiến độ thành công!");
                await fetchAllTasks(); 
            } catch(e) {
                showToast("Lỗi cập nhật: " + e.message, "error"); 
                btn.disabled = false; btn.innerHTML = 'Thử lại';
            }
        };

        // ==========================================
        // KHỞI TẠO BẢO MẬT & LUỒNG CHẠY CHÍNH
        // ==========================================
        applyTheme();
        
        if (!currentUserId) {
            alert("Bạn chưa đăng nhập hệ thống!");
            window.location.href = "login.html";
        } else {
            document.getElementById('header-user-name').innerText = currentUserName;
            
            // XÁC THỰC FIREBASE RỒI MỚI KÉO DỮ LIỆU
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        document.getElementById('loader-text').innerText = "Đã xác thực. Đang nạp danh sách công việc...";
                        await loadUsersDropdown();
                        await fetchAllTasks();
                    } catch (error) {
                        document.getElementById('loader').innerHTML = `<p class="text-red-500 font-bold text-center">Lỗi tải dữ liệu: ${error.message}</p>`;
                    }
                } else {
                    document.getElementById('loader').innerHTML = `
                        <div class="text-center text-red-500">
                            <i class="ph-fill ph-lock-key text-6xl mb-4"></i>
                            <p class="font-bold text-lg mb-2">Phiên đăng nhập đã bị từ chối.</p>
                            <p class="text-sm text-slate-500 mb-6">Bạn cần đăng nhập chính thức bằng hệ thống để sử dụng tính năng này.</p>
                            <a href="login.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">Quay về trang Đăng nhập</a>
                        </div>`;
                }
            });
        }
    </script>
