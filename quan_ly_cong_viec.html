<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Công Việc & Tiến Độ EHS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', muted: '#94a3b8' } }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-800 dark:text-slate-200 h-screen flex flex-col transition-colors duration-300 overflow-hidden">

    <div id="toast" class="fixed top-5 right-5 z-[100] transform transition-all duration-300 translate-x-[150%] flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-white">
        <i id="toast-icon" class="text-2xl"></i>
        <span id="toast-message">Thành công!</span>
    </div>

    <!-- HEADER -->
    <header class="h-16 bg-white dark:bg-dark-card border-b border-slate-200 dark:border-dark-border flex items-center justify-between px-4 sm:px-8 shrink-0 z-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-10 h-10 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full flex items-center justify-center transition">
                <i class="ph-bold ph-arrow-left text-lg"></i>
            </a>
            <div>
                <h1 class="font-black text-xl leading-tight text-blue-700 dark:text-blue-400 flex items-center gap-2">
                    <i class="ph-fill ph-kanban"></i> <span>Quản Lý Tiến Độ</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-sm font-bold bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg hidden sm:block" id="header-user-name">Đang tải...</div>
            <button onclick="window.toggleDarkMode()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i id="theme-icon" class="ph-bold ph-moon"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 relative">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <!-- TÌM KIẾM & BỘ LỌC -->
            <div class="bg-white dark:bg-dark-card p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2 relative">
                    <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-box" onkeyup="window.renderTasks()" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:border-blue-500 font-medium" placeholder="Tìm tên công việc, người nhận, người giao...">
                </div>
                <div>
                    <select id="filter-category" onchange="window.renderTasks()" class="w-full px-4 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm font-bold outline-none focus:border-blue-500 text-slate-700 dark:text-slate-300 appearance-none">
                        <option value="all">Tất cả mảng công việc</option>
                        <option value="EHS Chung">Mảng EHS Chung</option>
                        <option value="PCCC">Mảng PCCC</option>
                        <option value="ATVSV">Mạng lưới ATVSV</option>
                        <option value="Khác">Mảng Khác</option>
                    </select>
                </div>
                <div>
                    <button onclick="window.openTaskModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2">
                        <i class="ph-bold ph-plus"></i> Tạo Công Việc
                    </button>
                </div>
            </div>

            <!-- TABS -->
            <div class="flex flex-wrap bg-slate-200 dark:bg-slate-800 p-1 rounded-xl w-fit">
                <button onclick="window.switchTab('my-tasks')" id="tab-my-tasks" class="px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-600 shadow text-blue-700 dark:text-white transition">Việc tôi phải làm</button>
                <button onclick="window.switchTab('assigned-tasks')" id="tab-assigned" class="px-6 py-2 rounded-lg font-bold text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition">Việc tôi đã giao</button>
                <button onclick="window.switchTab('all-tasks')" id="tab-all" class="hidden px-6 py-2 rounded-lg font-bold text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition items-center gap-1"><i class="ph-fill ph-crown text-amber-500"></i> Góc Lãnh Đạo</button>
            </div>

            <div id="loader" class="flex flex-col items-center justify-center py-20 text-blue-500">
                <i class="ph-bold ph-spinner animate-spin text-4xl mb-4"></i>
                <p class="font-bold text-slate-500 dark:text-dark-muted" id="loader-text">Đang kết nối hệ thống và xác thực người dùng...</p>
            </div>

            <!-- BẢNG TIẾN ĐỘ NHÂN VIÊN (DÀNH CHO LÃNH ĐẠO) -->
            <div id="leaderboard-container" class="hidden mb-6 bg-white dark:bg-dark-card p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border">
                <!-- Nội dung bảng xếp hạng sẽ được JS nạp vào đây -->
            </div>

            <div id="task-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden">
                <!-- Thẻ công việc sẽ được JS vẽ vào đây -->
            </div>
            
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400 dark:text-slate-600">
                <i class="ph-fill ph-clipboard-text text-6xl mb-4 opacity-50"></i>
                <p class="font-bold text-lg">Chưa có công việc nào trong mục này.</p>
            </div>

        </div>
    </main>

    <!-- MODAL GIAO VIỆC & LẬP KẾ HOẠCH -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-dark-card rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-200 dark:border-dark-border flex justify-between items-center bg-slate-50 dark:bg-slate-800/50 rounded-t-2xl">
                <h2 class="text-lg font-black text-slate-800 dark:text-white flex items-center gap-2">
                    <i class="ph-fill ph-clipboard-text text-blue-600"></i> Lập Kế Hoạch & Giao Việc
                </h2>
                <button onclick="window.closeTaskModal()" class="text-slate-400 hover:text-red-500"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Tên công việc / Dự án</label>
                    <input type="text" id="task-title" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-xl px-4 py-3 font-bold text-slate-800 dark:text-white outline-none focus:border-blue-500" placeholder="VD: Hoàn thiện báo cáo quan trắc môi trường">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Phân loại Mảng</label>
                        <select id="task-category" class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-xl px-3 py-3 font-semibold text-slate-700 dark:text-slate-300 outline-none focus:border-blue-500">
                            <option value="EHS Chung">EHS Chung</option>
                            <option value="PCCC">PCCC</option>
                            <option value="ATVSV">ATVSV</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>

                    <!-- DROPDOWN THÔNG MINH CHO NHÂN SỰ -->
                    <div class="sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Giao cho ai?</label>
                        <div class="relative" id="assignee-wrapper">
                            <input type="hidden" id="task-assignee" value="">
                            <button type="button" onclick="window.toggleDropdown()" id="assignee-display" class="w-full border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded-xl px-3 py-3 font-bold text-blue-700 dark:text-blue-400 outline-none flex justify-between items-center text-sm shadow-sm transition h-[46px]">
                                <span class="truncate">-- Đang tải... --</span>
                                <i class="ph-bold ph-caret-down shrink-0"></i>
                            </button>
                            <div id="assignee-menu" class="absolute z-[100] w-full mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl hidden flex-col max-h-64 overflow-hidden">
                                <div class="p-2 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                    <input type="text" id="assignee-search" onkeyup="window.filterAssignee()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" placeholder="🔍 Tìm tên, mã NV, bộ phận...">
                                </div>
                                <ul id="assignee-list" class="overflow-y-auto custom-scrollbar p-1">
                                    <!-- JS sẽ nạp thẻ <li> vào đây -->
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="sm:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1">Deadline (Hạn chót)</label>
                        <input type="date" id="task-deadline" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-xl px-3 py-3 font-bold text-slate-800 dark:text-white outline-none focus:border-red-500 text-sm h-[46px]">
                    </div>
                </div>

                <div class="bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 p-4 rounded-xl relative">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-xs font-black text-indigo-700 dark:text-indigo-400 uppercase flex items-center gap-1">
                            <i class="ph-fill ph-list-numbers"></i> Kế hoạch chi tiết theo từng bước
                        </label>
                    </div>
                    
                    <div id="plan-steps-wrapper" class="space-y-2">
                        <!-- Các bước thực hiện (Input) sẽ được thêm vào đây -->
                    </div>
                    
                    <button onclick="window.addPlanStep()" class="mt-3 text-sm font-bold text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 flex items-center gap-1 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-indigo-200 dark:border-indigo-700 shadow-sm transition">
                        <i class="ph-bold ph-plus"></i> Thêm bước thực hiện
                    </button>
                </div>
            </div>

            <div class="p-5 border-t border-slate-200 dark:border-dark-border bg-slate-50 dark:bg-slate-800/50 flex justify-end gap-3 rounded-b-2xl">
                <button onclick="window.closeTaskModal()" class="px-6 py-2.5 font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition">Hủy</button>
                <button id="btn-save-task" onclick="window.saveTask()" class="bg-blue-600 text-white px-8 py-2.5 font-bold rounded-xl shadow-md hover:bg-blue-700 transition flex items-center gap-2">
                    <i class="ph-bold ph-paper-plane-tilt text-lg"></i> Phát Hành Kế Hoạch
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CẬP NHẬT TIẾN ĐỘ & ĐÁNH GIÁ CỦA LÃNH ĐẠO -->
    <div id="update-modal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-dark-card rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-200 dark:border-dark-border flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h2 class="text-lg font-black text-slate-800 dark:text-white" id="update-modal-title">Cập nhật Tiến độ</h2>
                <button onclick="window.closeUpdateModal()" class="text-slate-400 hover:text-red-500"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scrollbar space-y-5">
                <input type="hidden" id="up-task-id">
                
                <!-- Hiển thị tóm tắt công việc -->
                <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                    <h3 id="disp-title" class="font-bold text-lg text-slate-800 dark:text-white mb-1">...</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400"><i class="ph-fill ph-calendar"></i> Deadline: <span id="disp-deadline" class="font-mono font-bold text-red-500">...</span></p>
                </div>

                <!-- KÉO SLIDER CHO TỪNG BƯỚC CÔNG VIỆC -->
                <div id="checklist-progress-section" class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-blue-100 dark:border-slate-700 shadow-sm space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-2">
                        <span class="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase">Cập nhật tiến độ từng bước</span>
                        <div class="text-right">
                            <span class="text-[10px] font-bold text-slate-400 block uppercase">Tổng tiến độ</span>
                            <span id="prog-val" class="font-black text-3xl text-blue-600">0%</span>
                        </div>
                    </div>
                    <div id="modal-checklist-container" class="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar pr-2">
                        <!-- Các Slider từng bước sẽ được nạp bằng JS vào đây -->
                    </div>
                    <input type="hidden" id="task-progress" value="0">
                </div>

                <!-- KHU VỰC DÀNH CHO NHÂN VIÊN TỰ THEO DÕI MUỐN TRÌNH SẾP (CÓ BỘ LỌC TÌM KIẾM CẬP NHẬT) -->
                <div id="request-review-section" class="hidden pt-4 border-t border-slate-200 dark:border-slate-700">
                    <label class="flex items-start gap-3 cursor-pointer p-4 bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-800 rounded-xl transition hover:bg-purple-100 dark:hover:bg-purple-900/40">
                        <input type="checkbox" id="task-request-review" class="w-6 h-6 text-purple-600 rounded mt-0.5 cursor-pointer" onchange="window.toggleReviewerSelect()">
                        <div class="flex-1">
                            <span class="font-black text-purple-700 dark:text-purple-400 text-base block">Trình Lãnh Đạo Xem Xét <br><span class="text-xs font-semibold">(Submit for Review / 提交审核)</span></span>
                            <span class="text-xs text-purple-600/70 dark:text-purple-300/70 font-medium block mt-1">Bật công tắc này để báo cáo việc hoàn thành lên Góc Lãnh Đạo.</span>
                            
                            <!-- KHU VỰC CHỌN SẾP THÔNG MINH CÓ Ô TÌM KIẾM -->
                            <div id="reviewer-select-container" class="mt-3 hidden" onclick="event.stopPropagation()">
                                <label class="block text-[11px] font-bold text-purple-800 dark:text-purple-300 uppercase mb-1">Đích danh Sếp duyệt / Select Leader / 选择领导 <span class="text-red-500">*</span></label>
                                
                                <div class="relative" id="reviewer-wrapper">
                                    <input type="hidden" id="task-reviewer" value="">
                                    <button type="button" onclick="window.toggleReviewerDropdown()" id="reviewer-display" class="w-full border border-purple-300 dark:border-purple-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2.5 font-bold text-purple-900 dark:text-purple-100 outline-none flex justify-between items-center text-sm shadow-sm transition">
                                        <span class="truncate" id="reviewer-display-text">-- Chọn Sếp đánh giá (Gõ tìm tên/mã NV) --</span>
                                        <i class="ph-bold ph-caret-down shrink-0"></i>
                                    </button>
                                    
                                    <div id="reviewer-menu" class="absolute z-[100] w-full mt-1 bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-700 rounded-xl shadow-xl hidden flex-col max-h-60 overflow-hidden">
                                        <div class="p-2 border-b border-purple-100 dark:border-purple-700 shrink-0 bg-purple-50/50 dark:bg-slate-900/50">
                                            <input type="text" id="reviewer-search" onkeyup="window.filterReviewerList()" class="w-full bg-white dark:bg-slate-900 border border-purple-200 dark:border-purple-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-purple-500 dark:text-white" placeholder="🔍 Gõ tên sếp, mã NV, chức danh...">
                                        </div>
                                        <ul id="reviewer-list" class="overflow-y-auto custom-scrollbar p-1">
                                            <!-- JS sẽ nạp danh sách sếp đã lọc chuẩn vào đây -->
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- KHU VỰC DÀNH CHO LÃNH ĐẠO / NGƯỜI GIAO VIỆC -->
                <div id="eval-section" class="hidden pt-4 border-t border-slate-200 dark:border-slate-700 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-amber-600 uppercase mb-2"><i class="ph-fill ph-chat-centered-text"></i> Đánh giá & Yêu cầu cải tiến (Dành cho Lãnh đạo)</label>
                        <textarea id="task-eval" class="w-full border border-amber-200 dark:border-amber-900 bg-amber-50/50 dark:bg-amber-900/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-500 custom-scrollbar resize-none dark:text-slate-200" rows="3" placeholder="Lãnh đạo nhập nhận xét hoặc yêu cầu nhân viên làm lại điểm nào..."></textarea>
                    </div>
                    
                    <label class="flex items-center gap-3 cursor-pointer p-4 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-xl transition hover:bg-emerald-100">
                        <input type="checkbox" id="task-done" class="w-6 h-6 text-emerald-600 rounded">
                        <div>
                            <span class="font-black text-emerald-700 dark:text-emerald-400 text-base block">Nghiệm thu Đóng việc</span>
                            <span class="text-xs text-emerald-600/70 font-medium">Xác nhận công việc đã hoàn thành 100% đạt yêu cầu.</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="p-5 border-t border-slate-200 dark:border-dark-border flex justify-end gap-3 bg-slate-50 dark:bg-slate-800/50">
                <button id="btn-update-task" onclick="window.saveUpdate()" class="w-full bg-blue-600 text-white py-3.5 font-bold rounded-xl shadow-md hover:bg-blue-700 transition text-lg">Lưu Cập Nhật Tiến Độ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC7iFVmgoUL-sW3UlaMV0rlNQYugFiw2uA",
          authDomain: "ehs-training-app.firebaseapp.com",
          projectId: "ehs-training-app",
          storageBucket: "ehs-training-app.firebasestorage.app",
          messagingSenderId: "354083430003",
          appId: "1:354083430003:web:059953b7b9c1a9470a5406",
          measurementId: "G-74ETHWTJCW"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isDarkMode = localStorage.getItem('ehs_theme') === 'dark';
        let currentUserId = localStorage.getItem("ehs_user_id");
        let currentUserName = localStorage.getItem("ehs_user_name") || "Nhân viên EHS";
        let userDept = localStorage.getItem("ehs_user_dept") || "";
        
        let isLeader = false;
        let isGlobalLeader = false;

        let currentTab = 'my-tasks'; 
        let rawTasksData = [];
        let globalUserDeptMap = {}; 
        let upTaskId = "";
        let upTaskAssigner = "";

        window.showToast = function(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            toast.className = "fixed top-5 right-5 z-[100] transform transition-all duration-300 flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl font-bold text-white";
            
            if (type === "success") {
                toast.classList.add('bg-emerald-600');
                icon.className = "ph-fill ph-check-circle text-2xl";
            } else {
                toast.classList.add('bg-red-600');
                icon.className = "ph-fill ph-warning-circle text-2xl";
            }
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-x-[150%]');
            setTimeout(() => { toast.classList.add('translate-x-[150%]'); }, 3000);
        }

        window.toggleDarkMode = function() {
            isDarkMode = !isDarkMode; 
            localStorage.setItem('ehs_theme', isDarkMode ? 'dark' : 'light'); 
            applyTheme();
        };

        function applyTheme() {
            if (isDarkMode) { document.documentElement.classList.add('dark'); document.getElementById('theme-icon').className = "ph-fill ph-sun text-amber-400"; } 
            else { document.documentElement.classList.remove('dark'); document.getElementById('theme-icon').className = "ph-bold ph-moon text-slate-600"; }
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            const btnMy = document.getElementById('tab-my-tasks');
            const btnAssigned = document.getElementById('tab-assigned');
            const btnAll = document.getElementById('tab-all');
            
            const activeClass = "px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-600 shadow text-blue-700 dark:text-white transition";
            const inactiveClass = "px-6 py-2 rounded-lg font-bold text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition";
            
            btnMy.className = (tab === 'my-tasks') ? activeClass : inactiveClass;
            btnAssigned.className = (tab === 'assigned-tasks') ? activeClass : inactiveClass;
            if(isLeader) {
                btnAll.className = (tab === 'all-tasks') ? activeClass + " flex items-center gap-1" : inactiveClass + " flex items-center gap-1";
            }
            
            window.renderTasks();
        };

        window.openTaskModal = function() { document.getElementById('task-modal').classList.remove('hidden'); };
        window.closeTaskModal = function() { document.getElementById('task-modal').classList.add('hidden'); };

        window.updateStepProg = function(el) {
            const idx = el.getAttribute('data-idx');
            const val = el.value;
            document.getElementById(`step-val-${idx}`).innerText = val + '%';
            
            if(val === "100") {
                el.classList.add('accent-emerald-500');
                el.classList.remove('accent-blue-600');
                document.getElementById(`step-title-${idx}`).classList.add('line-through', 'text-emerald-600');
            } else {
                el.classList.add('accent-blue-600');
                el.classList.remove('accent-emerald-500');
                document.getElementById(`step-title-${idx}`).classList.remove('line-through', 'text-emerald-600');
            }
            window.recalcProgress();
        };

        window.addPlanStep = function(text = "") {
            const wrapper = document.getElementById('plan-steps-wrapper');
            const div = document.createElement('div');
            div.className = "flex items-start gap-2 step-item animate-[slideUp_0.2s_ease-out]";
            div.innerHTML = `
                <i class="ph-fill ph-check-circle text-slate-300 mt-2.5"></i>
                <textarea class="step-input w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:text-slate-200 custom-scrollbar resize-none" rows="2" placeholder="Nhập chi tiết công việc cần làm...">${text.replace(/"/g, '&quot;')}</textarea>
                <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 mt-2 bg-red-50 dark:bg-red-900/30 p-1.5 rounded-lg transition"><i class="ph-bold ph-trash"></i></button>
            `;
            wrapper.appendChild(div);
        };

        window.toggleDropdown = function() {
            const menu = document.getElementById('assignee-menu');
            menu.classList.toggle('hidden');
            if(!menu.classList.contains('hidden')) {
                document.getElementById('assignee-search').focus();
            }
        };

        window.toggleReviewerDropdown = function() {
            const menu = document.getElementById('reviewer-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            if(!menu.classList.contains('hidden')) {
                document.getElementById('reviewer-search').focus();
            }
        };

        document.addEventListener('click', function(event) {
            const wrapper = document.getElementById('assignee-wrapper');
            const menu = document.getElementById('assignee-menu');
            if (wrapper && !wrapper.contains(event.target)) {
                menu.classList.add('hidden');
            }

            const revWrapper = document.getElementById('reviewer-wrapper');
            const revMenu = document.getElementById('reviewer-menu');
            if (revWrapper && !revWrapper.contains(event.target)) {
                revMenu.classList.add('hidden');
                revMenu.classList.remove('flex');
            }
        });

        window.selectAssignee = function(id, name) {
            document.getElementById('task-assignee').value = id + '|' + name;
            document.getElementById('assignee-display').innerHTML = `<span class="truncate font-black">${name}</span> <i class="ph-bold ph-caret-down shrink-0"></i>`;
            document.getElementById('assignee-menu').classList.add('hidden');
        };

        window.selectReviewer = function(id, name, role) {
            document.getElementById('task-reviewer').value = id + '|' + name;
            document.getElementById('reviewer-display-text').innerText = `${name} (${role})`;
            const menu = document.getElementById('reviewer-menu');
            menu.classList.add('hidden');
            menu.classList.remove('flex');
        };

        window.filterAssignee = function() {
            const keyword = document.getElementById('assignee-search').value.toLowerCase();
            const items = document.querySelectorAll('.assignee-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(keyword)) item.style.display = 'block';
                else item.style.display = 'none';
            });
        };

        window.filterReviewerList = function() {
            const keyword = document.getElementById('reviewer-search').value.toLowerCase();
            const items = document.querySelectorAll('.reviewer-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(keyword)) item.style.display = 'block';
                else item.style.display = 'none';
            });
        };

        window.toggleReviewerSelect = function() {
            const isChecked = document.getElementById('task-request-review').checked;
            const container = document.getElementById('reviewer-select-container');
            if(isChecked) container.classList.remove('hidden');
            else container.classList.add('hidden');
        };

        async function loadUsersDropdown() {
            const ul = document.getElementById('assignee-list');
            const revUl = document.getElementById('reviewer-list');
            
            document.getElementById('assignee-display').innerHTML = `<span>-- Chọn nhân sự --</span> <i class="ph-bold ph-caret-down shrink-0"></i>`;
            document.getElementById('reviewer-display-text').innerText = `-- Chọn Sếp đánh giá (Gõ tìm tên/mã NV) --`;
            
            try {
                const snap = await getDocs(collection(db, "nhan_su_noi_bo"));
                let html = `<li onclick="window.selectAssignee('${currentUserId}', '${currentUserName}')" class="assignee-item p-3 mb-1 hover:bg-blue-100 dark:hover:bg-blue-900/50 rounded-lg cursor-pointer transition font-black text-blue-700 dark:text-blue-400 bg-blue-50/50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800">🌟 [TỰ GIAO] Việc cá nhân của tôi</li>`;
                let revHtml = ``;
                
                globalUserDeptMap = {};
                let currentUserRole = "";

                snap.forEach(doc => {
                    const data = doc.data();
                    
                    if(data.ma_nv) {
                        globalUserDeptMap[data.ma_nv] = data.bo_phan || "";
                    }

                    if(data.ma_nv === currentUserId) {
                        currentUserRole = (data.vi_tri || "") + " " + (data.bo_phan || "");
                    }

                    // Danh sách Giao Việc
                    if(data.ma_nv && data.ho_ten && data.ma_nv !== currentUserId) {
                        html += `<li onclick="window.selectAssignee('${data.ma_nv}', '${data.ho_ten.replace(/'/g, "\\'")}')" class="assignee-item p-2 mb-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg cursor-pointer transition text-sm border-b border-slate-50 dark:border-slate-800">
                            <div class="font-bold text-slate-800 dark:text-slate-200">${data.ho_ten} (${data.ma_nv})</div>
                            <div class="text-[10px] text-slate-500 mt-0.5">${data.bo_phan || 'Chưa cập nhật bộ phận'}</div>
                        </li>`;
                    }
                    
                    // CHỈ LỌC CÁC CHỨC DANH LÃNH ĐẠO THỰC SỰ ĐỂ DUYỆT (Giám đốc, Quản đốc, Giám sát, Trưởng nhóm, EHS...)
                    const roleTitle = (data.vi_tri || "").toLowerCase();
                    const pcccRole = (data.vai_tro_phu?.pccc || "").toLowerCase();
                    const deptTitle = (data.bo_phan || "").toLowerCase();
                    
                    const isStrictLeader = /giám đốc|quản đốc|giám sát|trưởng nhóm|trưởng phòng|đội trưởng|đội phó|ehs|admin/i.test(roleTitle) ||
                                           /trưởng|phó/i.test(pcccRole) ||
                                           /ehs|admin/i.test(deptTitle);
                    
                    if (isStrictLeader && data.ma_nv !== currentUserId && data.ma_nv && data.ho_ten) {
                        const displayRole = data.vi_tri || data.bo_phan || 'Lãnh đạo';
                        revHtml += `
                            <li onclick="window.selectReviewer('${data.ma_nv}', '${data.ho_ten.replace(/'/g, "\\'")}', '${displayRole.replace(/'/g, "\\'")}')" class="reviewer-item p-2.5 mb-1 hover:bg-purple-100 dark:hover:bg-purple-900/50 rounded-lg cursor-pointer transition text-sm border-b border-slate-100 dark:border-slate-700">
                                <div class="font-black text-purple-900 dark:text-purple-200 flex items-center justify-between">
                                    <span>${data.ho_ten}</span>
                                    <span class="text-[10px] bg-purple-100 dark:bg-purple-900/80 text-purple-700 dark:text-purple-300 px-2 py-0.5 rounded-full font-bold">${displayRole}</span>
                                </div>
                                <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Mã NV: ${data.ma_nv} - ${data.bo_phan || ''}</div>
                            </li>
                        `;
                    }
                });
                
                ul.innerHTML = html;
                revUl.innerHTML = revHtml || `<li class="p-3 text-xs text-slate-400 italic text-center">Không tìm thấy sếp phù hợp</li>`;
                
                const myRoleStr = currentUserRole.toLowerCase();
                isLeader = /trưởng|giám sát|quản đốc|giám đốc|đội phó|ehs|admin/i.test(myRoleStr);
                isGlobalLeader = /ehs|admin/i.test(myRoleStr);

                if(isLeader) {
                    document.getElementById('tab-all').classList.remove('hidden');
                    document.getElementById('tab-all').classList.add('flex');
                }

            } catch (e) {
                ul.innerHTML = '<li class="p-2 text-red-500 font-bold">Lỗi tải danh sách từ Firebase</li>';
                console.error("Lỗi dropdown: ", e);
            }
        }

        async function fetchAllTasks() {
            const grid = document.getElementById('task-grid');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');
            
            grid.classList.add('hidden'); empty.classList.add('hidden'); loader.classList.remove('hidden');

            try {
                const snap = await getDocs(collection(db, "ehs_tasks"));
                rawTasksData = [];
                snap.forEach(doc => rawTasksData.push({id: doc.id, ...doc.data()}));
                window.renderTasks();
            } catch (e) {
                console.error("Lỗi fetchAllTasks:", e);
                loader.innerHTML = `<div class="text-center text-red-500 font-bold"><i class="ph-bold ph-warning-circle text-4xl mb-2"></i><br>Lỗi máy chủ: Không thể đọc CSDL EHS_Tasks.<br>${e.message}</div>`;
            }
        }

        window.renderTasks = function() {
            const grid = document.getElementById('task-grid');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');
            const leaderboardContainer = document.getElementById('leaderboard-container');
            
            grid.innerHTML = '';
            
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const filterCat = document.getElementById('filter-category').value;

            let filteredTasks = rawTasksData.filter(t => {
                let tabMatch = false;
                const isSelfAssigned = (t.assignee_id === t.assigner_id);
                
                if (currentTab === 'my-tasks' && t.assignee_id === currentUserId) tabMatch = true;
                if (currentTab === 'assigned-tasks' && t.assigner_id === currentUserId && !isSelfAssigned) tabMatch = true;
                
                if (currentTab === 'all-tasks' && isLeader) {
                    if (isSelfAssigned) {
                        if (t.is_review_requested && (t.reviewer_id === currentUserId || isGlobalLeader)) {
                            tabMatch = true;
                        }
                    } else {
                        if (isGlobalLeader) {
                            tabMatch = true; 
                        } else {
                            let myMainDept = userDept.split('-')[0].trim().toLowerCase();
                            let taskAssigneeDept = globalUserDeptMap[t.assignee_id] || "";
                            let theirMainDept = taskAssigneeDept.split('-')[0].trim().toLowerCase();
                            
                            if (myMainDept && theirMainDept && myMainDept === theirMainDept) {
                                tabMatch = true;
                            }
                        }
                    }
                }
                
                if (!tabMatch) return false;
                if (filterCat !== 'all' && t.category !== filterCat) return false;

                const textSearch = ((t.title||"") + " " + (t.assignee_name||"") + " " + (t.assigner_name||"")).toLowerCase();
                if (keyword && !textSearch.includes(keyword)) return false;

                return true;
            });

            filteredTasks.sort((a,b) => {
                let timeA = a.created_at ? (a.created_at.toDate ? a.created_at.toDate().getTime() : a.created_at) : 0;
                let timeB = b.created_at ? (b.created_at.toDate ? b.created_at.toDate().getTime() : b.created_at) : 0;
                return timeB - timeA;
            });

            if (currentTab === 'all-tasks' && isLeader && filteredTasks.length > 0) {
                let userStats = {};
                filteredTasks.forEach(t => {
                    let assignee = t.assignee_name || 'Không xác định';
                    if (!userStats[assignee]) {
                        userStats[assignee] = { total: 0, completed: 0, totalProg: 0 };
                    }
                    userStats[assignee].total++;
                    userStats[assignee].totalProg += parseInt(t.progress || 0);
                    if (t.status === 'Done') userStats[assignee].completed++;
                });

                let statsHtml = `
                    <h3 class="font-black text-lg text-slate-800 dark:text-white mb-4 flex items-center gap-2 border-b border-slate-100 dark:border-slate-800 pb-2">
                        <i class="ph-fill ph-chart-bar text-amber-500"></i> Bảng Thống Kê Tiến Độ Nhân Viên
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                `;

                let sortedStats = Object.keys(userStats).map(name => {
                    return { name: name, ...userStats[name], avg: Math.round(userStats[name].totalProg / userStats[name].total) };
                }).sort((a, b) => b.avg - a.avg);

                sortedStats.forEach(stat => {
                    let colorClass = stat.avg === 100 ? 'bg-emerald-500' : (stat.avg >= 50 ? 'bg-blue-500' : 'bg-amber-500');
                    statsHtml += `
                        <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-sm text-slate-700 dark:text-slate-200 truncate pr-2">${stat.name}</span>
                                <span class="text-xs font-black ${stat.avg === 100 ? 'text-emerald-600' : 'text-blue-600'}">${stat.avg}%</span>
                            </div>
                            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5 mb-2 overflow-hidden">
                                <div class="${colorClass} h-1.5 rounded-full" style="width: ${stat.avg}%"></div>
                            </div>
                            <div class="flex justify-between text-[10px] font-semibold text-slate-500">
                                <span>Tổng việc: ${stat.total}</span>
                                <span class="text-emerald-600">Đã xong: ${stat.completed}</span>
                            </div>
                        </div>
                    `;
                });
                statsHtml += `</div>`;
                leaderboardContainer.innerHTML = statsHtml;
                leaderboardContainer.classList.remove('hidden');
            } else {
                leaderboardContainer.classList.add('hidden');
            }

            if(filteredTasks.length === 0) { 
                empty.classList.remove('hidden'); grid.classList.add('hidden'); loader.classList.add('hidden'); 
                return; 
            }

            filteredTasks.forEach(t => {
                const today = new Date(); today.setHours(0,0,0,0);
                const deadline = new Date(t.due_date);
                const isOverdue = deadline < today && t.status !== 'Done';
                
                let statusHtml = '';
                if (t.status === 'Done') statusHtml = `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-check-circle"></i> Hoàn thành</span>`;
                else if (isOverdue) statusHtml = `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold uppercase animate-pulse"><i class="ph-bold ph-warning-circle"></i> Quá hạn</span>`;
                else if (t.is_review_requested && t.status !== 'Done') statusHtml = `<span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-paper-plane-tilt"></i> Chờ duyệt</span>`;
                else if (t.status === 'Review') statusHtml = `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-eye"></i> Chờ nghiệm thu</span>`;
                else if (t.progress > 0) statusHtml = `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-spinner animate-spin"></i> Đang làm</span>`;
                else statusHtml = `<span class="bg-slate-200 text-slate-600 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-clock"></i> Mới giao</span>`;

                let catColor = "bg-slate-100 text-slate-600";
                if(t.category === 'PCCC') catColor = "bg-orange-100 text-orange-700 border-orange-200";
                if(t.category === 'ATVSV') catColor = "bg-teal-100 text-teal-700 border-teal-200";
                let catBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold border ${catColor} whitespace-nowrap">${t.category || 'Khác'}</span>`;

                const dateStr = deadline.toLocaleDateString('vi-VN');
                const isSelfAssigned = (t.assignee_id === t.assigner_id);

                let stepsHtml = '';
                if (t.plan_steps && Array.isArray(t.plan_steps) && t.plan_steps.length > 0) {
                    stepsHtml = '<ul class="space-y-2 mt-2">';
                    t.plan_steps.forEach((step, idx) => {
                        let text = typeof step === 'string' ? step : step.text;
                        let stepProg = typeof step === 'object' && step.progress !== undefined ? step.progress : (step.done ? 100 : 0);
                        
                        let isDone = stepProg === 100;
                        let icon = isDone ? '<i class="ph-bold ph-check-circle text-emerald-500 shrink-0 text-base"></i>' : '<i class="ph-bold ph-circle text-slate-300 shrink-0 text-base"></i>';
                        let textClass = isDone ? 'line-through text-slate-400 font-medium' : 'text-slate-700 dark:text-slate-300 font-medium';
                        let progColor = isDone ? 'bg-emerald-500' : 'bg-blue-400';
                        
                        stepsHtml += `
                            <li class="bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-100 dark:border-slate-700">
                                <div class="flex items-start gap-1.5 text-xs mb-1">${icon} <span class="${textClass}">${text}</span></div>
                                <div class="flex items-center gap-2 pl-5">
                                    <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-1 overflow-hidden"><div class="${progColor} h-1 rounded-full" style="width: ${stepProg}%"></div></div>
                                    <span class="text-[9px] font-bold text-slate-400 w-6 text-right">${stepProg}%</span>
                                </div>
                            </li>`;
                    });
                    stepsHtml += '</ul>';
                } else if (t.description) {
                    stepsHtml = `<div class="text-[13px] text-slate-600 dark:text-slate-300 mt-2">${marked.parse(t.description)}</div>`;
                }

                let improveWarning = '';
                if (t.evaluation && t.status !== 'Done') {
                    improveWarning = `
                        <div class="mt-3 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 p-2 rounded-lg">
                            <p class="text-[10px] font-black text-amber-700 dark:text-amber-400 uppercase flex items-center gap-1"><i class="ph-fill ph-warning"></i> Sếp yêu cầu cải tiến:</p>
                            <p class="text-xs text-amber-800 dark:text-amber-300 mt-1 font-medium italic">"${t.evaluation}"</p>
                        </div>
                    `;
                }
                
                let sourceTaskHtml = '';
                if (isSelfAssigned) {
                    if (t.is_review_requested) {
                        sourceTaskHtml = `<div class="bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 p-2 rounded-lg font-semibold flex items-start gap-1.5 border border-purple-100 dark:border-purple-800"><i class="ph-fill ph-paper-plane-tilt mt-0.5 shrink-0"></i> <span>Đã trình: <b class="text-purple-800 dark:text-purple-200">${t.reviewer_name || 'Sếp'}</b></span></div>`;
                    } else {
                        sourceTaskHtml = `<div class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 p-2 rounded-lg font-semibold inline-flex items-center gap-1 border border-indigo-100 dark:border-indigo-800"><i class="ph-fill ph-user-circle"></i> Công việc tự theo dõi</div>`;
                    }
                } else {
                    sourceTaskHtml = `<div class="space-y-1"><p><i class="ph-fill ph-user-circle text-blue-500"></i> Nhận: <b class="text-slate-700 dark:text-slate-200">${t.assignee_name}</b></p>
                             <p><i class="ph-fill ph-user-focus text-amber-500"></i> Giao: <b class="text-slate-700 dark:text-slate-200">${t.assigner_name}</b></p></div>`;
                }

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-dark-card border ${isOverdue && t.status !== 'Done' ? 'border-red-300 shadow-[0_0_15px_rgba(239,68,68,0.15)]' : 'border-slate-200 dark:border-dark-border shadow-sm hover:shadow-md'} p-5 rounded-2xl flex flex-col transition-all`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex gap-2">${statusHtml} ${catBadge}</div>
                        <span class="text-xs font-mono font-bold ${isOverdue && t.status !== 'Done' ? 'text-red-600' : 'text-slate-500 dark:text-slate-400'}"><i class="ph-fill ph-calendar-blank"></i> ${dateStr}</span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-2 leading-tight">${t.title}</h3>
                    <div class="text-[13px] text-slate-500 dark:text-slate-400 mb-3 shrink-0">
                        ${sourceTaskHtml}
                    </div>
                    
                    <div class="mb-4 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800 flex-1 overflow-y-auto custom-scrollbar max-h-40">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Các bước thực hiện:</p>
                        ${stepsHtml}
                        ${improveWarning}
                    </div>

                    <div class="mt-auto pt-4 border-t border-slate-100 dark:border-slate-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Tiến độ hoàn thành</span>
                            <span class="text-xs font-black text-blue-600 dark:text-blue-400">${t.progress}%</span>
                        </div>
                        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 mb-4 overflow-hidden">
                            <div class="bg-blue-600 dark:bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: ${t.progress}%"></div>
                        </div>
                        
                        <button onclick="window.openUpdateModal('${t.id}')" class="w-full bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-bold py-2.5 rounded-xl text-sm transition border-2 border-blue-100 dark:border-slate-700 flex justify-center items-center gap-2">
                            <i class="ph-bold ph-pencil-simple"></i> Cập Nhật Tiến Độ
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            loader.classList.add('hidden');
            empty.classList.add('hidden');
            grid.classList.remove('hidden');
        };

        window.openUpdateModal = function(taskId) {
            const t = rawTasksData.find(x => x.id === taskId);
            if(!t) return;

            upTaskId = t.id; 
            upTaskAssigner = t.assigner_id;
            
            document.getElementById('up-task-id').value = t.id;
            document.getElementById('disp-title').innerText = t.title;
            document.getElementById('disp-deadline').innerText = new Date(t.due_date).toLocaleDateString('vi-VN');
            
            const container = document.getElementById('modal-checklist-container');
            container.innerHTML = '';
            let steps = t.plan_steps || [];

            if (steps.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-500 italic">Công việc này không có chi tiết từng bước. Hãy cập nhật tiến độ ở thanh tổng.</p>';
            } else {
                steps.forEach((step, idx) => {
                    let text = typeof step === 'string' ? step : step.text;
                    let stepProg = 0;
                    if (typeof step === 'object') {
                        if (step.progress !== undefined) stepProg = step.progress;
                        else if (step.done) stepProg = 100;
                    }

                    let isDoneClass = stepProg === 100 ? 'line-through text-emerald-600' : 'text-slate-700 dark:text-slate-200';
                    let accentClass = stepProg === 100 ? 'accent-emerald-500' : 'accent-blue-600';

                    container.innerHTML += `
                        <div class="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700">
                            <div class="flex justify-between items-start mb-2 gap-2">
                                <span id="step-title-${idx}" class="text-sm font-bold ${isDoneClass} transition-colors">${text}</span>
                                <span id="step-val-${idx}" class="text-xs font-black text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/50 px-2 py-0.5 rounded shrink-0">${stepProg}%</span>
                            </div>
                            <input type="range" min="0" max="100" value="${stepProg}" class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer modal-step-slider ${accentClass}" data-idx="${idx}" oninput="window.updateStepProg(this)">
                        </div>
                    `;
                });
            }

            window.recalcProgress();
            
            const isSelfAssigned = (t.assignee_id === t.assigner_id);
            const evalSec = document.getElementById('eval-section');
            const reqReviewSec = document.getElementById('request-review-section');
            const reqReviewCheck = document.getElementById('task-request-review');
            const evalInput = document.getElementById('task-eval');
            const doneCheck = document.getElementById('task-done');
            
            if (evalInput) evalInput.value = t.evaluation || "";
            reqReviewSec.classList.add('hidden');
            
            if (currentTab === 'my-tasks') {
                evalSec.classList.add('hidden');
                document.getElementById('update-modal-title').innerText = 'Báo cáo Tiến độ từng bước';
                
                if (isSelfAssigned) {
                    reqReviewSec.classList.remove('hidden');
                    reqReviewCheck.checked = !!t.is_review_requested;
                    window.toggleReviewerSelect();
                    
                    if(t.reviewer_id) {
                        document.getElementById('task-reviewer').value = `${t.reviewer_id}|${t.reviewer_name}`;
                        document.getElementById('reviewer-display-text').innerText = `${t.reviewer_name}`;
                    } else {
                        document.getElementById('task-reviewer').value = "";
                        document.getElementById('reviewer-display-text').innerText = `-- Chọn Sếp đánh giá (Gõ tìm tên/mã NV) --`;
                    }
                }
            } else {
                evalSec.classList.remove('hidden');
                if (doneCheck) doneCheck.checked = (t.status === 'Done');
                document.getElementById('update-modal-title').innerHTML = '<i class="ph-fill ph-crown text-amber-500"></i> Góc Lãnh Đạo Đánh Giá';
            }

            document.getElementById('update-modal').classList.remove('hidden');
            const btnUpdate = document.getElementById('btn-update-task');
            btnUpdate.innerHTML = 'Lưu Cập Nhật Tiến Độ';
            btnUpdate.disabled = false;
        };

        window.closeUpdateModal = function() { document.getElementById('update-modal').classList.add('hidden'); };

        window.recalcProgress = function() {
            const sliders = document.querySelectorAll('.modal-step-slider');
            let prog = 0;
            if(sliders.length > 0) {
                let total = 0;
                sliders.forEach(s => { total += parseInt(s.value); });
                prog = Math.round(total / sliders.length);
            }
            document.getElementById('task-progress').value = prog;
            document.getElementById('prog-val').innerText = prog + '%';
        };

        window.saveTask = async function() {
            const title = document.getElementById('task-title').value.trim();
            const assigneeRaw = document.getElementById('task-assignee').value;
            const deadline = document.getElementById('task-deadline').value;
            const cat = document.getElementById('task-category').value;

            const stepInputs = document.querySelectorAll('.step-input');
            const planStepsArray = Array.from(stepInputs).map(inp => {
                return { text: inp.value.trim(), progress: 0 };
            }).filter(v => v.text !== '');

            if(!title || !assigneeRaw || !deadline) return showToast("Vui lòng điền đủ Tên, Người nhận và Hạn chót!", "error");
            if(planStepsArray.length === 0) return showToast("Kế hoạch phải có ít nhất 1 bước thực hiện!", "error");

            const [assignee_id, assignee_name] = assigneeRaw.split('|');
            const btn = document.getElementById('btn-save-task');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Đang tải lên...'; btn.disabled = true;

            try {
                const newTask = {
                    title: title, 
                    plan_steps: planStepsArray, 
                    due_date: deadline, 
                    category: cat,
                    assigner_id: currentUserId, assigner_name: currentUserName,
                    assignee_id: assignee_id, assignee_name: assignee_name,
                    progress: 0, status: 'To Do', evaluation: '',
                    is_review_requested: false,
                    reviewer_id: "", reviewer_name: "",
                    created_at: new Date()
                };
                
                await addDoc(collection(db, "ehs_tasks"), newTask);
                window.closeTaskModal();
                showToast("Đã phát hành kế hoạch thành công!");
                
                document.getElementById('task-title').value = ''; 
                document.getElementById('plan-steps-wrapper').innerHTML = '';
                document.getElementById('task-assignee').value = ''; document.getElementById('task-deadline').value = '';
                document.getElementById('assignee-display').innerHTML = `<span>-- Chọn nhân sự --</span> <i class="ph-bold ph-caret-down shrink-0"></i>`;
                
                if (assignee_id === currentUserId) window.switchTab('my-tasks');
                else window.switchTab('assigned-tasks');
                
                await fetchAllTasks(); 
                
            } catch (e) {
                showToast("Lỗi lưu dữ liệu: " + e.message, "error");
            } finally {
                btn.innerHTML = '<i class="ph-bold ph-paper-plane-tilt text-lg"></i> Phát Hành Kế Hoạch'; btn.disabled = false;
            }
        };

        window.saveUpdate = async function() {
            const t = rawTasksData.find(x => x.id === upTaskId);
            const sliders = document.querySelectorAll('.modal-step-slider');
            let updatedSteps = [];
            let totalProg = 0;
            
            if (t && t.plan_steps) {
                sliders.forEach(s => {
                    let idx = s.getAttribute('data-idx');
                    let stepData = t.plan_steps[idx];
                    let text = typeof stepData === 'string' ? stepData : stepData.text;
                    let p = parseInt(s.value);
                    updatedSteps.push({ text: text, progress: p });
                    totalProg += p;
                });
            }

            let newProg = sliders.length > 0 ? Math.round(totalProg / sliders.length) : parseInt(document.getElementById('task-progress').value);

            let updateData = { 
                progress: newProg,
                plan_steps: updatedSteps.length > 0 ? updatedSteps : t.plan_steps 
            };
            
            if (currentTab === 'all-tasks' || currentTab === 'assigned-tasks') {
                const evalInput = document.getElementById('task-eval');
                const evalText = evalInput ? evalInput.value.trim() : "";
                const doneCheck = document.getElementById('task-done');
                const isDone = doneCheck ? doneCheck.checked : false;
                
                updateData.evaluation = evalText; 
                if (isDone) { 
                    updateData.status = 'Done'; 
                    updateData.progress = 100; 
                    updateData.plan_steps = updateData.plan_steps.map(s => ({...s, progress: 100}));
                }
                else if (t.status === 'Done' && !isDone) { updateData.status = 'In Progress'; }
            } else {
                if (newProg > 0 && newProg < 100) updateData.status = 'In Progress';
                if (newProg === 100 && !t.is_review_requested) updateData.status = 'Review'; 
                
                const isSelfAssigned = (t.assignee_id === t.assigner_id);
                if (isSelfAssigned) {
                    const reqReviewCheck = document.getElementById('task-request-review');
                    if (reqReviewCheck) {
                        updateData.is_review_requested = reqReviewCheck.checked;
                        if (reqReviewCheck.checked) {
                            const reviewerVal = document.getElementById('task-reviewer').value;
                            if(!reviewerVal) {
                                showToast("Vui lòng chọn đích danh Lãnh đạo để gửi duyệt!", "error");
                                const btn = document.getElementById('btn-update-task');
                                btn.disabled = false; btn.innerHTML = 'Lưu Cập Nhật Tiến Độ';
                                return; 
                            }
                            const [revId, revName] = reviewerVal.split('|');
                            updateData.reviewer_id = revId;
                            updateData.reviewer_name = revName;
                            updateData.status = 'Review';
                        } else {
                            updateData.reviewer_id = "";
                            updateData.reviewer_name = "";
                            if (newProg === 100) updateData.status = 'Done';
                            else updateData.status = 'In Progress';
                        }
                    }
                }
            }

            const btn = document.getElementById('btn-update-task');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i> Đang lưu...'; btn.disabled = true;

            try {
                await updateDoc(doc(db, "ehs_tasks", upTaskId), updateData);
                window.closeUpdateModal(); 
                showToast("Cập nhật tiến độ thành công!");
                await fetchAllTasks(); 
            } catch(e) {
                showToast("Lỗi cập nhật: " + e.message, "error"); 
                btn.disabled = false; btn.innerHTML = 'Thử lại';
            }
        };

        applyTheme();
        window.addPlanStep();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    document.getElementById('header-user-name').innerText = currentUserName;
                    document.getElementById('loader-text').innerText = "Đã xác thực. Đang nạp danh sách công việc...";
                    await loadUsersDropdown();
                    await fetchAllTasks();
                } catch (error) {
                    document.getElementById('loader').innerHTML = `<p class="text-red-500 font-bold text-center">Lỗi tải dữ liệu: ${error.message}</p>`;
                }
            } else {
                document.getElementById('loader').innerHTML = `
                    <div class="text-center text-red-500">
                        <i class="ph-fill ph-lock-key text-6xl mb-4"></i>
                        <p class="font-bold text-lg mb-2">Phiên đăng nhập đã bị từ chối.</p>
                        <p class="text-sm text-slate-500 mb-6">Bạn cần đăng nhập chính thức bằng hệ thống để sử dụng tính năng này.</p>
                        <a href="login.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">Quay về trang Đăng nhập</a>
                    </div>`;
            }
        });
    </script>
</body>
</html>
