    <script>
        let isDarkMode = localStorage.getItem('ehs_theme') === 'dark';
        const currentUserId = localStorage.getItem("ehs_user_id");
        const currentUserName = localStorage.getItem("ehs_user_name");
        
        let currentTab = 'my-tasks'; // my-tasks, assigned-tasks, all-tasks
        let rawTasksData = []; // Lưu toàn bộ data kéo về để JavaScript lọc
        
        const AI_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_THIS_IS_YOUR_DEPLOYED_URL_HERE/exec"; 

        async function init() {
            if (!currentUserId) {
                alert("Bạn chưa đăng nhập!");
                window.location.href = "login.html";
                return;
            }
            applyTheme();
            
            // XỬ LÝ LỖI KHÔNG TẢI ĐƯỢC DỮ LIỆU: BẮT BUỘC AUTH TRƯỚC KHI GỌI FIRESTORE
            try {
                await window.signInAnonymously(window.auth);
                const user = window.auth.currentUser;
                if (!user) throw new Error("Chưa xác thực được với hệ thống");
                
                await loadUsersDropdown();
                await fetchAllTasks(); // Kéo hết về 1 lần
            } catch (error) {
                console.error("Lỗi khởi tạo:", error);
                document.getElementById('loader').innerHTML = `<p class="text-red-500 font-bold">Lỗi truy cập máy chủ: ${error.message}</p>`;
            }
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode; 
            localStorage.setItem('ehs_theme', isDarkMode ? 'dark' : 'light'); 
            applyTheme();
        }

        function applyTheme() {
            if (isDarkMode) { document.documentElement.classList.add('dark'); document.getElementById('theme-icon').className = "ph-fill ph-sun text-amber-400"; } 
            else { document.documentElement.classList.remove('dark'); document.getElementById('theme-icon').className = "ph-bold ph-moon text-slate-600"; }
        }

        function switchTab(tab) {
            currentTab = tab;
            const btnMy = document.getElementById('tab-my-tasks');
            const btnAssigned = document.getElementById('tab-assigned');
            const btnAll = document.getElementById('tab-all');
            
            const activeClass = "px-6 py-2 rounded-lg font-bold text-sm bg-white dark:bg-slate-600 shadow text-blue-700 dark:text-white transition";
            const inactiveClass = "px-6 py-2 rounded-lg font-bold text-sm text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition";
            
            btnMy.className = (tab === 'my-tasks') ? activeClass : inactiveClass;
            btnAssigned.className = (tab === 'assigned-tasks') ? activeClass : inactiveClass;
            btnAll.className = (tab === 'all-tasks') ? activeClass + " flex items-center gap-1" : inactiveClass + " flex items-center gap-1";
            
            renderTasks();
        }

        async function loadUsersDropdown() {
            const select = document.getElementById('task-assignee');
            try {
                // Lấy toàn bộ nhân sự
                const snap = await window.getDocs(window.collection(window.db, "nhan_su_noi_bo"));
                select.innerHTML = '<option value="">-- Chọn nhân sự (Bấm để gõ tìm) --</option>';
                
                // Tự động thêm chính mình lên đầu tiên (Tự giao việc)
                select.innerHTML += `<option value="${currentUserId}|${currentUserName}" class="font-bold text-blue-600">[TỰ GIAO] ${currentUserName} (${currentUserId})</option>`;
                
                snap.forEach(doc => {
                    const data = doc.data();
                    if(data.ma_nv && data.ho_ten && data.ma_nv !== currentUserId) {
                        select.innerHTML += `<option value="${data.ma_nv}|${data.ho_ten}">${data.ho_ten} (${data.ma_nv}) - ${data.bo_phan || ''}</option>`;
                    }
                });
            } catch (e) {
                select.innerHTML = '<option value="">Lỗi tải danh sách</option>';
            }
        }

        // TẢI TOÀN BỘ DATA 1 LẦN VÀ LƯU VÀO BIẾN (Chống lỗi Rule Firebase)
        async function fetchAllTasks() {
            const grid = document.getElementById('task-grid');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');
            
            grid.classList.add('hidden'); empty.classList.add('hidden'); loader.classList.remove('hidden');

            try {
                // Rule: Kéo hết data với collection(), không dùng query/where/orderBy
                const snap = await window.getDocs(window.collection(window.db, "ehs_tasks"));
                rawTasksData = [];
                snap.forEach(doc => rawTasksData.push({id: doc.id, ...doc.data()}));
                
                renderTasks();
            } catch (e) {
                console.error(e);
                loader.innerHTML = `<p class="text-red-500 font-bold"><i class="ph-bold ph-warning-circle text-2xl"></i> Lỗi máy chủ: ${e.message}</p>`;
            }
        }

        // LỌC VÀ HIỂN THỊ BẰNG JAVASCRIPT
        function renderTasks() {
            const grid = document.getElementById('task-grid');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');
            
            grid.innerHTML = '';
            
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const filterCat = document.getElementById('filter-category').value;

            // 1. Lọc theo Tab, Keyword và Category
            let filteredTasks = rawTasksData.filter(t => {
                // Lọc Tab
                let tabMatch = false;
                if (currentTab === 'my-tasks' && t.assignee_id === currentUserId) tabMatch = true;
                if (currentTab === 'assigned-tasks' && t.assigner_id === currentUserId) tabMatch = true;
                if (currentTab === 'all-tasks') tabMatch = true; // Góc Lãnh đạo nhìn hết
                if (!tabMatch) return false;

                // Lọc Category (Mảng)
                if (filterCat !== 'all' && t.category !== filterCat) return false;

                // Lọc Search
                const textSearch = ((t.title||"") + " " + (t.assignee_name||"") + " " + (t.assigner_name||"")).toLowerCase();
                if (keyword && !textSearch.includes(keyword)) return false;

                return true;
            });

            // 2. Sắp xếp Mới nhất lên đầu (Xử lý Timestamp Firebase)
            filteredTasks.sort((a,b) => {
                let timeA = a.created_at ? (a.created_at.toDate ? a.created_at.toDate().getTime() : a.created_at) : 0;
                let timeB = b.created_at ? (b.created_at.toDate ? b.created_at.toDate().getTime() : b.created_at) : 0;
                return timeB - timeA;
            });

            if(filteredTasks.length === 0) { 
                empty.classList.remove('hidden'); grid.classList.add('hidden'); loader.classList.add('hidden'); 
                return; 
            }

            filteredTasks.forEach(t => {
                const today = new Date(); today.setHours(0,0,0,0);
                const deadline = new Date(t.due_date);
                const isOverdue = deadline < today && t.status !== 'Done';
                
                let statusHtml = '';
                if (t.status === 'Done') statusHtml = `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-check-circle"></i> Đã đóng</span>`;
                else if (isOverdue) statusHtml = `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-warning-circle"></i> Quá hạn</span>`;
                else if (t.status === 'Review') statusHtml = `<span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-eye"></i> Chờ nghiệm thu</span>`;
                else if (t.progress > 0) statusHtml = `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-spinner animate-spin"></i> Đang làm</span>`;
                else statusHtml = `<span class="bg-slate-200 text-slate-600 px-2 py-1 rounded text-[10px] font-bold uppercase"><i class="ph-bold ph-clock"></i> Mới giao</span>`;

                // Badge mảng công việc
                let catColor = "bg-slate-100 text-slate-600";
                if(t.category === 'PCCC') catColor = "bg-orange-100 text-orange-700";
                if(t.category === 'ATVSV') catColor = "bg-teal-100 text-teal-700";
                let catBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold border border-current ${catColor} whitespace-nowrap">${t.category || 'Khác'}</span>`;

                const dateStr = deadline.toLocaleDateString('vi-VN');
                const parsedDesc = marked.parse(t.description || "");
                const isSelfAssigned = (t.assignee_id === t.assigner_id);

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-dark-card border ${isOverdue && t.status !== 'Done' ? 'border-red-300 shadow-[0_0_15px_rgba(239,68,68,0.15)]' : 'border-slate-200 dark:border-dark-border shadow-sm'} p-5 rounded-2xl flex flex-col`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex gap-2">${statusHtml} ${catBadge}</div>
                        <span class="text-xs font-mono font-bold ${isOverdue && t.status !== 'Done' ? 'text-red-600' : 'text-slate-500'}"><i class="ph-fill ph-calendar-blank"></i> ${dateStr}</span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-2 leading-tight">${t.title}</h3>
                    <div class="text-xs text-slate-500 dark:text-slate-400 mb-4 flex-1">
                        ${isSelfAssigned ? 
                            `<p class="text-indigo-600 dark:text-indigo-400 font-bold mb-1"><i class="ph-fill ph-user-circle"></i> Công việc tự lên kế hoạch</p>` :
                            `<p class="mb-1"><i class="ph-fill ph-user-circle"></i> Nhận: <b class="text-slate-700 dark:text-slate-200">${t.assignee_name}</b></p>
                             <p><i class="ph-fill ph-user-focus"></i> Giao: <b class="text-slate-700 dark:text-slate-200">${t.assigner_name}</b></p>`
                        }
                    </div>
                    
                    <div class="mb-4 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800 text-[13px] text-slate-600 dark:text-slate-300 max-h-32 overflow-y-auto custom-scrollbar prose dark:prose-invert prose-sm">
                        ${parsedDesc}
                    </div>

                    <div class="mt-auto pt-4 border-t border-slate-100 dark:border-slate-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Tiến độ</span>
                            <span class="text-xs font-black text-blue-600 dark:text-blue-400">${t.progress}%</span>
                        </div>
                        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-1.5 mb-4">
                            <div class="bg-blue-600 dark:bg-blue-500 h-1.5 rounded-full transition-all duration-500" style="width: ${t.progress}%"></div>
                        </div>
                        
                        <button onclick="openUpdateModal('${t.id}', '${t.title}', '${t.due_date}', ${t.progress}, '${t.status}', '${t.assigner_id}')" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-bold py-2 rounded-xl text-sm transition border border-slate-200 dark:border-slate-700">
                            Cập nhật / Đánh giá
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            loader.classList.add('hidden');
            empty.classList.add('hidden');
            grid.classList.remove('hidden');
        }

        function openTaskModal() { document.getElementById('task-modal').classList.remove('hidden'); }
        function closeTaskModal() { document.getElementById('task-modal').classList.add('hidden'); }

        async function generateAIPlan() {
            const title = document.getElementById('task-title').value.trim();
            if(!title) return alert("Vui lòng gõ Tên công việc trước khi yêu cầu AI lập kế hoạch!");
            
            const btn = document.getElementById('btn-ai');
            const desc = document.getElementById('task-desc');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Đang suy nghĩ...'; btn.disabled = true;
            
            try {
                const prompt = `Tôi là quản lý EHS. Tôi muốn giao nhiệm vụ: "${title}". Hãy chia nhỏ công việc này thành 3-5 bước thực hiện cốt lõi, ngắn gọn, dễ hiểu để nhân viên thực hiện. Trình bày dưới dạng danh sách gạch đầu dòng (Markdown).`;
                const payload = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2 } };

                const res = await fetch(AI_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                if (!res.ok) throw new Error("Lỗi gọi Server AI");
                const result = await res.json();
                
                if (result.candidates && result.candidates[0].content) {
                    desc.value = result.candidates[0].content.parts[0].text;
                } else {
                    desc.value = "AI đang bận. Bạn vui lòng tự nhập kế hoạch vào đây nhé.";
                }
            } catch (e) {
                alert("Lỗi kết nối AI Apps Script. Vui lòng tự gõ nội dung.");
            } finally {
                btn.innerHTML = ogText; btn.disabled = false;
            }
        }

        async function saveTask() {
            const title = document.getElementById('task-title').value.trim();
            const assigneeRaw = document.getElementById('task-assignee').value;
            const deadline = document.getElementById('task-deadline').value;
            const desc = document.getElementById('task-desc').value.trim();
            const cat = document.getElementById('task-category').value;

            if(!title || !assigneeRaw || !deadline) return alert("Vui lòng điền đủ Tên, Người nhận và Deadline!");

            const [assignee_id, assignee_name] = assigneeRaw.split('|');
            const btn = document.getElementById('btn-save-task');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Đang tải lên...'; btn.disabled = true;

            try {
                const newTask = {
                    title: title, description: desc, due_date: deadline, category: cat,
                    assigner_id: currentUserId, assigner_name: currentUserName,
                    assignee_id: assignee_id, assignee_name: assignee_name,
                    progress: 0, status: 'To Do', evaluation: '',
                    created_at: new Date()
                };
                
                await window.addDoc(window.collection(window.db, "ehs_tasks"), newTask);
                closeTaskModal();
                alert("Đã phát hành kế hoạch/công việc thành công!");
                
                // Reset form
                document.getElementById('task-title').value = ''; document.getElementById('task-desc').value = '';
                document.getElementById('task-assignee').value = ''; document.getElementById('task-deadline').value = '';
                
                // Reload data
                switchTab((assignee_id === currentUserId) ? 'my-tasks' : 'assigned-tasks');
                await fetchAllTasks(); 
                
            } catch (e) {
                alert("Lỗi lưu DB: " + e.message);
            } finally {
                btn.innerHTML = '<i class="ph-bold ph-paper-plane-tilt text-lg"></i> Phát Hành Kế Hoạch'; btn.disabled = false;
            }
        }

        let upTaskId = "";
        let upTaskAssigner = "";

        function openUpdateModal(id, title, date, progress, status, assignerId) {
            upTaskId = id; upTaskAssigner = assignerId;
            document.getElementById('up-task-id').value = id;
            document.getElementById('disp-title').innerText = title;
            document.getElementById('disp-deadline').innerText = new Date(date).toLocaleDateString('vi-VN');
            
            const progInput = document.getElementById('task-progress');
            progInput.value = progress; document.getElementById('prog-val').innerText = progress + '%';
            
            const isManager = (currentUserId === assignerId);
            const evalSec = document.getElementById('eval-section');
            const doneCheck = document.getElementById('task-done');
            
            if (isManager) {
                evalSec.classList.remove('hidden');
                doneCheck.checked = (status === 'Done');
            } else {
                evalSec.classList.add('hidden');
            }

            document.getElementById('update-modal').classList.remove('hidden');
            document.getElementById('btn-update-task').innerHTML = 'Cập nhật ngay';
            document.getElementById('btn-update-task').disabled = false;
        }

        function closeUpdateModal() { document.getElementById('update-modal').classList.add('hidden'); }

        async function saveUpdate() {
            const newProg = parseInt(document.getElementById('task-progress').value);
            const isManager = (currentUserId === upTaskAssigner);
            
            let updateData = { progress: newProg };
            
            if (isManager) {
                const evalText = document.getElementById('task-eval').value.trim();
                const isDone = document.getElementById('task-done').checked;
                updateData.evaluation = evalText;
                if (isDone) { updateData.status = 'Done'; updateData.progress = 100; }
                else if (updateData.status === 'Done' && !isDone) { updateData.status = 'In Progress'; }
            } else {
                if (newProg > 0 && newProg < 100) updateData.status = 'In Progress';
                if (newProg === 100) updateData.status = 'Review'; // Trình ký
            }

            const btn = document.getElementById('btn-update-task');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i>'; btn.disabled = true;

            try {
                await window.updateDoc(window.doc(window.db, "ehs_tasks", upTaskId), updateData);
                closeUpdateModal(); 
                await fetchAllTasks(); // Tải lại để cập nhật
            } catch(e) {
                alert("Lỗi cập nhật: " + e.message); btn.disabled = false; btn.innerHTML = 'Cập nhật ngay';
            }
        }

        window.onload = init;
    </script>
