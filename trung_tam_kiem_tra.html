<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung tâm Kiểm tra EHS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-5xl mx-auto">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-100 pb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-orange-600 flex items-center">
                        <i class="ph-fill ph-clipboard-text text-3xl mr-2"></i>
                        Trung tâm Kiểm tra Hiện trường
                    </h2>
                    <p class="text-slate-500 mt-1">Lựa chọn biểu mẫu đánh giá an toàn, vệ sinh và môi trường.</p>
                </div>
                <a href="index.html" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition border border-slate-200">
                    <i class="ph-bold ph-arrow-left"></i> Về Trang chủ
                </a>
            </div>

            <!-- CHUYỂN QUA DÙNG GRID CHO THẲNG HÀNG -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- 1. KIỂM TRA KHO HÓA CHẤT (Tím) -->
                <a href="kiem_tra_kho.html" class="group bg-purple-50 hover:bg-purple-600 p-6 rounded-xl border border-purple-100 hover:border-purple-600 transition-all duration-300 flex flex-col items-center text-center shadow-sm hover:shadow-md">
                    <div class="w-16 h-16 bg-purple-100 text-purple-600 group-hover:bg-white group-hover:text-purple-600 rounded-full flex items-center justify-center mb-4 transition-colors">
                        <i class="ph-fill ph-flask text-3xl"></i>
                    </div>
                    <h3 class="font-bold text-lg text-purple-800 group-hover:text-white transition-colors">Kiểm tra Kho Hóa Chất</h3>
                    <p class="text-sm text-purple-600/70 group-hover:text-purple-100 mt-2 transition-colors">Biểu mẫu FRM.EHS.04.1</p>
                </a>

                <!-- 2. AN TOÀN NHÀ THẦU (Đỏ) -->
                <a href="kiem_tra_nha_thau.html" class="group bg-rose-50 hover:bg-rose-600 p-6 rounded-xl border border-rose-100 hover:border-rose-600 transition-all duration-300 flex flex-col items-center text-center shadow-sm hover:shadow-md">
                    <div class="w-16 h-16 bg-rose-100 text-rose-600 group-hover:bg-white group-hover:text-rose-600 rounded-full flex items-center justify-center mb-4 transition-colors">
                        <i class="ph-fill ph-hard-hat text-3xl"></i>
                    </div>
                    <h3 class="font-bold text-lg text-rose-800 group-hover:text-white transition-colors">An toàn Nhà thầu</h3>
                    <p class="text-sm text-rose-600/70 group-hover:text-rose-100 mt-2 transition-colors">Biểu mẫu FRM.EHS.06.1</p>
                </a>

                <!-- 3. KIỂM TRA TỔNG THỂ NHÀ MÁY (Xanh Ngọc) -->
                <a href="kiem_tra_tong_the.html" class="group bg-emerald-50 hover:bg-emerald-600 p-6 rounded-xl border border-emerald-100 hover:border-emerald-600 transition-all duration-300 flex flex-col items-center text-center shadow-sm hover:shadow-md">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 group-hover:bg-white group-hover:text-emerald-600 rounded-full flex items-center justify-center mb-4 transition-colors">
                        <i class="ph-fill ph-check-square-offset text-3xl"></i>
                    </div>
                    <h3 class="font-bold text-lg text-emerald-800 group-hover:text-white transition-colors">Đánh giá An toàn & 5S</h3>
                    <p class="text-sm text-emerald-600/70 group-hover:text-emerald-100 mt-2 transition-colors">Kiểm tra tổng thể định kỳ</p>
                </a>
            </div>

        </div>
    </div>
</body>
</html>
